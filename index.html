        <button class="btn pri" id="spStart">${tr("Prüfung starten")}</button>`;
    return `<button class="btn" id="spAdd" style="margin-right:auto">${tr("Ins Wörterbuch")}</button>
      <button class="btn" id="spSkipAll">${tr("Alle ignorieren")}</button>
      <button class="btn" id="spSkip">${tr("Ignorieren")}</button>
      <button class="btn" id="spFixAll">${tr("Alle ändern")}</button>
      <button class="btn pri" id="spFix">${tr("Ändern")}</button>`;
  };
  const paint=()=>{
    $("#spBody").innerHTML=body();
    $("#spFoot").innerHTML=foot();
    const cnt=$("#spCount");
    if(cnt)cnt.textContent=spellState==="run"&&spellHits.length
      ?`${spellIdx+1} ${OFWORD()} ${spellHits.length}`:"";
    bind();
  };

  const start=async()=>{
    spellState="load";spellProg=0;paint();
    try{
      if(!SPELL||SPELL.lang!==S.settings.lang){
        const eng=await spellLoad(S.settings.lang,p=>{
          spellProg=p;const b=$("#spProg");if(b)b.style.width=Math.round(p*100)+"%";
        });
        SPELL={lang:S.settings.lang,eng};
      }
    }catch(e){spellState="fail";paint();return}
    spellIgnore=new Set();spellIdx=0;spellSug=0;
    const n=spellScan();
    spellState=n?"run":"clean";
    if(n)spellFocus();
    paint();
  };
  /* Nach jedem Eingriff bleibt der Zeiger stehen: die Stelle danach rückt an
     seine Position nach. Ein erneuter Durchlauf wäre unnötig und würde die
     Stelle im Text verlieren. */
  const drop=el=>{
    const i=spellHits.indexOf(el);
    if(i>=0)spellHits.splice(i,1);
    unwrap(el);
  };
  const after=()=>{
    flush();dirty=true;commit();queuePaginate();
    if(spellIdx>=spellHits.length)spellIdx=Math.max(0,spellHits.length-1);
    spellSug=0;
    if(!spellHits.length){spellState="clean";paint();return}
    spellFocus();paint();
  };
  const replaceCur=(txt,all)=>{
    const cur=spellHits[spellIdx];if(!cur)return;
    const word=cur.textContent;
    const targets=all?spellHits.filter(h=>h.textContent===word):[cur];
    targets.forEach(t=>{
      const i=spellHits.indexOf(t);if(i>=0)spellHits.splice(i,1);
      t.replaceWith(document.createTextNode(txt));
    });
    after();
  };
  const bind=()=>{
    const cl=$("#spClose");if(cl)cl.onclick=()=>closeOvl();   /* räumt über spellDone auf */
    const st=$("#spStart");if(st)st.onclick=start;
    const ls=$("#spLang");if(ls)ls.onchange=e=>{
      S.settings.lang=e.target.value;save();
      const ed=$("#editor");if(ed)ed.setAttribute("lang",S.settings.lang);
      spellClear();spellState="idle";paint();
    };
    const list=$("#spList");
    if(list){
      list.onclick=e=>{
        const li=e.target.closest("li[data-i]");if(!li)return;
        spellSug=+li.dataset.i;
        list.querySelectorAll("li").forEach(x=>x.classList.toggle("on",x===li));
      };
      list.ondblclick=e=>{
        const li=e.target.closest("li[data-i]");if(!li)return;
        replaceCur(li.textContent);
      };
    }
    const fix=$("#spFix");
    if(fix)fix.onclick=()=>{
      const li=$("#spList")?$("#spList").querySelector("li.on"):null;
      if(!li)return;replaceCur(li.textContent);
    };
    const fixAll=$("#spFixAll");
    if(fixAll)fixAll.onclick=()=>{
      const li=$("#spList")?$("#spList").querySelector("li.on"):null;
      if(!li)return;replaceCur(li.textContent,true);
    };
    const sk=$("#spSkip");
    if(sk)sk.onclick=()=>{
      if(!spellHits.length)return;
      spellIdx=(spellIdx+1)%spellHits.length;spellSug=0;spellFocus();paint();
    };
    const skAll=$("#spSkipAll");
    if(skAll)skAll.onclick=()=>{
      const w=spellCurrentWord();if(!w)return;
      spellIgnore.add(w);
      spellHits.filter(h=>h.textContent===w).forEach(drop);
      after();
    };
    const add=$("#spAdd");
    if(add)add.onclick=()=>{
      const w=spellCurrentWord();if(!w)return;
      if(!S.userDict)S.userDict=[];
      if(!S.userDict.includes(w))S.userDict.push(w);
      save();SPELL.eng.addWord(w);spellIgnore.add(w);
      spellHits.filter(h=>h.textContent===w).forEach(drop);
      toast(tr("Ins Wörterbuch übernommen"));
      after();
    };
  };

  /* Breite Ausführung: die fünf Schaltflächen brauchen zusammen 514px und
     brächen im 520er-Dialog immer um — die Hauptaktion „Ändern“ stünde dann
     allein in einer zweiten Zeile. */
  overlay(`<div class="modal wide"><h3>${tr("Rechtschreibprüfung")}</h3>
    <div class="pad" id="spBody"></div>
    <div class="rowend" id="spFoot"></div></div>`);
  paint();
  /* Sind die Fehler schon markiert (Klick auf ein rot unterringeltes Wort),
     springt der Dialog gleich dorthin, statt wieder von vorn anzufangen. */
  if(spellState==="run"&&spellHits.length)spellFocus();
  else if(SPELL&&SPELL.lang===S.settings.lang&&spellState==="idle")start();
}

/* ================= Text bereinigen ================= */
/* Vier stille Übeltäter, die man beim Schreiben kaum sieht: doppelte
   Leerzeichen (im Editor unsichtbar, weil der Browser sie zusammenzieht —
   aber TXT/Markdown/Word-Export zeigen sie ungeschönt), geschützte Leerzeichen
   aus eingefügtem Web-/Word-Text, Leerzeichen direkt vor einem Zeilenumbruch
   oder Absatzende, und mehrfach leere Absätze vom versehentlichen
   Mehrfach-Enter. Läuft nach demselben Muster wie die Rechtschreibprüfung:
   scannen, markieren, einzeln durchgehen — hier aber ohne Wörterbuch, also
   ohne Ladezeit, deshalb startet der Scan sofort beim Öffnen. */
const CLEAN_SKIP=".toc,.fhwrap,sup.fn";
const CLEAN_BLOCKSEL="p,h1,h2,h3,h4,h5,h6,li,td,th,blockquote,figcaption";
let cleanHits=[],cleanIdx=0,cleanState="idle";

function cleanClear(){
  const ed=$("#editor");if(!ed)return;
  ed.querySelectorAll(".cleanerr").forEach(unwrap);
  ed.querySelectorAll(".cleanp").forEach(p=>p.classList.remove("cleanp","cur"));
  cleanHits=[];
}
function cleanDone(){
  const hatte=cleanHits.length>0;
  cleanClear();cleanState="idle";
  if(hatte){flush();dirty=true;commit();queuePaginate()}
}
/* Innerhalb eines Textknotens: Leerzeichen am Blockende zuerst (das Ende
   „gewinnt“ gegen die anderen beiden), dann Mehrfach-Leerzeichen, dann
   geschützte Leerzeichen — jeweils nur, was noch nicht beansprucht ist, damit
   sich die drei Funde nie überlappen. */
function cleanScanNode(v,boundary){
  const claimed=new Array(v.length).fill(false);
  const runs=[];
  if(boundary){
    const m=/[ \t ]+$/.exec(v);
    if(m){runs.push({at:m.index,len:m[0].length,kind:"trail"});
      for(let i=m.index;i<v.length;i++)claimed[i]=true}
  }
  let rx=/ {2,}/g,m;
  while(m=rx.exec(v)){
    if(claimed[m.index])continue;
    runs.push({at:m.index,len:m[0].length,kind:"dbl"});
    for(let i=m.index;i<m.index+m[0].length;i++)claimed[i]=true;
  }
  rx=/ +/g;
  while(m=rx.exec(v)){
    if(claimed[m.index])continue;
    runs.push({at:m.index,len:m[0].length,kind:"nbsp"});
  }
  runs.sort((a,b)=>a.at-b.at);
  return runs;
}
/* Blockweise statt über den ganzen Editor auf einmal: nur so lässt sich
   sauber feststellen, welcher Textknoten der letzte vor einem <br> oder dem
   Blockende ist — das Kriterium für „steht am Zeilenende“. Verschachtelte
   Blöcke (kommen in diesem Dokumentmodell praktisch nicht vor) werden
   übersprungen, weil ihr TreeWalker sie ohnehin schon mit erfasst. */
function cleanFindTextRuns(ed){
  const all=[...ed.querySelectorAll(CLEAN_BLOCKSEL)];
  const blocks=all.filter(b=>!b.parentElement.closest(CLEAN_BLOCKSEL));
  const jobs=[];
  blocks.forEach(block=>{
    if(block.closest(CLEAN_SKIP))return;
    const seq=[];
    const walk=document.createTreeWalker(block,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{
      acceptNode(node){
        if(node.nodeType===3)return NodeFilter.FILTER_ACCEPT;
        if(node.nodeType===1&&node.tagName==="BR")return NodeFilter.FILTER_ACCEPT;
        return NodeFilter.FILTER_SKIP;
      }});
    let x;while(x=walk.nextNode())seq.push(x);
    const boundary=new Set();let lastText=null;
    for(const item of seq){
      if(item.nodeType===3)lastText=item;
      else{if(lastText)boundary.add(lastText);lastText=null}
    }
    if(lastText)boundary.add(lastText);
    seq.forEach(tn=>{
      if(tn.nodeType!==3||!tn.nodeValue)return;
      const runs=cleanScanNode(tn.nodeValue,boundary.has(tn));
      if(runs.length)jobs.push([tn,runs]);
    });
  });
  return jobs;
}
/* Läufe aus mehr als einer leeren Zeile hintereinander — auf oberster Ebene,
   eine tiefer verschachtelte Leerstelle (in einer Tabellenzelle etwa) ist
   etwas anderes als ein versehentliches Mehrfach-Enter im Fließtext. */
function cleanFindEmptyParaRuns(ed){
  const isEmpty=el=>{
    if(el.tagName!=="P"||el.closest(CLEAN_SKIP))return false;
    const t=(el.textContent||"").replace(/​/g,"").trim();
    return !t&&!el.querySelector("figure,img,table");
  };
  /* Bis zu zwei leere Absätze hintereinander gelten als bewusster Abstand
     (z. B. zwischen Abschnitten) und werden nicht angerührt — erst ab drei
     ist es der typische Unfall durch mehrfaches Enter. */
  const groups=[];let run=[];
  [...ed.children].forEach(el=>{
    if(isEmpty(el))run.push(el);
    else{if(run.length>2)groups.push(run.slice());run=[]}
  });
  if(run.length>2)groups.push(run.slice());
  return groups;
}
function cleanScan(){
  const ed=$("#editor");if(!ed)return 0;
  cleanClear();
  cleanFindTextRuns(ed).forEach(([node,runs])=>{
    const frag=document.createDocumentFragment();const v=node.nodeValue;let last=0;
    runs.forEach(r=>{
      if(r.at>last)frag.appendChild(document.createTextNode(v.slice(last,r.at)));
      const sp=document.createElement("span");
      sp.className="cleanerr";sp.dataset.kind=r.kind;
      sp.textContent=v.slice(r.at,r.at+r.len);
      frag.appendChild(sp);last=r.at+r.len;
    });
    frag.appendChild(document.createTextNode(v.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
  const groups=cleanFindEmptyParaRuns(ed);
  groups.forEach(g=>g.slice(2).forEach(p=>p.classList.add("cleanp")));
  cleanHits=[
    ...[...ed.querySelectorAll(".cleanerr")].map(el=>({kind:el.dataset.kind,el})),
    ...groups.map(g=>({kind:"para",el:g[2],group:g}))
  ];
  /* Nach Position im Dokument sortieren, damit „Weiter“ sich wie Lesen anfühlt
     — .cleanerr kommt schon in DOM-Reihenfolge aus querySelectorAll, die
     Absatz-Funde müssen erst eingemischt werden. */
  cleanHits.sort((a,b)=>{
    const p=a.el.compareDocumentPosition(b.el);
    return(p&Node.DOCUMENT_POSITION_FOLLOWING)?-1:(p&Node.DOCUMENT_POSITION_PRECEDING)?1:0;
  });
  return cleanHits.length;
}
function cleanFocus(){
  cleanHits.forEach((h,i)=>{
    const els=h.kind==="para"?h.group.slice(2):[h.el];
    els.forEach(el=>el.classList.toggle("cur",i===cleanIdx));
  });
  const cur=cleanHits[cleanIdx];
  const target=cur&&(cur.kind==="para"?cur.group[1]:cur.el);
  if(target)target.scrollIntoView({block:"center",behavior:"auto"});
}
/* Anwenden: „dbl“ auf ein Leerzeichen kürzen, „trail“ ganz entfernen, „nbsp“
   in ebenso viele normale Leerzeichen umwandeln (nicht zu einem — geschützte
   Leerzeichen stehen manchmal absichtlich für mehrere Zeichen Abstand),
   „para“ entfernt die übrigen Absätze eines Laufs und lässt genau einen stehen. */
function cleanApply(h){
  if(h.kind==="para"){h.group.slice(2).forEach(p=>p.remove());return}
  let rep="";
  if(h.kind==="dbl")rep=" ";
  else if(h.kind==="nbsp")rep=" ".repeat(h.el.textContent.length);
  h.el.replaceWith(document.createTextNode(rep));
}
/* Ignorieren heißt: Markierung weg, Text bleibt exakt wie er war. */
function cleanIgnoreMark(h){
  if(h.kind==="para")h.group.slice(2).forEach(p=>p.classList.remove("cleanp"));
  else unwrap(h.el);
}
function cleanContextText(h){
  const c=spellContext(h.el);
  const mid=h.kind==="nbsp"?"·".repeat(c.word.length):c.word;
  return{pre:c.pre,mid,post:c.post};
}
function cleanDialog(){
  if(S.mode!=="write")setMode("write");
  const KIND={
    dbl:()=>tr("Doppeltes Leerzeichen"),
    trail:()=>tr("Leerzeichen am Zeilenende"),
    nbsp:()=>tr("Geschütztes Leerzeichen"),
    para:()=>tr("Mehrere leere Absätze")
  };
  const body=()=>{
    if(cleanState==="clean")
      return`<div class="spellbig">${tr("Nichts zu bereinigen gefunden.")}</div>
        <div class="fmttip">${tr("Geprüft wurden doppelte und geschützte Leerzeichen, Leerzeichen am Zeilenende und mehrfach leere Absätze.")}</div>`;
    if(cleanState!=="run"||!cleanHits.length)return"";
    const h=cleanHits[cleanIdx];
    if(h.kind==="para"){
      const n=h.group.length;   /* die Gesamtlänge des Laufs — zwei davon bleiben stehen */
      return`<div class="spellsub">${KIND.para()}</div>
        <div class="spellctx">${PL(
          `${n} aufeinanderfolgende leere Absätze werden auf zwei gekürzt.`,
          `${n} consecutive empty paragraphs will be reduced to two.`,
          `${n} paragraphes vides consécutifs seront réduits à deux.`,
          `${n} párrafos vacíos consecutivos se reducirán a dos.`,
          `${n} parágrafos vazios consecutivos serão reduzidos a dois.`)}</div>`;
    }
    const c=cleanContextText(h);
    return`<div class="spellsub">${KIND[h.kind]()}</div>
      <div class="spellctx cleanctx">${esc(c.pre)}<b>${esc(c.mid)}</b>${esc(c.post)}</div>`;
  };
  const foot=()=>{
    if(cleanState==="clean")return`<button class="btn pri" id="clClose">${tr("Fertig")}</button>`;
    if(cleanState!=="run"||!cleanHits.length)
      return`<button class="btn" id="clClose">${tr("Abbrechen")}</button>`;
    return`<button class="btn" id="clSkipAll">${tr("Alle ignorieren")}</button>
      <button class="btn" id="clSkip">${tr("Ignorieren")}</button>
      <button class="btn" id="clFixAll">${tr("Alles bereinigen")}</button>
      <button class="btn pri" id="clFix">${tr("Bereinigen")}</button>`;
  };
  const paint=()=>{
    $("#clBody").innerHTML=body();
    $("#clFoot").innerHTML=foot();
    const cnt=$("#clCount");
    if(cnt)cnt.textContent=cleanState==="run"&&cleanHits.length
      ?`${cleanIdx+1} ${OFWORD()} ${cleanHits.length}`:"";
    bind();
  };
  const after=()=>{
    flush();dirty=true;commit();queuePaginate();
    if(cleanIdx>=cleanHits.length)cleanIdx=Math.max(0,cleanHits.length-1);
    if(!cleanHits.length){cleanState="clean";paint();return}
    cleanFocus();paint();
  };
  const bind=()=>{
    const cl=$("#clClose");if(cl)cl.onclick=()=>closeOvl();   /* räumt über cleanDone auf */
    const fix=$("#clFix");if(fix)fix.onclick=()=>{
      const h=cleanHits[cleanIdx];if(!h)return;
      cleanApply(h);cleanHits.splice(cleanIdx,1);after();
    };
    const fixAll=$("#clFixAll");if(fixAll)fixAll.onclick=()=>{
      cleanHits.slice().forEach(cleanApply);cleanHits=[];after();
    };
    const sk=$("#clSkip");if(sk)sk.onclick=()=>{
      if(!cleanHits.length)return;
      cleanIdx=(cleanIdx+1)%cleanHits.length;cleanFocus();paint();
    };
    const skAll=$("#clSkipAll");if(skAll)skAll.onclick=()=>{
      cleanHits.forEach(cleanIgnoreMark);cleanHits=[];
      flush();dirty=true;commit();queuePaginate();
      cleanState="clean";paint();
    };
  };
  overlay(`<div class="modal"><h3>${tr("Text bereinigen")}</h3>
    <div class="pad" id="clBody"></div>
    <div class="rowend" id="clFoot"></div></div>`);
  const n=cleanScan();
  cleanIdx=0;cleanState=n?"run":"clean";
  if(n)cleanFocus();
  paint();
}

/* ================= Suchen und Ersetzen ================= */
let fdIdx=0,fdHits=[];
function fdClear(){
  const ed=$("#editor");if(!ed)return;
  ed.querySelectorAll(".hit").forEach(unwrap);
  fdHits=[];
}
function fdRun(keepIdx){
  const ed=$("#editor");if(!ed)return;
  fdClear();
  const q=$("#fdQ").value;
  if(!q){$("#fdCnt").textContent="—";return}
  const flags="g"+($("#fdCs").checked?"":"i");
  const esc2=q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const rx=new RegExp($("#fdWw").checked?"\\b"+esc2+"\\b":esc2,flags);
  const walk=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);
  const nodes=[];let n;
  while(n=walk.nextNode())if(n.nodeValue&&rx.test(n.nodeValue)){rx.lastIndex=0;nodes.push(n)}
  nodes.forEach(node=>{
    const frag=document.createDocumentFragment();let last=0,m;rx.lastIndex=0;
    while(m=rx.exec(node.nodeValue)){
      if(m.index>last)frag.appendChild(document.createTextNode(node.nodeValue.slice(last,m.index)));
      const sp=document.createElement("span");sp.className="hit";sp.textContent=m[0];
      frag.appendChild(sp);last=m.index+m[0].length;
      if(m[0]==="")rx.lastIndex++;
    }
    frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
  fdHits=[...ed.querySelectorAll(".hit")];
  if(!keepIdx)fdIdx=0;
  fdIdx=Math.min(fdIdx,Math.max(0,fdHits.length-1));
  fdMark();
}
function fdMark(scroll){
  fdHits.forEach((h,i)=>h.classList.toggle("cur",i===fdIdx));
  $("#fdCnt").textContent=fdHits.length?`${fdIdx+1} ${OFWORD()} ${fdHits.length}`:tr("kein Treffer");
  if(scroll!==false&&fdHits[fdIdx])fdHits[fdIdx].scrollIntoView({block:"center",behavior:"smooth"});
}
function fdStep(d){
  if(!fdHits.length)return;
  fdIdx=(fdIdx+d+fdHits.length)%fdHits.length;fdMark();
}
function fdOpen(withReplace){
  if(S.mode!=="write")setMode("write");
  const bar=$("#findbar");bar.classList.add("on");
  $("#fdRepRow").style.display=withReplace?"flex":$("#fdRepRow").style.display;
  const sel=getSelection();
  if(sel.rangeCount&&!sel.isCollapsed){
    const t=sel.toString().trim();if(t&&t.length<60)$("#fdQ").value=t;
  }
  $("#fdQ").focus();$("#fdQ").select();fdRun();
}
function fdClose(){
  fdClear();$("#findbar").classList.remove("on");
  const ed=$("#editor");if(ed)ed.focus();
}
function fdReplaceOne(){
  if(!fdHits.length)return;
  const h=fdHits[fdIdx];if(!h)return;
  const txt=$("#fdR").value;
  h.replaceWith(document.createTextNode(txt));
  flush();dirty=true;commit();
  fdRun(true);queuePaginate();
}
function fdReplaceAll(){
  if(!fdHits.length)return;
  const txt=$("#fdR").value,n=fdHits.length;
  fdHits.forEach(h=>h.replaceWith(document.createTextNode(txt)));
  fdHits=[];
  flush();dirty=true;commit();
  fdRun();queuePaginate();toast(PL(
    n+(n===1?" Stelle ersetzt":" Stellen ersetzt"),
    n+(n===1?" match replaced":" matches replaced"),
    n+(n===1?" occurrence remplacée":" occurrences remplacées"),
    n+(n===1?" coincidencia reemplazada":" coincidencias reemplazadas"),
    n+(n===1?" ocorrência substituída":" ocorrências substituídas")));
}
$("#fdQ").addEventListener("input",()=>fdRun());
$("#fdQ").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();e.shiftKey?fdStep(-1):fdStep(1)}
  if(e.key==="Escape"){e.preventDefault();fdClose()}});
$("#fdR").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();fdReplaceOne()}
  if(e.key==="Escape"){e.preventDefault();fdClose()}});
$("#fdNext").onclick=()=>fdStep(1);
$("#fdPrev").onclick=()=>fdStep(-1);
$("#fdClose").onclick=fdClose;
$("#fdRep").onclick=fdReplaceOne;
$("#fdRepAll").onclick=fdReplaceAll;
$("#fdCs").onchange=()=>fdRun();
$("#fdWw").onchange=()=>fdRun();
$("#fdToggleRep").onclick=()=>{
  const r=$("#fdRepRow");
  r.style.display=r.style.display==="none"?"flex":"none";
  if(r.style.display==="flex")$("#fdR").focus();
};

/* ================= Schrägstrich-Menü ================= */
const SLASH=[
  {n:"Überschrift 1",k:"ueberschrift h1 titel heading title",f:()=>document.execCommand("formatBlock",false,"h1")},
  {n:"Überschrift 2",k:"ueberschrift h2 heading",f:()=>document.execCommand("formatBlock",false,"h2")},
  {n:"Überschrift 3",k:"ueberschrift h3 heading",f:()=>document.execCommand("formatBlock",false,"h3")},
  {n:"Aufzählung",k:"liste punkte bullet list",f:()=>document.execCommand("insertUnorderedList")},
  {n:"Nummerierung",k:"liste nummer ordered numbered",f:()=>document.execCommand("insertOrderedList")},
  {n:"Tabelle",k:"tabelle table raster",f:()=>setTimeout(tablePicker,20)},
  {n:"Seitenumbruch",k:"umbruch seite break page",f:insertPageBreak},
  {n:"Bild",k:"bild foto grafik image picture",f:pickImage},
  {n:"Link",k:"link url verweis",f:()=>setTimeout(linkDialog,20)},
  {n:"Notiz anheften",k:"notiz kommentar anker note pin",f:()=>setTimeout(linkSelection,20)},
  {n:"Fußnote",k:"fussnote fußnote footnote referenz reference",f:insertFootnote},
  {n:"Inhaltsverzeichnis",k:"inhaltsverzeichnis toc gliederung index",f:insertToc},
  {n:"Abbildungsverzeichnis",k:"abbildungsverzeichnis bilder figures tof",f:insertTof},
  {n:"Datum",k:"datum heute date",f:()=>document.execCommand("insertText",false,new Date().toLocaleDateString(LOC()))}
];
let slashOn=false,slashIdx=0,slashHits=[],slashBlock=null;
function curBlock(){
  const s=getSelection();if(!s.rangeCount)return null;
  let n=s.getRangeAt(0).startContainer;
  n=n.nodeType===1?n:n.parentElement;

const IMG_MAXPX=1500,IMG_Q=.82;
function pickImage(){
  const i=document.createElement("input");i.type="file";i.accept="image/*";
  i.onchange=()=>{const f=i.files[0];if(f)addImage(f)};i.click();

/* Herunterrechnen und neu kodieren. Eigener Baustein, weil dieselbe Strecke
   für selbst gewählte wie für eingefügte Bilder gilt — ein Bild aus der
   Zwischenablage darf so wenig in Originalgröße im Browserspeicher landen wie
   eines von der Festplatte. */
function scaleToDataUrl(src,alsPng){
  return new Promise((resolve,reject)=>{
    const im=new Image();
    im.onload=()=>{
      let w=im.width,h=im.height;
      if(!w||!h){reject(new Error("leer"));return}
      const sc=Math.min(1,IMG_MAXPX/Math.max(w,h));
      w=Math.round(w*sc);h=Math.round(h*sc);
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(im,0,0,w,h);
      try{resolve(cv.toDataURL(alsPng?"image/png":"image/jpeg",IMG_Q))}
      catch(e){reject(e)}          /* fremdes Bild ohne CORS: Canvas ist gesperrt */
    };
    im.onerror=()=>reject(new Error("laden"));
    im.src=src;
  });

const blobToDataUrl=b=>new Promise((res,rej)=>{
  const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});

   füllt durchsichtige Flächen schwarz — ein freigestelltes Logo käme sonst auf
   schwarzem Grund heraus. SVG gehört ausdrücklich dazu. */

function addImage(file){
  if(!file.type.startsWith("image/")){toast(tr("Keine Bilddatei"));return}
  blobToDataUrl(file)
    .then(roh=>scaleToDataUrl(roh,magPng(file.type)))
    .then(data=>{
      insertFigure(data,file.name.replace(/\.[^.]+$/,""));
      if(data.length>1.2e6)toast(tr("Großes Bild — der Browser-Speicher ist begrenzt"));
    })

}
/* Aus einer Webseite eingefügte Bilder hängen zunächst an ihrer Herkunfts-

   Quellseite jedes Öffnen des Dokuments. Sie werden deshalb nachgeladen und
   eingebettet — wie in Word und Google Docs, wo ein Fernverweis gar nicht erst
   entsteht. Nachladen darf der Browser aber nur, wo der fremde Server es per
   CORS erlaubt; sonst bleibt der Verweis stehen und der Benutzer erfährt es. */
async function embedRemoteImages(bilder){
  const ed=$("#editor");
  if(!ed||!bilder||!bilder.length)return;
  let ok=0,fehl=0;
  for(const img of bilder){
    const url=img.getAttribute("src");
    if(!url||!/^https?:/i.test(url))continue;
    try{
      const r=await fetch(url,{mode:"cors",credentials:"omit"});
      if(!r.ok)throw new Error(r.status);
      const blob=await r.blob();
      if(!/^image\//.test(blob.type))throw new Error("kein Bild");
      const data=await scaleToDataUrl(await blobToDataUrl(blob),magPng(blob.type));
      if(!ed.contains(img))continue;      /* zwischenzeitlich gelöscht */
      img.setAttribute("src",data);ok++;
    }catch(e){fehl++}
  }
  if(ok){flush();dirty=true;commit();queuePaginate()}
  if(fehl)toast(PL(
    fehl===1?"1 Bild ließ sich nicht einbetten und bleibt mit der Quelle verknüpft."
            :fehl+" Bilder ließen sich nicht einbetten und bleiben mit der Quelle verknüpft.",
    fehl===1?"1 image could not be embedded and stays linked to its source."
            :fehl+" images could not be embedded and stay linked to their source.",
    fehl===1?"1 image n'a pas pu être intégrée et reste liée à sa source."
            :fehl+" images n'ont pas pu être intégrées et restent liées à leur source.",
    fehl===1?"1 imagen no se pudo incrustar y permanece vinculada a su origen."
            :fehl+" imágenes no se pudieron incrustar y permanecen vinculadas a su origen.",
    fehl===1?"1 imagem não pôde ser incorporada e permanece vinculada à origem."
            :fehl+" imagens não puderam ser incorporadas e permanecem vinculadas à origem."));
}

function placeFreeFigs(){

  ed.querySelectorAll("figure.fig[data-sig]:not(.free)").forEach(fig=>{
    const im=fig.querySelector("img");
    const w=Math.min(g.cw,55);

function inSichtBringen(el){

  if(!r.height)return;

  if(!rect.height){

function freeFigMouseDown(e){

/* Bei rechtsbündigen Bildern ist die rechte Kante fest — dort gehört der Anfasser nach links */
const figFreeSide=f=>(f.style.textAlign==="right")?"left":"right";
function placeFigHandle(){
  const h=$("#figrsz"),paper=$("#paper");
  if(!h)return;
  const im=selFig&&selFig.querySelector("img");
  if(!selFig||!im||!paper||S.mode!=="write"){h.classList.remove("on");return}
  const pr=paper.getBoundingClientRect(),ir=im.getBoundingClientRect();
  const x=figFreeSide(selFig)==="right"?ir.right-pr.left:ir.left-pr.left;
  h.style.left=(x-7)+"px";
  h.style.top=(ir.bottom-pr.top-7)+"px";
  h.style.cursor=figFreeSide(selFig)==="right"?"nwse-resize":"nesw-resize";
  h.classList.add("on");
}
function figResizeDrag(e){
  const im=selFig&&selFig.querySelector("img");
  if(!im)return;
  e.preventDefault();
  const ed=$("#editor");
  /* Prozent beziehen sich auf die Textbreite, nicht auf die Bildbreite */
  const cs=getComputedStyle(ed);
  const cw=ed.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const startX=e.clientX,startW=+(selFig.dataset.w||70);
  const align=selFig.style.textAlign||"center";
  /* Zentrierte Bilder wachsen an beiden Seiten, brauchen also den doppelten Faktor */
  const faktor=(align==="center"?2:1)*(figFreeSide(selFig)==="right"?1:-1);
  const move=ev=>{
    const w=Math.min(100,Math.max(10,Math.round(startW+faktor*(ev.clientX-startX)/cw*100)));
    if(w===+(selFig.dataset.w||70))return;
    selFig.dataset.w=w;im.style.width=w+"%";
    const s=$("#ibW");if(s)s.value=w;
    const p=$("#ibP");if(p)p.textContent=w+" %";
    placeFigHandle();
  };
  const up=()=>{
    document.removeEventListener("mousemove",move);
    document.removeEventListener("mouseup",up);
    flush();dirty=true;commit();queuePaginate();drawStatus();
    setTimeout(()=>{drawImgBar();placeFigHandle()},0);
  };
  document.addEventListener("mousemove",move);
  document.addEventListener("mouseup",up);
}
function drawImgBar(){
  const f=selFig,bar=$("#imgbar");if(!f){bar.classList.remove("on");return}
  const w=+(f.dataset.w||70), al=f.style.textAlign||"center";

  bar.innerHTML=`
    <input type="range" id="ibW" min="10" max="100" step="5" value="${w}" title="${tr("Breite")}">

    <div class="sep"></div>

    <button class="tb ${al==="center"?"on":""}" data-ia="center" title="${tr("Zentriert")}">${ICO('<path d="M4 6h16M7 11h10M5 16h14M8 21h8"/>')}</button>
    <button class="tb ${al==="right"?"on":""}" data-ia="right" title="${tr("Rechts")}">${ICO('<path d="M4 6h16M10 11h10M6 16h14M12 21h8"/>')}</button>

  klon.querySelectorAll("[id]").forEach(el=>el.removeAttribute("id"));
  klon.querySelectorAll(".hfhint,.hfedit,.hfgrip,.figrsz,.pageflag,.ruler").forEach(el=>el.remove());
  klon.querySelectorAll("[contenteditable]").forEach(el=>el.setAttribute("contenteditable","false"));
  klon.querySelectorAll(".sel").forEach(el=>el.classList.remove("sel"));
  klon.style.cssText+=";position:absolute;left:0;top:0;transform-origin:top left;transform:scale("+s+")";
  const box=document.createElement("div");
  box.style.cssText=`position:relative;width:${pw*s}px;height:${ph*s}px`;
  box.appendChild(klon);
  const w=$("#pvwrap");
  w.innerHTML=`<div class="pvbar">
      <b style="color:var(--ink)">${tr("Druckvorschau")}</b>
      <span>${tr(fmtOf(doc()).n)} &middot; ${pageCount} ${tr(pageCount===1?"Seite":"Seiten")}</span>
      <div style="flex:1"></div>
      <button class="btn" id="pvPrint">${tr("Drucken")}&hellip;</button>
      <button class="btn pri" id="pvClose">${tr("Schließen (Esc)")}</button>
    </div><div class="pvinner"></div>`;
  w.querySelector(".pvinner").appendChild(box);
  w.classList.add("on");w.scrollTop=0;pvOn=true;
  $("#pvClose").onclick=pvClose;
  $("#pvPrint").onclick=()=>{setPrintPage();setTimeout(()=>window.print(),60)};
}
function pvClose(){
  const w=$("#pvwrap");if(w){w.classList.remove("on");w.innerHTML=""}
  pvOn=false;const ed=$("#editor");ed&&ed.focus();
}
function zoomPresets(){
  if($("#zmenu")){closeMenu();return}
  closeMenu();
  const vals=[50,75,100,125,150,200];
  const m=document.createElement("div");m.className="menu ctx";m.id="zmenu";
  const istVorgabe=vals.includes(Math.round(S.zoom*100));
  m.innerHTML=vals.map(v=>`<button class="mi" data-z="${v}"><span class="chk">${Math.round(S.zoom*100)===v?"&#10003;":""}</span>${v} %</button>`).join("")
    +`<div class="msep"></div><button class="mi" data-z="fit"><span class="chk">${S.fitPage!==false?"&#10003;":""}</span>${tr("Seitenbreite einpassen")}<span class="k">Alt ⇧ 0</span></button>`
    +`<button class="mi" data-z="custom"><span class="chk">${(!istVorgabe&&S.fitPage===false)?"&#10003;":""}</span>${tr("Eigene Größe&hellip;")}</button>`;
  document.body.appendChild(m);
  const r=$("#zVal").getBoundingClientRect();
  m.style.left=Math.max(8,Math.min(r.left-40,innerWidth-m.offsetWidth-8))+"px";
  m.style.top=(r.top-m.offsetHeight-4>0?r.top-m.offsetHeight-4:r.bottom+4)+"px";
  m.onclick=e=>{const b=e.target.closest("[data-z]");if(!b)return;closeMenu();
    if(b.dataset.z==="custom"){zoomCustom();return}
    if(b.dataset.z==="fit"){toggleFitPage();return}
    else setZoom(+b.dataset.z/100)};
}

/* ================= Tastatur ================= */
document.addEventListener("keydown",e=>{
  const c=e.ctrlKey||e.metaKey;
  const as=e.altKey&&e.shiftKey&&!c;
  if(as&&e.key.toLowerCase()==="p"){e.preventDefault();
    if($("#ovl").innerHTML)closeOvl();else palette();return}
  if(as&&e.key.toLowerCase()==="m"){e.preventDefault();linkSelection();return}
  if(as&&e.key.toLowerCase()==="k"){e.preventDefault();linkDialog();return}
  if(as&&e.key.toLowerCase()==="f"){e.preventDefault();fdOpen(false);return}
  if(as&&e.key.toLowerCase()==="h"){e.preventDefault();fdOpen(true);return}
  /* Nur die Absicht merken, nicht abfangen: das Einfügen macht danach der
     Browser, und erst der paste-Handler wertet die Marke aus. Mit
     preventDefault käme gar kein paste-Ereignis mehr, und die Zwischenablage
     ließe sich nur noch über die asynchrone Berechtigungs-API lesen.
     Der Rückfall nach kurzer Zeit fängt den Fall ab, dass gar nichts folgt. */
  if(c&&e.shiftKey&&e.key.toLowerCase()==="v"){
    plainPaste=true;setTimeout(()=>{plainPaste=false},900);
  }
  /* F7 statt Alt+Umschalt: die Taste ist für die Rechtschreibprüfung seit
     Jahrzehnten gesetzt und wird vom Browser nicht beansprucht. */
  if(e.key==="F7"&&!c&&!e.altKey){e.preventDefault();spellState="idle";spellDialog();return}
  if(as&&e.key.toLowerCase()==="l"){e.preventDefault();cmd("justifyLeft");return}
  if(as&&e.key.toLowerCase()==="e"){e.preventDefault();cmd("justifyCenter");return}
  if(as&&e.key.toLowerCase()==="r"){e.preventDefault();cmd("justifyRight");return}
  if(as&&e.key.toLowerCase()==="n"){e.preventDefault();quickNote();return}
  if(as&&e.key.toLowerCase()==="d"){e.preventDefault();newDocument();return}
  if(e.altKey&&!e.shiftKey&&!c&&["1","2","3"].includes(e.key)){e.preventDefault();setMode({1:"write",2:"notes",3:"gloss"}[e.key]);return}
  if(as&&e.key==="Enter"){e.preventDefault();insertPageBreak();return}
  if(as&&e.key.toLowerCase()==="g"){e.preventDefault();glossSearch();return}
  if(as&&e.key.toLowerCase()==="o"){e.preventDefault();toggleOutline();return}
  if(as&&e.key.toLowerCase()==="i"){e.preventDefault();insertToc();return}
  if(c&&e.key.toLowerCase()==="p"){flush();withPrintFootnotes(setPrintPage);return}
  if(as&&e.key.toLowerCase()==="s"){e.preventDefault();commit();toast(tr("Gesichert"));return}
  if(as&&(e.key==="+"||e.key==="=")){e.preventDefault();setZoom(S.zoom+.1);return}
  if(as&&(e.key==="-"||e.key==="_")){e.preventDefault();setZoom(S.zoom-.1);return}
  if(as&&e.key==="0"){e.preventDefault();toggleFitPage();return}
  if(as&&e.key.toLowerCase()==="z"){e.preventDefault();
    document.body.classList.toggle("focus");const ed=$("#editor");ed&&ed.focus();return}
  if(as&&e.key.toLowerCase()==="t"){e.preventDefault();toggleMemo();return}
  if(as&&e.key.toLowerCase()==="b"){e.preventDefault();readView();return}
  if(as&&e.key.toLowerCase()==="v"){e.preventDefault();printPreview();return}
  if(e.key==="Escape"){
    if(pasteOpt){pasteBarClose();return}
    if(pvOn){pvClose();return}
    if(readOn){readClose();return}
    if(hfEditing){hfEditClose();const ed=$("#editor");ed&&ed.focus();return}
    if(slashOn)slashClose();
    else if($("#findbar").classList.contains("on")&&document.activeElement&&document.activeElement.closest(".findbar"))fdClose();
    else if($("#ovl").innerHTML)closeOvl();
    else if(openNoteId)closeNote();
    else document.body.classList.remove("focus")}
});
window.addEventListener("beforeunload",()=>{flush();save()});

/* ================= Ereignisse Werkzeugleiste ================= */
$("#tools").addEventListener("click",e=>{
  const b=e.target.closest("[data-cmd]");if(b){cmd(b.dataset.cmd);return}
  const fl=e.target.closest("#fSizeList");if(fl){sizeMenu({currentTarget:fl});return}
  const fb=e.target.closest("#foreBtn");if(fb){colorMenu({currentTarget:fb},"fore");return}
  const mb=e.target.closest("#markBtn");if(mb){colorMenu({currentTarget:mb},"hilite");return}
  if(e.target.closest("#imgBtn")){pickImage();return}
  if(e.target.closest("#lnkBtn")){linkDialog();return}
  if(e.target.closest("#tblBtn")){tablePicker();return}
  if(e.target.closest("#pgbBtn")){insertPageBreak();return}
  if(e.target.closest("#indentBtn")){indentBlocks(1);return}
  if(e.target.closest("#outdentBtn")){indentBlocks(-1);return}
  if(e.target.closest("#undoBtn")){undoRedo("undo");$("#editor")&&$("#editor").focus();drawStatus();syncToolbarState();return}
  if(e.target.closest("#redoBtn")){undoRedo("redo");$("#editor")&&$("#editor").focus();drawStatus();syncToolbarState();return}
  if(e.target.closest("#addNote")){const n=addNote("");render();openNote(n.id,"titel");return}
  const nf=e.target.closest("[data-nf]");
  if(nf){S.noteFilter=nf.dataset.nf;save();render();return}
  const nv=e.target.closest("[data-nv]");
  if(nv){S.noteView=nv.dataset.nv;save();render();return}
  const gc=e.target.closest("[data-gc]");
  if(gc){if(gc.dataset.gc!==curGView()){setGView(gc.dataset.gc);render()}return}
  if(e.target.closest("#gcollAdd")){newGlossColl();return}
  if(e.target.closest("#addG")){openGForm(null);return}
  if(e.target.id==="glossIO"){glossIO();return}
  const s=e.target.closest("[data-sort]");if(s){S.gsort=s.dataset.sort;save();render()}
});
$("#tools").addEventListener("contextmenu",e=>{
  const gc=e.target.closest("[data-gc]");
  if(!gc)return;
  e.preventDefault();collContextMenu(e,gc.dataset.gc);
});
/* Die Farbknöpfe dürfen den Fokus nicht aus dem Editor ziehen, sonst
   verliert execCommand die Textauswahl. */
$("#tools").addEventListener("mousedown",e=>{
  if(e.target.closest("#foreBtn,#markBtn"))e.preventDefault();
});
$("#tools").addEventListener("keydown",e=>{
  if(e.target.id!=="fSize")return;
  if(e.key==="Enter"){e.preventDefault();setFontSize(e.target.value);const ed=$("#editor");ed&&ed.focus()}
  if(e.key==="Escape"){e.preventDefault();drawTools()}
  /* Pfeiltasten wie im Zahlenfeld, das Word ebenfalls bietet */
  if(e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();
    setFontSize((parseFloat(e.target.value)||12)+(e.key==="ArrowUp"?1:-1));
    const f=$("#fSize");if(f){f.focus();f.select()}}
});
$("#tools").addEventListener("change",e=>{
  if(e.target.id==="fFont"){doc().font=e.target.value;$("#editor").style.fontFamily=e.target.value+",serif";commit()}
  if(e.target.id==="fSize")setFontSize(e.target.value);
  if(e.target.id==="fBlock"){document.execCommand("formatBlock",false,e.target.value);$("#editor").focus();dirty=true}
});
$("#tools").addEventListener("input",e=>{
  if(e.target.id==="nSearch"){window._nq=e.target.value;drawNotes()}
  if(e.target.id==="gSearch"){const v=e.target.value;window._gq=v;drawGloss();
    const f=$("#gSearch");f&&f.focus()}
});
$("#pane").addEventListener("click",e=>{
  /* Ein rot unterringeltes Wort anklicken führt direkt zu seiner Stelle im
     Dialog — der übliche Weg, wenn man beim Lesen darüber stolpert. */
  const se=e.target.closest(".spellerr");
  if(se&&spellHits.length){
    const i=spellHits.indexOf(se);
    if(i>=0){spellState="run";spellSug=0;spellDialog(i);return}
  }
  const pv=e.target.closest("[data-prev]");
  if(pv){jumpTo(pv.dataset.prev,(curOcc[pv.dataset.prev]||0)-1);return}
  const nx=e.target.closest("[data-next]");
  if(nx){jumpTo(nx.dataset.next,(curOcc[nx.dataset.next]||0)+1);return}
  const ul=e.target.closest("[data-unlink]");
  if(ul){const id=ul.dataset.unlink,l=spansOf(id);
    const s=l[curOcc[id]||0]||l[0];if(s)unwrap(s);
    curOcc[id]=0;flush();commit();drawAnchors();toast(tr("Verknüpfung gelöst"));return}
  const nd=e.target.closest("[data-ndel]");
  if(nd){const id=nd.dataset.ndel;
    S.notes=S.notes.filter(x=>x.id!==id);
    spansOf(id).forEach(unwrap);flush();dropAnchorsFor(id);commit();drawAnchors();render();return}
  const ac=e.target.closest(".acard");
  if(ac&&!e.target.closest("[contenteditable]")){jumpTo(ac.dataset.n,curOcc[ac.dataset.n]||0);return}
  const col=e.target.closest("[data-color]");
  if(col){const n=findNote(col.dataset.nid);if(n){n.color=col.dataset.color;
    col.closest(".note").style.background=n.color;commit()}return}
  const d=e.target.closest("[data-del]");
  if(d){if(openNoteId===d.dataset.del)closeNote();
    S.notes=S.notes.filter(y=>y.id!==d.dataset.del);
    dropAnchorsFor(d.dataset.del);commit();render();return}
  const ga=e.target.closest("#gAssign");
  if(ga){const r=ga.getBoundingClientRect();
    assignMenu({clientX:r.left,clientY:r.bottom+4},curGView());return}
  const gm=e.target.closest("#gMore");
  if(gm){const r=gm.getBoundingClientRect();
    collContextMenu({clientX:r.left,clientY:r.bottom+4,preventDefault(){}},curGView());return}
  const ed=e.target.closest("[data-edit]");
  if(ed){openGForm(S.glossary.find(g=>g.id===ed.dataset.edit));return}
  const gd=e.target.closest("[data-gdel]");
  if(gd){if(editingG&&editingG.id===gd.dataset.gdel)editingG=null;   /* sonst zeigt das Formular auf einen entfernten Eintrag */
    S.glossary=S.glossary.filter(g=>g.id!==gd.dataset.gdel);commit();render();return}
  if(e.target.id==="gCancel"){$("#gform").style.display="none";return}
  if(e.target.id==="gSave"){
    const t=$("#gTerm").value.trim();if(!t){$("#gTerm").focus();return}
    if(editingG){editingG.term=t;editingG.def=$("#gDef").value.trim();editingG.cat=$("#gCat").value.trim();editingG.updated=Date.now()}
    else S.glossary.push({id:uid(),term:t,def:$("#gDef").value.trim(),cat:$("#gCat").value.trim(),gid:curGView(),created:Date.now(),updated:Date.now()});
    editingG=null;commit();render();toast(tr("Eintrag gesichert"))}
});
$("#setBtn").onclick=settings;
$("#fileBtn").onclick=fileMenu;
$("#viewBtn").onclick=viewMenu;
$("#formatBtn").onclick=formatMenu;
$("#toolsBtn").onclick=toolsMenu;
$("#focusOut").onclick=()=>{document.body.classList.remove("focus");
  const ed=$("#editor");ed&&ed.focus()};

/* ================= Render ================= */
function render(){
  hfEditClose();
  recalcGoalOthers();
  document.title=tr(doc().title||"Ohne Titel")+" — PureQuill Writer";
  drawTabs();
  document.querySelectorAll(".rb[data-mode]").forEach(b=>b.classList.toggle("on",b.dataset.mode===S.mode));
  drawTools();
  if(S.mode==="write")drawWrite();
  else if(S.mode==="notes")drawNotes();
  else drawGloss();
  drawMemo();   /* blendet sich außerhalb des Schreibmodus selbst aus */
  drawOutline();   /* blendet sich ebenso selbst aus, wenn nicht Schreibmodus/nicht offen */
  drawStatus();
}
applyTheme();applyStaticLabels();resetTimer();
if(isTrulyEmpty()){clearShell();startupDialog();}else render();
</script>
