<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#EAE8E0">
<meta name="description" content="Minimalistische Textverarbeitung mit Notizen und Glossar.">
<title>PureQuill Writer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --paper:#FCFBF8; --chrome:#EAE8E0; --chrome-2:#F3F1EA; --canvas:#8B8F94;
  --ink:#1E2023; --ink-soft:#6A6D71; --ink-faint:#9A9C9E;
  --rule:#D6D3C9; --stamp:#8C3B2E; --manila:#EBDFC4;
  --ok:#3F6B4A; --pageedge:rgba(0,0,0,.35);
  /* Cascadia unter Windows 11, SF Mono auf dem Mac; Consolas bleibt Rückfall */
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono","SF Mono",Menlo,Consolas,monospace;
  --ui:"Segoe UI",system-ui,sans-serif;
  --radius:6px;      /* Bedienelemente */
  --radius-lg:12px;  /* Dialoge */
  --radius-paper:3px;/* Papierobjekte bleiben kantig */
}
/* Graue Systemoberfläche der späten Neunziger */
[data-theme="silber"]{
  --paper:#FFFFFF; --chrome:#D4D0C8; --chrome-2:#E6E3DE; --canvas:#808080;
  --ink:#000000; --ink-soft:#3C3C3C; --ink-faint:#7B7B7B;
  --rule:#A5A19B; --stamp:#000080; --manila:#EBDFC4;
  --ok:#006400; --pageedge:rgba(0,0,0,.5);
}
/* Grautöne der klassischen Macintosh-Oberfläche */
[data-theme="platin"]{
  --paper:#FFFFFF; --chrome:#DDDDDD; --chrome-2:#EFEFEF; --canvas:#9B9B9B;
  --ink:#101010; --ink-soft:#4A4A4A; --ink-faint:#868686;
  --rule:#B2B2B2; --stamp:#33449B; --manila:#EBDFC4;
  --ok:#2E7D4F; --pageedge:rgba(0,0,0,.42);
}
/* Blaue Textmodus-Oberflächen der DOS-Zeit */
[data-theme="enzian"]{
  --on-stamp:#141414;
  --paper:#12256E; --chrome:#0B1A52; --chrome-2:#152C7C; --canvas:#050C33;
  --ink:#F3F5FF; --ink-soft:#B7C3EC; --ink-faint:#8593C9;
  --rule:#2E4AA0; --stamp:#FFC24A; --manila:#EBDFC4;
  --ok:#7FE0A0; --pageedge:rgba(255,255,255,.28);
}
/* Bernsteinfarbene Monochrom-Bildschirme */
[data-theme="bernstein"]{
  --on-stamp:#141414;
  --paper:#171208; --chrome:#1D1709; --chrome-2:#272010; --canvas:#0A0804;
  --ink:#FFB53D; --ink-soft:#C98A19; --ink-faint:#8C6414;
  --rule:#4C3712; --stamp:#FFD98A; --manila:#EBDFC4;
  --ok:#D9B24C; --pageedge:rgba(255,181,61,.32);
}
/* Kühles, sehr helles Systemgrau moderner Mac-Programme, heller Blauakzent */
[data-theme="alabaster"]{
  --paper:#FFFFFF; --chrome:#F2F2F7; --chrome-2:#FAFAFC; --canvas:#E5E5EA;
  --ink:#1D1D1F; --ink-soft:#55555C; --ink-faint:#86868B;
  --rule:#D6D6DC; --stamp:#0069D2; --manila:#EBDFC4;
  --ok:#1D7A45; --pageedge:rgba(0,0,0,.2);
}
/* Neutralgrau der Windows-Textverarbeitung, kräftig abgesetzte Schreibfläche
   und das dunkle Blau der Word-Menüleiste */
[data-theme="azur"]{
  --paper:#FFFFFF; --chrome:#E7ECF3; --chrome-2:#F3F6FA; --canvas:#7F858C;
  --ink:#1B1B1B; --ink-soft:#4C5157; --ink-faint:#7A8087;
  --rule:#C9D2DD; --stamp:#0F6CBD; --manila:#EBDFC4;
  --ok:#107C41; --pageedge:rgba(0,0,0,.4);
}
[data-theme="tinte"]{
  --paper:#1A1B1D; --chrome:#232426; --chrome-2:#2A2B2E; --canvas:#121314;
  --ink:#E4E2DC; --ink-soft:#9C9E9F; --ink-faint:#6E7072;
  --rule:#37383B; --stamp:#C2705F; --manila:#3A342A;
  --ok:#7FAE8B; --pageedge:rgba(255,255,255,.22);
}
/* Grüner Röhrenbildschirm, wie frühe Tabellenkalkulationen und DOS-Editoren */
[data-theme="phosphor"]{
  --on-stamp:#141414;
  --paper:#02120A; --chrome:#051D10; --chrome-2:#092A18; --canvas:#010B06;
  --ink:#3CFF74; --ink-soft:#25BD56; --ink-faint:#166838;
  --rule:#124126; --stamp:#8CFFB0; --manila:#EBDFC4;
  --ok:#4CFF88; --pageedge:rgba(60,255,116,.28);
}
/* Beige Bürosoftware-Oberfläche mit türkisen Akzenten, Ende der Neunziger */
[data-theme="lagune"]{
  --paper:#FBFBF8; --chrome:#D9D6CD; --chrome-2:#EDEBE3; --canvas:#8FA8A6;
  --ink:#151515; --ink-soft:#4B4B4B; --ink-faint:#8A8A8A;
  --rule:#B8B2A4; --stamp:#0F7C82; --manila:#EBDFC4;
  --ok:#1F8A5D; --pageedge:rgba(0,0,0,.4);
}
/* Graues Windows-Büro mit türkiser Infobox, späte Neunziger */
[data-theme="aquamarin"]{
  --paper:#FFFFFF; --chrome:#C3C3C3; --chrome-2:#DEDEDE; --canvas:#7E8C8C;
  --ink:#000000; --ink-soft:#3A3A3A; --ink-faint:#727272;
  --rule:#9A9A9A; --stamp:#0B7580; --manila:#EBDFC4;
  --ok:#12708A; --pageedge:rgba(0,0,0,.45);
}
/* Schwarzer Bildschirm mit Cyan, wie farbige Tabellenkalkulationen der DOS-Zeit */
[data-theme="zyan"]{
  --on-stamp:#141414;
  --paper:#05161A; --chrome:#0A2228; --chrome-2:#0F2F37; --canvas:#02090B;
  --ink:#67E8F9; --ink-soft:#3EA9BD; --ink-faint:#256E80;
  --rule:#164E5B; --stamp:#FFD24A; --manila:#EBDFC4;
  --ok:#5FE3A1; --pageedge:rgba(103,232,249,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--ui);
  background:var(--chrome); color:var(--ink);
  font-size:14px; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
/* Farbwechsel überblenden statt springen. Bewusst nur Farben und Schatten —
   keine Layout-Eigenschaften, die würden beim Neuzeichnen flackern.
   `.gitem .act button` steht bewusst nicht hier: die Regel hat weiter unten
   einen eigenen transition, der diesen sonst verdrängen würde. */
/* Ein Fokusring für alles, was mit der Tastatur erreichbar ist. Vorher gab es
   32 Hover-Regeln, aber nur zwei für den Fokus — der Rest bekam den
   Browser-Standardrahmen, der in dunklen Schemata kaum zu sehen ist.
   Schreibflächen sind ausgenommen, dort zeigt der Cursor die Stelle. */
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,
.mi:focus-visible,.sw:focus-visible{
  outline:2px solid var(--stamp);outline-offset:2px;border-radius:var(--radius)}
.tb,.pill,.rb,.filebtn,.btn,.mi,.tab,.tab .x,.tabadd,.sw,.addg,.gmore,.gitem,.hit,
.tools select,.tools input[type=text],.modal select,.setrow select{
  transition:background-color .14s ease-out,color .14s ease-out,
             border-color .14s ease-out,box-shadow .14s ease-out}
.app{display:flex;flex-direction:column;height:100%}

/* ---- Dokument-Tabs ---- */
.topbar{display:flex;align-items:flex-end;background:var(--chrome);flex:0 0 auto;position:relative}
/* Deutlich abgesetzt von der Reiterleiste daneben. Die Mischung geht Richtung
   Tinte, dunkelt also in hellen Schemata ab und hellt in dunklen auf — beides
   vergrößert den Abstand zum Hintergrund. Die erste Zeile trägt, falls ein
   Browser color-mix nicht kennt. */
.filebtn{margin:0 4px 4px 8px;padding:6px 12px;border:1px solid var(--rule);border-radius:var(--radius);
  background:var(--chrome-2);
  background:color-mix(in srgb, var(--chrome) 84%, var(--ink));
  color:var(--ink)}
.filebtn{display:inline-flex;align-items:center;gap:7px}
.filebtn::after{content:"";width:0;height:0;border-left:4px solid transparent;
  border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.6}
.filebtn:hover,.filebtn.on{background:var(--paper);color:var(--ink)}
.menu{position:absolute;z-index:60;top:100%;left:8px;min-width:250px;background:var(--paper);
  border:1px solid var(--rule);border-radius:var(--radius);box-shadow:0 7px 22px rgba(0,0,0,.19);padding:4px}
.menu.ctx{position:fixed;top:auto;min-width:212px}
.mi[disabled]{opacity:.38;pointer-events:none}
#editor.nomark .anch{background:none;border-bottom:none}
.mi{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:4px;text-align:left}
.mi:hover{background:var(--chrome)}
.mi .k{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.mi .chk{width:12px;flex:0 0 12px;color:var(--stamp)}
.msep{height:1px;background:var(--rule);margin:4px 3px}
.mlabel{padding:8px 8px 4px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-faint)}
.tabbar{display:flex;align-items:flex-end;gap:2px;padding:8px 8px 0;background:var(--chrome);flex:1;min-width:0;overflow:hidden}
.tab{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid transparent;border-bottom:none;
  border-radius:var(--radius) var(--radius) 0 0;color:var(--ink-soft);max-width:210px}
.tab.on{background:var(--paper);border-color:var(--rule);color:var(--ink)}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{color:var(--ink-faint);font-size:16px;line-height:1;padding:0 1px}
.tab .x:hover{color:var(--stamp)}
.tabadd{padding:6px 9px;color:var(--ink-faint);font-size:16px}

/* ---- Rahmen ---- */
.body{flex:1;display:flex;min-height:0;background:var(--paper);border-top:1px solid var(--rule)}
.rail{flex:0 0 52px;border-right:1px solid var(--rule);padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--chrome-2)}
.rb{width:34px;height:34px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.rb:hover{background:var(--chrome)}
.rb.on{background:var(--paper);color:var(--stamp);box-shadow:inset 0 0 0 1px var(--rule)}
.rb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---- Werkzeugleiste ---- */
.tools{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);flex-wrap:wrap;flex:0 0 auto}
.tools select,.tools input[type=text]{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:3px 5px}
/* Ohne appearance:none zeichnet Windows das Auswahlfeld selbst und übergeht
   dabei die gesetzte Papierfarbe. Der Pfeil wird deshalb aus zwei Verläufen
   gebaut — anders als eine Bilddatei nimmt der die Farbe des Schemas an. */
.tools select,.modal select,.setrow select{
  appearance:none;-webkit-appearance:none;
  color:var(--ink);
  padding-right:21px;
  background-color:var(--paper);
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),
                   linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:right 11px center,right 6.5px center;
  background-size:5px 5px,5px 5px;
  background-repeat:no-repeat}
.tools select:hover,.modal select:hover,.setrow select:hover{border-color:var(--ink-soft)}
/* Die aufgeklappte Liste zeichnet der Browser; wo er es zulässt, folgt sie dem Schema */
.tools select option,.modal select option,.setrow select option{background:var(--paper);color:var(--ink)}
/* Beschreibbares Kombifeld: tippen oder aus der Liste wählen, wie in Word */
.combo{display:inline-flex;align-items:stretch;border:1px solid var(--rule);
  border-radius:var(--radius);background:var(--paper);overflow:hidden}
.tools .combo input[type=text]{width:40px;border:none;background:none;padding:3px 2px;
  text-align:center;outline:none;font-variant-numeric:tabular-nums;color:var(--ink)}
.combo .cbdrop{width:19px;display:flex;align-items:center;justify-content:center;
  border-left:1px solid var(--rule);color:var(--ink-soft)}
.combo .cbdrop::after{content:"";width:0;height:0;border-left:4px solid transparent;
  border-right:4px solid transparent;border-top:5px solid currentColor}
.combo .cbdrop:hover{background:var(--chrome-2);color:var(--ink)}
.combo:focus-within{border-color:var(--ink-soft)}
.tb{width:26px;height:24px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.tb:hover{background:var(--chrome-2);color:var(--ink)}
.tb.on{background:var(--chrome);color:var(--stamp)}
/* Farbknöpfe: Glyphe oben, darunter ein Streifen in der zuletzt gewählten Farbe */
.tb.tbc{flex-direction:column;gap:2px;height:27px}
.tb.tbc .gl{font-size:12px;font-weight:700;line-height:1;display:flex}
.tb.tbc i{width:15px;height:3px;border-radius:1px;border:1px solid rgba(0,0,0,.22)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:3px 9px 7px}
.sw{height:21px;border-radius:var(--radius);border:1px solid rgba(0,0,0,.25)}
.sw:hover{box-shadow:0 0 0 2px var(--ink-soft)}
#colmenu{min-width:186px}
#colPick{margin-left:auto;width:30px;height:21px;padding:0;border:1px solid var(--rule);
  border-radius:var(--radius);background:none;cursor:pointer}
.tb svg{pointer-events:none}
/* Gruppen trennt Abstand statt einer Linie: 7px Lücke innerhalb einer Gruppe,
   gut das Dreifache dazwischen. Das Element bleibt, nur unsichtbar. */
.sep{width:12px;height:17px;background:none;flex:none}
.pill{border:1px solid var(--rule);border-radius:var(--radius);padding:3px 9px;color:var(--ink-soft);font-size:12px}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--chrome);color:var(--stamp);border-color:var(--stamp)}

/* ---- Schreibfläche ---- */
.sheet{flex:1;overflow-y:auto;padding:26px 18px 90px;background:var(--canvas)}
.paper{position:relative;flex:0 0 auto}
.sheetpage{position:absolute;left:0;right:0;background:var(--paper);
  border:1px solid var(--pageedge);box-shadow:0 2px 9px rgba(0,0,0,.22)}
.sheetpage .mg{position:absolute;top:0;bottom:0;border-left:1px dashed var(--rule)}
.hf{position:absolute;font-family:Georgia,serif;color:var(--ink-soft);
  pointer-events:none;white-space:pre-wrap;line-height:1.3}
/* Kopf-/Fußzeile direkt auf der Seite bearbeiten */
.hfhint{position:absolute;z-index:2;pointer-events:none;display:none;
  align-items:center;justify-content:center;border:1px dashed var(--stamp);border-radius:2px;
  font-family:var(--ui);font-size:11px;color:var(--stamp);opacity:.65}
.hfhint.on{display:flex}
.hfedit{position:absolute;z-index:6;display:none;outline:none;padding:1px 3px;
  background:var(--paper);box-shadow:0 0 0 1px var(--stamp);border-radius:2px;
  font-family:Georgia,serif;color:var(--ink);line-height:1.3;white-space:pre-wrap}
/* Ziehkante über die volle Feldbreite, damit man sie überall fassen kann */
.hfgrip{position:absolute;z-index:7;display:none;height:13px;cursor:ns-resize}
.hfgrip.on{display:block}
.hfgrip::after{content:"";position:absolute;left:0;right:0;top:6px;height:1px;
  background:var(--stamp);opacity:.3}
.hfgrip::before{content:"";position:absolute;left:50%;top:3px;width:46px;height:7px;margin-left:-23px;
  border-radius:4px;background:var(--stamp);opacity:.5}
.hfgrip:hover::before,.hfgrip.drag::before{opacity:.95}
.hfgrip:hover::after,.hfgrip.drag::after{opacity:.6}
/* Eckanfasser zum Skalieren des ausgewählten Bildes */
.figrsz{position:absolute;z-index:8;display:none;width:15px;height:15px;border-radius:50%;
  background:var(--stamp);border:2px solid var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.figrsz.on{display:block}
.hfedit.on{display:block}
.printhf{display:none}
.sheetpage .pn{position:absolute;bottom:5px;right:9px;font-family:var(--mono);
  font-size:11px;color:var(--ink-faint)}
#editor{
  position:relative;z-index:1;outline:none;
  font-family:Georgia,serif;line-height:var(--lh,1.62);color:var(--ink);
  font-size:calc(var(--fs,12pt) * var(--zoom));
}
.zoomctl{display:flex;align-items:center;gap:2px;border:1px solid var(--rule);border-radius:var(--radius)}
.zoomctl button{width:22px;height:22px;color:var(--ink-soft)}
.zoomctl button:hover{color:var(--ink);background:var(--chrome-2)}
.zoomctl input{width:48px;text-align:center;border:none;background:none;outline:none;
  font-family:var(--mono);font-size:11px;color:var(--ink);padding:2px 0}
.zoomctl input:focus{background:var(--chrome-2);border-radius:2px}
.zoomctl span{font-family:var(--mono);font-size:11px;color:var(--ink-soft);min-width:40px;text-align:center}
.fmtgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:11px}
.fmtopt{border:1px solid var(--rule);border-radius:var(--radius);padding:8px 10px;text-align:left;background:var(--paper)}
.fmtopt:hover{border-color:var(--ink-soft)}
.fmtopt.on{border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.fmtopt b{display:block;font-weight:600;margin-bottom:2px}
.fmtopt span{font-size:12px;color:var(--ink-faint)}
/* Gleich hohe Formatkarten, auch wenn die Beschreibung umbricht */
#fbody .fmtopt{min-height:56px;display:flex;flex-direction:column;justify-content:center}
#fbody .fmtopt span{line-height:1.35}
.mmrow{display:flex;gap:6px;align-items:center;margin-bottom:7px}
.mmrow label{flex:0 0 96px;color:var(--ink-soft)}
.mmrow input{width:100%}
/* Gesperrte Felder müssen als gesperrt erkennbar sein */
.modal input:disabled,.modal textarea:disabled,.modal select:disabled{
  background:var(--chrome-2);color:var(--ink-faint);cursor:not-allowed}
.pill:disabled{opacity:.4;pointer-events:none}
.gcolls{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
/* Seitenvorschau im Formatdialog */
.fmtwrap{display:flex;gap:15px;align-items:flex-start}
.fmtfields{flex:1;min-width:0}
.fmtprev{flex:0 0 104px;display:flex;justify-content:center;padding-top:20px}
.fmtprev .pg{position:relative;background:var(--paper);border:1px solid var(--ink-soft);
  box-shadow:0 2px 7px rgba(0,0,0,.2)}
.fmtprev .pg i{position:absolute;border:1px dashed var(--stamp);opacity:.55}
.fmtinfo{font-size:12px;color:var(--ink-soft);margin-top:11px}
.fmttip{color:var(--ink-faint);font-size:12px;line-height:1.5;margin-top:4px}
#editor h1{font-size:1.7em;font-weight:600;margin:1.1em 0 .45em}
#editor h2{font-size:1.32em;font-weight:600;margin:1.1em 0 .4em}
#editor h3{font-size:1.12em;font-weight:600;margin:1em 0 .35em}
#editor p{margin:0 0 .82em}
#editor ul,#editor ol{margin:0 0 .82em;padding-left:1.5em}
#editor table{border-collapse:collapse;width:100%;table-layout:fixed;margin:0 0 .82em}
#editor td,#editor th{border:1px solid var(--ink-faint);padding:.3em .45em;vertical-align:top;
  word-wrap:break-word;min-width:1.5em}
#editor th{background:var(--chrome-2);font-weight:600;text-align:left}
#editor td.selcell,#editor th.selcell{outline:2px solid var(--stamp);outline-offset:-2px}
.tgrid{display:grid;grid-template-columns:repeat(8,18px);gap:2px;padding:7px 7px 3px}
.tgrid i{width:18px;height:15px;border:1px solid var(--rule);background:var(--paper);display:block;cursor:pointer}
.tgrid i.on{background:var(--stamp);border-color:var(--stamp)}
.tlabel{text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-soft);padding:3px 0 7px}
#editor a{color:var(--stamp);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
#editor .pgbreak{position:relative;display:block;border-top:1px dashed var(--ink-faint);
  margin:0;padding:0;overflow:hidden}
#editor .pgbreak::before{content:attr(data-label);position:absolute;left:0;top:2px;
  font-family:var(--ui);font-size:11px;color:var(--ink-faint)}
.findbar{position:absolute;top:9px;right:16px;z-index:35;background:var(--paper);
  border:1px solid var(--rule);border-radius:var(--radius);box-shadow:0 5px 18px rgba(0,0,0,.2);
  padding:7px 9px;display:none;min-width:330px}
.findbar.on{display:block}
.findbar .fr{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.findbar .fr:last-child{margin-bottom:0}
.findbar input[type=text]{flex:1;background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--radius);padding:4px 7px;min-width:0}
.findbar .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-soft);
  min-width:62px;text-align:right}
.findbar .fb{width:24px;height:23px;border:1px solid var(--rule);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.findbar .fb:hover{color:var(--ink);background:var(--chrome-2)}
.findbar .fopt{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:4px}
#editor .hit{background:rgba(255,214,0,.42);border-radius:2px}
#editor .hit.cur{background:var(--stamp);color:var(--on-stamp,#fff)}
#editor figure.fig{margin:0 0 .82em;display:block;text-align:center}
#editor figure.fig img{display:inline-block;max-width:100%;height:auto;vertical-align:top}
#editor figure.fig figcaption{font-family:var(--ui);font-size:.72em;
  color:var(--ink-soft);margin-top:.35em;line-height:1.4;text-align:inherit}
#editor figure.fig.sel img{outline:2px solid var(--stamp);outline-offset:2px}
.imgbar{position:absolute;z-index:45;background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--radius);box-shadow:0 5px 18px rgba(0,0,0,.2);padding:6px 9px;
  display:none;align-items:center;gap:7px;white-space:nowrap}
.imgbar.on{display:flex}
#hfbar{flex-wrap:wrap;max-width:calc(100vw - 20px);row-gap:5px}
.imgbar input[type=range]{width:96px}
.imgbar .pct{font-family:var(--mono);font-size:11px;color:var(--ink-soft);min-width:38px}
.glossterm{border-bottom:1.5px dotted var(--stamp);cursor:help}

/* ---- Statuszeile ---- */
.status{display:flex;align-items:center;gap:17px;padding:5px 13px;border-top:1px solid var(--rule);
  background:var(--chrome-2);font-size:12px;color:var(--ink-soft);flex:0 0 auto;
  /* Oberflächenschrift statt Programmierschrift; die Tabellenziffern halten
     die Zahlen beim Tippen ruhig — dafür war die Festbreitenschrift da. */
  font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.status .grow{flex:1}
/* Dokumentnotizen: Gedanken zum Dokument, nicht zum Text */
.side .memo{flex:1;border:none;outline:none;resize:none;padding:14px 16px;
  background:var(--chrome-2);color:var(--ink);
  font-family:Georgia,serif;font-size:14px;line-height:1.6}
.side .memo::placeholder{color:var(--ink-faint)}
/* Schreibziel: dezenter Balken, kein Alarm */
.goal{cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.goalbar{display:inline-block;width:58px;height:5px;border-radius:3px;
  background:var(--rule);overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--stamp);transition:width .25s}
.goalbar.done i{background:var(--ok)}
.status .zoomctl{border:1px solid var(--rule);gap:0}
.status .zoomctl button{width:24px;height:22px;font-size:16px;line-height:1}
.status .zoomctl #zVal{width:auto;min-width:58px;font-variant-numeric:tabular-nums;font-size:12px;padding:0 7px}
.status .zoomctl #zVal:hover{background:var(--chrome)}
.status .zoomctl input{width:58px;font-size:12px;padding:2px 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;vertical-align:1px}
.dot.dirty{background:var(--stamp)}

/* ---- Notizen ---- */
.pane{flex:1;overflow:auto;position:relative}
.notecanvas{position:relative;min-height:100%;padding:14px}
.work{flex:1;display:flex;min-height:0;position:relative}
.note{position:absolute;width:224px;height:224px;background:#EBDFC4;color:#22242A;
  border:1px solid rgba(0,0,0,.16);border-radius:var(--radius-paper);cursor:move;
  padding:13px 12px 28px;box-shadow:1px 1px 0 rgba(0,0,0,.13);overflow:hidden}
.note.sel{box-shadow:0 0 0 2px var(--stamp),1px 1px 0 rgba(0,0,0,.13)}
.note.drag{z-index:9;box-shadow:0 8px 20px rgba(0,0,0,.26);opacity:.95;pointer-events:none}
/* Ziel beim Drag-Swap: eigener Ring, unterscheidbar vom Auswahlring (.sel) */
.note.drop-target{outline:2px solid var(--ok);outline-offset:-2px}
.note .grip{position:absolute;top:0;left:0;right:0;height:17px;cursor:move}
.ntitle{font-family:Georgia,serif;font-size:16px;font-weight:600;line-height:1.3;margin:0 0 5px;
  padding-bottom:5px;border-bottom:1px solid rgba(0,0,0,.14)}
.nbody{font-family:Georgia,serif;font-size:14px;line-height:1.52;word-wrap:break-word}
.nbody p{margin:0 0 .5em}
.nbody ul,.nbody ol{margin:0 0 .5em;padding-left:1.25em}
.nbody:empty::before{content:attr(data-hint);opacity:.45;font-style:italic}
.note .fade{position:absolute;left:0;right:0;bottom:22px;height:34px;pointer-events:none;
  background:linear-gradient(to bottom,transparent,var(--nc,#EBDFC4))}
.note .meta{position:absolute;left:12px;bottom:7px;font-family:var(--mono);font-size:11px;opacity:.5}
.note .del{position:absolute;right:7px;bottom:4px;color:inherit;opacity:.42;font-size:14px;line-height:1}
.note .del:hover{opacity:1;color:#8C3B2E}
.note .src{position:absolute;right:9px;top:7px;font-family:var(--mono);font-size:11px;opacity:.5}
.sw{position:absolute;right:26px;bottom:6px;display:none;gap:4px}
.note:hover .sw{display:flex}
.sw button{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.28);padding:0}
.sw button:hover{transform:scale(1.28)}

/* ---- Notizen: Listenansicht ---- */
.notecanvas.list{display:flex;flex-direction:column;gap:8px}
.note.nrow{position:static;width:100%;height:52px;display:flex;align-items:center;gap:12px;
  padding:0 14px;cursor:grab}
.note.nrow.drag{position:relative}
.note.nrow .grip{display:none}
.note.nrow .ntitle{border:0;padding:0;margin:0;flex:0 0 auto;max-width:220px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note.nrow .nbody{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note.nrow .nbody p{display:inline;margin:0}
.note.nrow .nbody ul,.note.nrow .nbody ol{display:inline;margin:0;padding:0}
.note.nrow .nbody li{display:inline}
.note.nrow .nbody li+li::before{content:" · "}
.note.nrow .fade{display:none}
.note.nrow .anchbadge,.note.nrow .src{position:static;flex:0 0 auto}
.note.nrow .meta{position:static;opacity:.5;font-family:var(--mono);font-size:11px;flex:0 0 auto}
.note.nrow .del{position:static;flex:0 0 auto}
.note.nrow .sw{position:static;flex:0 0 auto}

/* ---- Seitenleiste für die geöffnete Notiz ---- */
.side{flex:0 0 388px;border-left:1px solid var(--rule);display:none;flex-direction:column;background:var(--chrome-2)}
.side.on{display:flex}
.side.max{position:absolute;inset:0;flex:1 1 auto;z-index:30;border-left:none}
.side .head{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--rule)}
.side .head input{flex:1;background:none;border:none;outline:none;font-family:Georgia,serif;
  font-size:16px;font-weight:600;color:var(--ink)}
.side .head input::placeholder{color:var(--ink-faint);font-weight:400}
.side .hb{width:26px;height:24px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.side .hb:hover{background:var(--chrome);color:var(--ink)}
.side .hb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side .bar{display:flex;align-items:center;gap:5px;padding:5px 9px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.side .nedit{flex:1;overflow:auto;padding:15px 17px;outline:none;background:var(--nc,#EBDFC4);color:#22242A;
  font-family:Georgia,serif;line-height:1.6}
.side .nedit ul,.side .nedit ol{padding-left:1.35em;margin:0 0 .6em}
.side .nedit p{margin:0 0 .6em}
.side .foot{display:flex;align-items:center;gap:9px;padding:7px 11px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.side .foot .sw2{display:flex;gap:5px}
.side .foot .sw2 button{width:14px;height:14px;border-radius:50%;border:1px solid var(--rule);padding:0}
.side .foot .sw2 button.on{box-shadow:0 0 0 2px var(--stamp)}

/* ---- Glossar ---- */
/* Nachschlagewerk, kein Fließtext: linksbündig und breiter als eine Lesespalte */
.gwrap{max-width:940px;margin:0;padding:20px 24px 60px}
/* Kopf der Sammlung: Name, Umfang, Zuordnung */
.ghead{margin:0 0 18px}
.ghead .grow{display:flex;align-items:baseline;gap:9px}
.ghead h2{margin:0;font-family:Georgia,serif;font-size:20px;font-weight:600;color:var(--ink);
  letter-spacing:-.01em;overflow-wrap:anywhere}
.ghead .gmore{flex:none;align-self:center;margin-left:auto;color:var(--ink-faint);font-size:16px;
  line-height:1;padding:3px 7px;border-radius:var(--radius)}
.ghead .gmore:hover{color:var(--ink);background:var(--chrome-2)}
/* Umfang und Zuordnung teilen sich eine Zeile unter dem Namen */
.ghead .gmeta{margin:6px 0 0;font-size:12px;color:var(--ink-soft);line-height:1.6;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ghead .gdot{color:var(--ink-faint)}
.ghead .gulabel{color:var(--ink-faint)}
.ghead .gupick{display:inline-flex;align-items:center;gap:6px;max-width:240px;
  font-size:12px;padding:2px 8px;border:1px solid var(--rule);border-radius:var(--radius);
  background:var(--chrome-2);color:var(--ink)}
.ghead .gupick:hover{border-color:var(--ink-soft)}
.ghead .gupick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead .gupick .caret{flex:none;width:0;height:0;border-left:4px solid transparent;
  border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.65}
/* Reiter der Sammlungen — bewusst anders als die Sortier-Pillen daneben */
.gcolls{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.gcoll{display:inline-flex;align-items:center;gap:6px;max-width:190px}
.gcoll span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcoll .inuse{width:5px;height:5px;border-radius:50%;background:var(--stamp);flex:none}
.gcoll.on .inuse{background:currentColor}
.gcolladd{font-size:14px;line-height:1;padding:2px 9px 4px}
/* Hauptaktion im Glossar: breiter und farbig abgesetzt, damit sie nicht
   mit den Reiter-Pillen daneben verwechselt wird */
.addg{display:inline-flex;align-items:center;justify-content:center;
  min-width:52px;height:30px;border-radius:var(--radius);
  background:var(--stamp);color:var(--on-stamp,#fff);border:1px solid var(--stamp)}
.addg:hover{filter:brightness(1.12)}
.addg svg{flex:none}
/* Begriffsliste: Begriff links, Definition rechts — wie in einem Nachschlagewerk.
   Eigene Papierfläche, sonst stünde der Text auf der Schreibtischfarbe. */
.glist{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius)}
.ggroup{position:sticky;top:0;z-index:1;background:var(--chrome-2);
  padding:7px 13px;font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);
  border-bottom:1px solid var(--rule)}
.ggroup:first-child{border-radius:var(--radius) var(--radius) 0 0}
.gitem{display:grid;grid-template-columns:minmax(120px,210px) 1fr auto;gap:6px 18px;
  padding:11px 13px;border-bottom:1px solid var(--rule);align-items:baseline}
/* Sonst würde die Hover-Fläche der letzten Zeile die runde Unterkante überdecken */
.gitem:last-child{border-bottom:none;border-radius:0 0 var(--radius) var(--radius)}
.gitem:hover{background:var(--chrome-2)}
.gitem .t{font-family:Georgia,serif;font-size:16px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.gitem .c{display:block;margin-top:3px;font-family:var(--mono);font-size:11px;
  letter-spacing:.04em;color:var(--ink-soft);text-transform:uppercase}
.gitem .d{font-family:Georgia,serif;font-size:14px;line-height:1.6;color:var(--ink);overflow-wrap:anywhere}
.gitem .d .leer{color:var(--ink-soft);font-style:italic}
/* Dauerhaft sichtbar, nur gedämpft — auf Tastatur und Touch gäbe es kein Hover */
.gitem .act{display:flex;gap:2px;align-self:start}
.gitem .act button{width:26px;height:24px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius);color:var(--ink-soft);opacity:.85;
  transition:opacity .15s,background-color .14s ease-out,color .14s ease-out}
.gitem:hover .act button,.gitem .act button:focus-visible{opacity:1}
.gitem .act button:hover{background:var(--chrome);color:var(--ink)}
@media (max-width:620px){
  .gitem{grid-template-columns:1fr auto}
  .gitem .d{grid-column:1/-1}
}
.gform{background:var(--chrome-2);border:1px solid var(--rule);border-radius:var(--radius);padding:12px;margin-bottom:16px}
.gform .ghint{margin:0 0 8px;font-size:12px;color:var(--ink-faint)}
/* Import/Export-Dialog */
.iohead{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.iohint{margin:4px 0 9px;font-size:12px;color:var(--ink-soft);line-height:1.5}
.ioext{color:var(--ink-faint)}
.iosep{height:1px;background:var(--rule);margin:17px 0 14px}
.ioradio{display:flex;flex-direction:column;gap:7px;margin-top:2px}
/* min-width:0 lässt den Text im Flex-Label umbrechen statt aus dem Dialog zu laufen */
.ioradio label{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink);cursor:pointer}
.ioradio label span{min-width:0;overflow-wrap:anywhere}
/* .modal input{width:100%} steht später und gewinnt sonst — die Radios
   wären 100% breit und schöben den Text aus dem Dialog. */
.modal .ioradio input{width:auto;margin:1px 0 0;flex:none}
.gform input,.gform textarea{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);
  padding:5px 7px;margin-bottom:7px;font-family:Georgia,serif}
.gform textarea{resize:vertical;min-height:56px}
.empty{color:var(--ink-faint);font-family:Georgia,serif;font-size:14px;padding:26px 2px;line-height:1.6}

/* ---- Overlays ---- */
/* Scrollbar, damit hohe Dialoge auf kleinen Fenstern nicht abgeschnitten werden */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:flex-start;
  justify-content:center;padding:13vh 10px 28px;z-index:50;overflow-y:auto}
@media (max-height:820px){.veil{padding-top:5vh}}
@media (max-height:620px){.veil{padding-top:12px}}
.modal{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius-lg);width:min(520px,92vw);
  box-shadow:0 10px 34px rgba(0,0,0,.2)}
.modal.wide{width:min(600px,94vw)}
.modal h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--rule);font-size:12px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.modal .pad{padding:16px}
.modal input,.modal textarea,.modal select{width:100%;background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--radius);padding:6px 8px}
.hit{padding:7px 9px;border-bottom:1px solid var(--rule);cursor:pointer}
.hit:hover{background:var(--chrome-2)}
.hit b{font-family:Georgia,serif;font-size:14px;font-weight:600}
.hit p{margin:2px 0 0;font-family:Georgia,serif;color:var(--ink-soft);font-size:13px}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule)}
.setrow:last-child{border-bottom:none}
.setrow label{color:var(--ink-soft)}
.setrow .ctl{width:210px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.setrow .ctl select,.setrow .ctl input[type=number]{width:auto;flex:1}
.btn{border:1px solid var(--rule);border-radius:var(--radius);padding:4px 11px;background:var(--chrome-2)}
.btn:hover{border-color:var(--ink-soft)}
.btn.pri{background:var(--stamp);border-color:var(--stamp);color:var(--on-stamp,#fff)}
.rowend{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--rule);flex-wrap:wrap}
/* Schmale Fenster: zweispaltige Dialogteile untereinander legen */
@media (max-width:560px){
  .fmtgrid{grid-template-columns:1fr}
  .fmtgrid .fmtopt[style*="grid-column"]{grid-column:1!important}
  .fmtwrap{flex-direction:column}
  .fmtprev{padding-top:4px;align-self:center}
  .mmrow{flex-wrap:wrap}
  .mmrow label{flex:0 0 100%}
  .setrow{flex-wrap:wrap;gap:6px}
  .setrow .ctl{width:100%}
  .rowend{justify-content:flex-start}
  .rowend .btn[style*="margin-right:auto"]{margin-right:0!important}
}
.papercol{display:flex;flex-direction:column;flex:0 0 auto}
.ruler{position:sticky;top:0;z-index:20;height:19px;flex:0 0 19px;margin-bottom:7px;
  background:var(--chrome-2);border:1px solid var(--rule);border-radius:2px;position:relative}
.ruler .zone{position:absolute;top:0;bottom:0;background:var(--canvas);opacity:.32}
.ruler .tick{position:absolute;top:11px;bottom:2px;width:1px;background:var(--ink-faint);opacity:.5}
.ruler .tick.big{top:6px}
.ruler .hand{position:absolute;top:0;width:11px;height:19px;margin-left:-5px;cursor:ew-resize}
.ruler .hand::after{content:"";position:absolute;left:3px;top:3px;width:5px;height:13px;
  background:var(--paper);border:1px solid var(--ink-soft);border-radius:1px}
.ruler .hand:hover::after,.ruler .hand.drag::after{background:var(--stamp);border-color:var(--stamp)}
.rulertip{position:absolute;top:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:2px;display:none}
.pagewrap{display:flex;align-items:flex-start;gap:16px;width:fit-content;margin:0 auto;position:relative}
.anch{background:var(--ab,rgba(140,59,46,.22));border-bottom:2px solid var(--ac,#8C3B2E);cursor:pointer;
  border-radius:2px;padding:0 1px}
.anch.hot{outline:2px solid var(--ac,#8C3B2E);outline-offset:1px}
.anchcol{position:relative;flex:0 0 252px;width:252px;min-height:10px}
.acard{position:absolute;left:0;width:252px;background:#EBDFC4;color:#22242A;border:1px solid rgba(0,0,0,.2);
  border-left:4px solid var(--ac,#8C3B2E);border-radius:var(--radius);padding:9px 10px 8px;
  box-shadow:0 1px 4px rgba(0,0,0,.2);transition:top .12s}
.acard .at{font-family:Georgia,serif;font-weight:600;font-size:14px;margin-bottom:3px}
.acard .ab{font-family:Georgia,serif;font-size:13px;line-height:1.5;outline:none;
  max-height:1.5em;overflow:hidden}
.acard:hover,.acard.hot{z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.acard:hover .ab,.acard.hot .ab{max-height:none;overflow:visible}
.acard .af{display:none}
.acard:hover .af,.acard.hot .af{display:flex}
.acard.hot{box-shadow:0 0 0 2px var(--stamp),0 4px 14px rgba(0,0,0,.28)}
.acard .ab ul,.acard .ab ol{padding-left:1.2em;margin:0 0 .4em}
.acard .ab p{margin:0 0 .4em}
.acard .af{display:flex;align-items:center;gap:6px;margin-top:6px;font-family:var(--mono);
  font-size:11px;opacity:.65}
.acard .af button{color:inherit;padding:0 3px}
.acard .af button:hover{color:#8C3B2E;opacity:1}
.acard .nav{display:flex;align-items:center;gap:3px}
.anchbadge{position:absolute;left:12px;top:-1px;font-family:var(--mono);font-size:11px;
  background:rgba(0,0,0,.14);border-radius:0 0 3px 3px;padding:1px 6px}
.pickitem{padding:8px 13px;border-bottom:1px solid var(--rule);cursor:pointer;display:flex;gap:9px;align-items:center}
.pickitem:last-child{border-bottom:none}
.pickitem.on{background:var(--chrome)}
.pickitem .dotc{width:11px;height:11px;border-radius:50%;flex:0 0 11px;border:1px solid rgba(0,0,0,.25)}
/* ---- Oberfläche tritt beim Schreiben zurück ---- */
.topbar,.rail,.tools,.status{transition:opacity .35s}
body.typing .topbar,body.typing .rail,body.typing .tools,body.typing .status{opacity:.34}

/* ---- Hinweis im leeren Dokument ---- */
#editor.isempty::before{
  content:attr(data-hint);
  position:absolute;left:var(--pl,0);top:var(--pt,0);pointer-events:none;
  font-family:var(--ui);font-size:13px;line-height:1.5;
  color:var(--ink-faint);font-style:normal;white-space:nowrap}

/* ---- Seitenanzeige beim Scrollen ---- */
.pageflag{position:absolute;right:14px;top:14px;z-index:40;background:var(--ink);color:var(--paper);
  font-family:var(--mono);font-size:12px;padding:5px 11px;border-radius:var(--radius);
  opacity:0;transition:opacity .2s;pointer-events:none}
.pageflag.on{opacity:.88}

/* ---- Drucken ---- */
@media print{
  body *{visibility:hidden!important}
  #editor,#editor *{visibility:visible!important}
  #editor{position:absolute!important;left:0;top:0;width:100%;padding:0!important;
    min-height:0!important;--zoom:1!important;color:#000!important}
  .printhf{display:block!important;visibility:visible!important;position:fixed;
    left:0;right:0;font-family:Georgia,serif;font-size:9pt;color:#000!important;
    white-space:pre-wrap}
  .printhf *{visibility:visible!important}
  #printhdr{top:0}
  #printftr{bottom:0}
  .pageno::after{content:counter(page)}
  .anch{background:none!important;border-bottom:none!important}
  #editor .pgbreak{break-after:page;page-break-after:always;border:none!important;
    height:0!important;visibility:hidden!important}
  #editor td,#editor th{border:1px solid #000!important}
  #editor th{background:none!important}

/* ---- Leseansicht: nur der Text, ohne jede Bedienoberfläche ---- */
.readview{position:fixed;inset:0;z-index:80;display:none;overflow-y:auto;
  background:var(--paper);color:var(--ink)}
.readview.on{display:block}
.readview .rinner{max-width:36em;margin:0 auto;padding:9vh 26px 16vh;
  font-family:Georgia,serif;font-size:20px;line-height:1.75}
.readview .rinner h1{font-size:1.7em;font-weight:600;margin:1.2em 0 .5em}
.readview .rinner h2{font-size:1.35em;font-weight:600;margin:1.15em 0 .45em}
.readview .rinner h3{font-size:1.15em;font-weight:600;margin:1.1em 0 .4em}
.readview .rinner p{margin:0 0 .9em}
.readview .rinner ul,.readview .rinner ol{margin:0 0 .9em;padding-left:1.5em}
.readview .rinner img{max-width:100%;height:auto}
.readview .rinner table{border-collapse:collapse;width:100%;margin:0 0 .9em}
.readview .rinner td,.readview .rinner th{border:1px solid var(--rule);padding:.35em .5em}
/* Arbeitsspuren gehören nicht in die Leseansicht */
.readview .anch{background:none!important;border-bottom:none!important}
.readview .glossterm{border-bottom:none!important}
.readview .pgbreak{border-top:1px solid var(--rule);margin:2.2em 0;height:0}
.readview .pgbreak::before{content:""!important}
.rbar{position:fixed;top:14px;right:18px;z-index:2;display:flex;gap:10px;align-items:center;
  background:var(--chrome);border:1px solid var(--rule);border-radius:var(--radius);
  padding:6px 11px;font-family:var(--ui);font-size:12px;color:var(--ink-soft);
  opacity:.35;transition:opacity .25s}
.rbar:hover{opacity:1}
/* ---- Druckvorschau: das Dokument, wie es auf Papier aussieht ---- */
.pvwrap{position:fixed;inset:0;z-index:85;display:none;overflow:auto;background:var(--canvas)}
.pvwrap.on{display:block}
.pvbar{position:sticky;top:0;z-index:2;display:flex;gap:9px;align-items:center;
  padding:8px 14px;background:var(--chrome);border-bottom:1px solid var(--rule);
  font-size:12px;color:var(--ink-soft)}
.pvinner{padding:22px 14px 44px;display:flex;justify-content:center}
.pvinner .anch{background:none!important;border-bottom:none!important}
.pvinner .glossterm{border-bottom:none!important}
.pvinner .pgbreak::before{content:""!important}
.pvinner .mg{display:none}
.cmdlist{max-height:340px;overflow:auto}
.cmd{display:flex;align-items:center;gap:11px;padding:8px 13px;cursor:pointer;border-bottom:1px solid var(--rule)}
.cmd:last-child{border-bottom:none}
.cmd.on{background:var(--chrome)}
.cmd .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd .grp{font-family:var(--mono);font-size:11px;color:var(--ink-faint);
  letter-spacing:.06em;text-transform:uppercase;flex:0 0 62px}
.kbd{font-family:var(--mono);font-size:11px;color:var(--ink-soft);
  border:1px solid var(--rule);border-radius:3px;padding:1px 6px;white-space:nowrap}
.hintk{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.hist{max-height:340px;overflow:auto}
.hist div{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;border-bottom:1px solid var(--rule);
  font-family:var(--mono);font-size:12px;color:var(--ink-soft)}

/* ---- Fokusmodus ---- */
.focusbar{position:fixed;top:12px;right:14px;z-index:55;display:none;align-items:center;gap:9px;
  background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:var(--radius);
  font-family:var(--mono);font-size:12px;opacity:.3;transition:opacity .25s}
.focusbar:hover{opacity:1}
body.focus .focusbar{display:flex}
.focusbar button{color:inherit;text-decoration:underline;text-underline-offset:2px}
body.focus .topbar,body.focus .rail,body.focus .tools{display:none}
body.focus .sheet{padding-top:9vh}
.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:7px 15px;border-radius:var(--radius);font-size:12px;z-index:70;opacity:0;transition:opacity .18s}
.toast.on{opacity:1}

/* Wer im Betriebssystem weniger Bewegung eingestellt hat, bekommt keine.
   Ganz am Ende, damit die Regel jede vorherige übersteuert. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition-duration:.01ms!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important}
}

/* Nur ein wirklich frischer Start: genau ein leeres Dokument ohne eigenen Titel
   und sonst nichts. Vorher genügte es, dass alle Dokumente leer sind — dadurch
   erschien der Startdialog auch bei mehreren leeren Reitern. */
function isTrulyEmpty(){
  return S.docs.length===1&&!stripHtmlSafe(S.docs[0].html)&&!S.docs[0].customTitle
    &&!(S.notes&&S.notes.length)&&!(S.glossary&&S.glossary.length);
}
function clearShell(){
  $("#tabbar").innerHTML="";$("#tools").innerHTML="";$("#pane").innerHTML="";$("#status").innerHTML="";
  document.title="PureQuill Writer";
}
const stripHtmlSafe=h=>{const e=document.createElement("div");e.innerHTML=h||"";return (e.innerText||"").trim()};
function startNew(){
  lockedOvl=false;closeOvl();
  if(S.docs.length===1&&!stripHtmlSafe(S.docs[0].html)){
    formatDialog("new",val=>{S.docs[0].fmt=val;save();render()});
  }else newDocument();
}
function startupDialog(){
  overlay(`<div class="modal"><h3>${tr("Willkommen")}</h3><div class="pad">
    <div class="setrow" style="border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:12px">

        <select id="stLang">
          <option value="en" ${S.settings.uiLang==="en"?"selected":""}>English</option>
          <option value="de" ${S.settings.uiLang!=="en"?"selected":""}>Deutsch</option>
        </select></div></div>
    <div class="setrow" style="border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:14px">
      <label>${tr("Farbschema")}</label><div class="ctl">
        <span id="stSwatch" style="flex:0 0 30px;height:22px;border:1px solid var(--rule);border-radius:2px;overflow:hidden;display:flex"></span>
        <select id="stTheme">${THEMES.map(t=>
          `<option value="${t.k}" ${S.settings.theme===t.k?"selected":""}>${tr(t.n)}</option>`).join("")}</select>
      </div></div>
    <p style="margin:0 0 14px;font-family:Georgia,serif;font-size:14px;line-height:1.55;color:var(--ink-soft)">
      ${tr("Wie möchtest du beginnen?")}</p>
    <div style="display:flex;gap:10px">
      <button class="btn pri" id="stNew" style="flex:1;padding:11px">${tr("Neues Dokument")}</button>
      <button class="btn" id="stOpen" style="flex:1;padding:11px">${tr("Datei laden")}&hellip;</button>
    </div>
    </div></div>`,true);
  const paintSwatch=k=>{
    const t=THEMES.find(x=>x.k===k)||THEMES[0];
    $("#stSwatch").innerHTML=`<span style="flex:2;background:${t.c[0]}"></span>
      <span style="flex:1;background:${t.c[1]}"></span>
      <span style="flex:.6;background:${t.c[2]}"></span>`;
  };
  paintSwatch(S.settings.theme);
  $("#stLang").onchange=()=>{S.settings.uiLang=$("#stLang").value;save();applyStaticLabels();startupDialog()};
  $("#stTheme").onchange=()=>{
    S.settings.theme=$("#stTheme").value;save();applyTheme();paintSwatch(S.settings.theme)};
  $("#stNew").onclick=startNew;
  $("#stOpen").onclick=importJson;
}

function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
  return mem||null}
let storageOk=true;
function save(){const s=JSON.stringify(S);mem=JSON.parse(s);
  try{localStorage.setItem(KEY,s);if(!storageOk){storageOk=true}}
  catch(e){
    if(storageOk){storageOk=false;
      setTimeout(()=>toast(String(e).includes("quota")||String(e).includes("Quota")
        ?tr("Speicher voll — bitte über Datei → Alles sichern als Datei auslagern")
        :tr("Browser-Speicher nicht verfügbar — bitte regelmäßig als Datei sichern")),400)}
  }}

const uid=()=>Math.random().toString(36).slice(2,9);
function blankDoc(t){return{id:uid(),title:t||"Ohne Titel",html:"",history:[],font:null,size:null}}

let S=load()||{
  docs:[blankDoc("Ohne Titel")],active:null,glossary:[],notes:[],mode:"write",
  settings:{font:"Georgia",size:12,autosave:true,interval:30,lang:"en",uiLang:"en",theme:"azur"},
  gsort:"alpha",marks:false,zoom:1.2,fitPage:false,guides:true,showCol:true
};
if(S.showCol===undefined)S.showCol=true;
if(!S.notes){
  S.notes=[];
  S.docs.forEach(d=>{if(d.notes){S.notes.push(...d.notes);delete d.notes}});
}
S.docs.forEach(d=>{if(d.notes){S.notes.push(...d.notes);delete d.notes}});
if(!S.noteFilter)S.noteFilter="all";
if(!S.noteView)S.noteView="free";
if(S.settings&&S.settings.typewriter===undefined)S.settings.typewriter=true;
/* „Oberfläche ausblenden“ ist aus, bis der Benutzer es einschaltet. Die frühere
   Fassung war voreingestellt an und hat das auch so gespeichert — daher einmalig
   abschalten; wer es danach anschaltet, behält es. */
if(S.settings&&!S.dimUiAus){S.settings.dimUi=false;S.dimUiAus=true}
if(S.settings)S.settings.dimUi=S.settings.dimUi===true;
if(!S.zoom)S.zoom=1.2;
if(S.settings&&(S.settings.theme==="hell"||!S.settings.theme))S.settings.theme="papier";
if(S.settings&&S.settings.theme==="dunkel")S.settings.theme="tinte";
/* Entfernte Schemata auf das jeweils nächstliegende umstellen */
if(S.settings&&S.settings.theme==="kobalt")S.settings.theme="enzian";
if(S.settings&&S.settings.theme==="goldrand")S.settings.theme="aquamarin";
if(S.settings&&S.settings.theme==="leinen")S.settings.theme="lagune";   /* beide: Naturweiß mit Türkisakzent */
if(S.settings&&S.settings.theme==="sepia")S.settings.theme="papier";    /* beide: warmes Naturweiß */
if(S.settings&&S.settings.theme==="werkbank")S.settings.theme="silber";  /* beide: graues 90er-Windows */
if(S.settings&&S.settings.theme==="brotkasten")S.settings.theme="enzian";/* beide: blauer Bildschirm */
if(S.settings&&(S.settings.theme==="hercules"||S.settings.theme==="solar"))S.settings.theme="tinte";
/* Sicherheitsnetz: ein unbekanntes Schema hätte keine Farben, aber einen Namen */
if(S.settings&&!THEMES.some(t=>t.k===S.settings.theme))S.settings.theme="azur";
if(S.guides===undefined)S.guides=true;
if(!S.active)S.active=S.docs[0].id;
if(!S.settings)S.settings={font:"Georgia",size:12,autosave:true,interval:30,lang:"en",uiLang:"en",theme:"azur"};
if(S.settings&&!S.settings.uiLang)S.settings.uiLang="en";
/* Schreibziel: standardmäßig aus; „base" ist der Wortstand beim Einschalten */
if(!S.goal)S.goal={on:false,target:1000,base:0};
ensureGlossaries();
/* Der Abstand zur Papierkante saß früher an der Kopf-/Fußzeile, jetzt am
   Seitenformat — wie in Word unter „Layout“. Eigene Werte wandern mit. */
S.docs.forEach(d=>{
  const hd=d.hdr&&d.hdr.dist,fd=d.ftr&&d.ftr.dist;
  if(hd===undefined&&fd===undefined)return;
  const f=fmtOf(d);
  d.fmt={...f,m:[...f.m],hd:hd!==undefined?hd:f.hd,fd:fd!==undefined?fd:f.fd};
  if(d.hdr)delete d.hdr.dist;
  if(d.ftr)delete d.ftr.dist;
});
S.docs.forEach(d=>{
  if(d.html&&d.html.indexOf('class="pgbreak"')>=0&&d.html.indexOf("data-label=")<0)
    d.html=d.html.replace(/<div class="pgbreak" contenteditable="false">/g,
      '<div class="pgbreak" contenteditable="false" data-label="Seitenumbruch">');
});

const doc=()=>S.docs.find(d=>d.id===S.active)||S.docs[0];

  $("#tabbar").innerHTML=S.docs.map(d=>
    `<div class="tab ${d.id===S.active?"on":""}" data-id="${d.id}" ${d.tabColor?`style="background:${d.tabColor};color:#22242A;border-color:rgba(0,0,0,.18)"`:""}>
      <span>${esc(tr(d.title))}</span><button class="x" data-close="${d.id}" title="${tr("Dokument schließen")}" ${d.tabColor?'style="color:#22242A"':""}>&times;</button></div>`
  ).join("")+`<button class="tabadd" id="newdoc" title="${tr("Neues Dokument")}">+</button>`;
}
function anchorsInDocCount(d){
  const t=document.createElement("div");t.innerHTML=d.html||"";
  const ids=new Set();t.querySelectorAll(".anch").forEach(s=>ids.add(s.dataset.n));
  return [...ids].filter(x=>findNote(x)).length;
}
function closeDoc(id){
  const i=S.docs.findIndex(d=>d.id===id);if(i<0)return;
  flush();
  const d=S.docs[i];
  const leer=!stripHtml(d.html).trim();
  const anker=anchorsInDocCount(d);
  const kill=()=>{
    /* Das letzte Dokument zu schließen führt zum Startbildschirm zurück, wie in
       Word. Bei mehreren Reitern wird nur neu gezeichnet — vorher entschied das
       an dieser Stelle, ob zufällig alle Dokumente leer sind. */
    const warLetztes=S.docs.length===1;
    S.docs.splice(i,1);

      ?anker+(anker>1?" linked notes remain":" linked note remains")
      :anker+(anker>1?" verknüpfte Notizen bleiben":" verknüpfte Notiz bleibt")+" erhalten");
  };
  if(leer){kill();return}

  overlay(`<div class="modal"><h3>${tr("Dokument schließen")}</h3><div class="pad">

        ${anker>1?"They remain":"It remains"} on the board and ${anker>1?"only lose":"only loses"} the link.`
      :`${anker}&nbsp;Notiz${anker>1?"en sind":" ist"} mit Stellen darin verknüpft.
      ${anker>1?"Sie bleiben":"Sie bleibt"} auf der Pinnwand erhalten und ${anker>1?"verlieren":"verliert"} nur die Verknüpfung.`}</p>`:""}
    </div>

      <button class="btn" style="margin-right:auto" id="cdSave">${tr("Vorher exportieren")}</button>
      <button class="btn" id="cdCancel">${tr("Abbrechen")}</button>

function renameTab(id){
  const d=S.docs.find(x=>x.id===id);if(!d)return;
  const el=document.querySelector(`.tab[data-id="${id}"] span`);
  if(!el)return;
  const input=document.createElement("input");
  input.value=d.title||"";input.maxLength=60;
  input.style.cssText="width:130px;border:none;background:rgba(255,255,255,.6);font:inherit;color:inherit;outline:none;border-radius:2px;padding:0 2px";
  el.replaceWith(input);input.focus();input.select();
  let done=false;
  const finish=()=>{
    if(done)return;done=true;
    const v=input.value.trim().slice(0,60);
    if(!v){
      d.customTitle=false;
      const t=stripHtml(d.html).trim().split("\n")[0].slice(0,32);
      d.title=t||"Ohne Titel";
    }else{d.title=v;d.customTitle=true}
    save();render();
  };
  input.addEventListener("blur",finish);
  input.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"){ev.preventDefault();input.blur()}
    if(ev.key==="Escape"){ev.preventDefault();done=true;render()}
  });
}

function drawWrite(){
  const d=doc();
  $("#pane").innerHTML=`<div class="sheet" id="sheet"><div class="pagewrap">
    <div class="papercol">
      <div class="ruler" id="ruler"></div>
      <div class="paper" id="paper">
        <div id="pagelayer"></div>
        <div id="editor" contenteditable="true" spellcheck="true" lang="${S.settings.lang}" data-doc-id="${d.id}" data-hint="${esc(tr("Tipp: Alt ⇧ P für Befehle · Alt 2 für Notizen · Alt 3 für Glossar"))}"></div>
        <div class="hfhint" id="hfhint"></div>
        <div class="hfedit" id="hfedit" contenteditable="true" spellcheck="false"></div>
        <div class="hfgrip" id="hfgrip" title="${esc(tr("Kopf-/Fußzeilenbereich ziehen"))}"></div>
        <div class="figrsz" id="figrsz" title="${esc(tr("Ziehen, um die Bildgröße zu ändern"))}"></div>
      </div>
    </div>
    <div class="anchcol" id="anchcol"></div>
  </div><div class="pageflag" id="pageflag"></div></div>`;
  const ed=$("#editor");
  ed.innerHTML=d.html||"<p><br></p>";
  ed.style.fontFamily=(d.font||S.settings.font)+",serif";
  ed.style.setProperty("--fs",(d.size||S.settings.size)+"pt");
  ed.style.setProperty("--lh",lhOf(d));
  if(S.fitPage!==false)fitZoom();
  $("#paper").style.setProperty("--zoom",S.zoom);
  ed.addEventListener("input",()=>{dirty=true;setTyping();markEmpty();
    drawStatus();queueAnchors();queuePaginate();typewriter();slashCheck()});
  ed.addEventListener("keydown",e=>{
    if(slashOn){
      if(e.key==="ArrowDown"){e.preventDefault();slashIdx=Math.min(slashIdx+1,slashHits.length-1);slashOpen(currentSlashQuery());return}
      if(e.key==="ArrowUp"){e.preventDefault();slashIdx=Math.max(slashIdx-1,0);slashOpen(currentSlashQuery());return}
      if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();slashRun(slashIdx);return}
      if(e.key==="Escape"){e.preventDefault();slashClose();return}
    }
    if(e.key!=="Tab")return;
    const cell=curCell();
    if(!cell){e.preventDefault();indentBlocks(e.shiftKey?-1:1);return}
    e.preventDefault();
    const table=cell.closest("table");
    const cells=[...table.querySelectorAll("td,th")];
    let i=cells.indexOf(cell)+(e.shiftKey?-1:1);
    if(i>=cells.length){
      const last=table.rows[table.rows.length-1];
      const nr=document.createElement("tr");
      [...last.children].forEach(()=>{const td=document.createElement("td");td.innerHTML="<br>";nr.appendChild(td)});
      last.parentNode.appendChild(nr);
      i=cells.length;
      const fresh=[...table.querySelectorAll("td,th")];
      putCaret(fresh[i]);dirty=true;queuePaginate();return;
    }
    if(i<0)return;
    putCaret(cells[i]);
  });
  ed.addEventListener("paste",e=>{
    const it=[...(e.clipboardData?e.clipboardData.items:[])].find(x=>x.type.startsWith("image/"));
    if(it){e.preventDefault();const f=it.getAsFile();if(f)addImage(f)}
  });
  ed.addEventListener("dragover",e=>{
    if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files"))e.preventDefault()});
  ed.addEventListener("drop",e=>{
    const f=e.dataTransfer&&e.dataTransfer.files[0];
    if(f&&f.type.startsWith("image/")){e.preventDefault();addImage(f)}
  });
  ed.addEventListener("keyup",e=>{
    if(["ArrowUp","ArrowDown","PageUp","PageDown","Enter"].includes(e.key))typewriter()});
  $("#sheet").addEventListener("scroll",()=>{pageFlag();if(hfEditing)drawHfBar();if(selFig)drawImgBar()});
  ed.addEventListener("blur",()=>{flush();if(S.settings.autosave)commit()});
  /* Kopf-/Fußzeile: Hinweis beim Überfahren, Doppelklick öffnet sie */
  $("#sheet").addEventListener("mousemove",e=>hfHintAt(e.clientY));
  $("#sheet").addEventListener("mouseleave",()=>{const h=$("#hfhint");if(h)h.classList.remove("on")});
  ed.addEventListener("dblclick",e=>{
    const zone=hfZoneAt(e.clientY);
    if(!zone)return;
    e.preventDefault();hfEditOpen(zone.which,zone.page);
  });
  $("#hfgrip").addEventListener("mousedown",hfGripDrag);
  $("#figrsz").addEventListener("mousedown",figResizeDrag);
  const hb=$("#hfedit");
  hb.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&e.shiftKey){   /* zweite Zeile in der Kopf-/Fußzeile */
      e.preventDefault();document.execCommand("insertLineBreak");
      setTimeout(()=>{placeHfGrip();drawHfBar()},0);return}
    if(e.key==="Enter"){e.preventDefault();hfEditCommit();hfEditClose();ed.focus();return}
    if(e.key==="Escape"){e.preventDefault();hfEditClose();ed.focus();return}
    if(e.key==="Tab"){e.preventDefault();
      const other=hfEditing&&hfEditing.which==="hdr"?"ftr":"hdr",pg=hfEditing?hfEditing.page:0;
      hfEditCommit();hfEditClose();hfEditOpen(other,pg)}
  });
  hb.addEventListener("blur",()=>{
    /* Klicks in der Leiste dürfen die Bearbeitung nicht beenden */
    setTimeout(()=>{if(hfEditing&&document.activeElement!==hb){hfEditCommit();hfEditClose()}},0);
  });
  ed.addEventListener("click",e=>{
    const fig=e.target.closest("figure.fig");
    if(fig&&!e.target.closest("figcaption")){selectFig(fig);return}
    if(!fig)selectFig(null);
    const lk=e.target.closest("a");
    if(lk&&(e.ctrlKey||e.metaKey)){e.preventDefault();
      window.open(lk.getAttribute("href"),"_blank","noopener");return}
    const a=e.target.closest(".anch");
    if(a){const id=a.dataset.n;hotNote=id;
      const list=spansOf(id);curOcc[id]=Math.max(0,list.indexOf(a));drawAnchors()}});
  ed.focus();
  placeCaretEnd(ed);
  if(S.marks)markTerms();
  markEmpty();setPrintPage();
  paginate();
  drawAnchors();
}
function placeCaretEnd(el){const r=document.createRange();r.selectNodeContents(el);r.collapse(false);
  const s=getSelection();s.removeAllRanges();s.addRange(r)}
function flush(){const ed=$("#editor");if(ed&&ed.dataset.docId===S.active){const d=doc();
  const c=ed.cloneNode(true);
  c.querySelectorAll("figure.fig").forEach(f=>f.classList.remove("sel"));
  c.querySelectorAll(".hit,.glossterm").forEach(s=>{
    const p=s.parentNode;while(s.firstChild)p.insertBefore(s.firstChild,s);p.removeChild(s)});
  c.normalize();
  d.html=c.innerHTML;
  if(!d.customTitle){const t=(ed.innerText||"").trim().split("\n")[0].slice(0,32);d.title=t||"Ohne Titel"}}}
/* Schriftgröße frei eingebbar, wie das Kombifeld in Word. Der Wert geht an
   --fs; ein direktes style.fontSize würde die Zoomberechnung überschreiben. */
const FS_MIN=4,FS_MAX=200;
function setFontSize(v){
  const roh=parseFloat(String(v).replace(",","."));
  if(!isFinite(roh))return drawTools();
  const n=Math.min(FS_MAX,Math.max(FS_MIN,Math.round(roh*2)/2));
  doc().size=n;
  const ed=$("#editor");
  if(ed)ed.style.setProperty("--fs",n+"pt");
  commit();drawTools();queuePaginate();
  return n;
}
function sizeMenu(e){
  closeMenu();
  const akt=doc().size||S.settings.size;
  const m=document.createElement("div");m.className="menu ctx";m.id="fsmenu";
  m.style.minWidth="86px";
  m.innerHTML=SIZES.map(x=>
    `<button class="mi" data-fs="${x}"><span class="chk">${x==akt?"✓":""}</span>${x}</button>`).join("");
  document.body.appendChild(m);
  const r=e.currentTarget.getBoundingClientRect();
  m.style.left=Math.min(r.left,innerWidth-m.offsetWidth-8)+"px";
  m.style.top=Math.min(r.bottom+4,innerHeight-m.offsetHeight-8)+"px";
  m.onclick=ev=>{const b=ev.target.closest("[data-fs]");if(!b)return;
    closeMenu();setFontSize(b.dataset.fs);const ed=$("#editor");ed&&ed.focus()};
}
function cmd(c){document.execCommand(c,false,null);$("#editor")&&$("#editor").focus();dirty=true;drawStatus()}

/* ---- Schriftfarbe und Texthervorhebung ----
   Eine Hervorhebung setzt zusätzlich dunkle Schrift, sonst wäre in den
   dunklen Schemata helle Schrift auf hellem Pastell unlesbar — dieselbe
   Regel, nach der auch die Notizzettel arbeiten. */
function farbeAnwenden(art,c){
  const ed=$("#editor");if(!ed)return;
  ed.focus();
  document.execCommand("styleWithCSS",false,true);
  if(art==="fore")document.execCommand("foreColor",false,c);
  else{document.execCommand("hiliteColor",false,c);document.execCommand("foreColor",false,MARKINK)}
  if(art==="fore")S.settings.foreColor=c; else S.settings.markColor=c;
  dirty=true;commit();drawTools();queuePaginate();
}
/* Farbe entfernen: eine Kennfarbe setzen, danach genau die Elemente
   aufräumen, die sie tragen. Ohne den Umweg gäbe es keinen verlässlichen
   Weg, execCommand eine gesetzte Farbe wieder wegnehmen zu lassen. */
function farbeEntfernen(art){
  const ed=$("#editor");if(!ed)return;
  ed.focus();
  document.execCommand("styleWithCSS",false,true);
  const kenn="#010203";
  document.execCommand(art==="fore"?"foreColor":"hiliteColor",false,kenn);
  if(art!=="fore")document.execCommand("foreColor",false,kenn);
  const treffer=/rgb\(1,\s*2,\s*3\)|#010203/i;
  ed.querySelectorAll("[style]").forEach(el=>{
    let ran=false;
    ["color","backgroundColor"].forEach(p=>{
      if(el.style[p]&&treffer.test(el.style[p])){el.style[p]="";ran=true}
    });
    if(!ran)return;
    if(!el.getAttribute("style"))el.removeAttribute("style");
    if(el.tagName==="SPAN"&&!el.attributes.length){
      while(el.firstChild)el.parentNode.insertBefore(el.firstChild,el);
      el.remove();
    }
  });
  ed.normalize();
  dirty=true;commit();queuePaginate();
}
function colorMenu(e,art){
  closeMenu();
  const liste=art==="fore"?TEXTCOLORS:MARKCOLORS;
  const aktuell=art==="fore"?(S.settings.foreColor||TEXTCOLORS[0].c):(S.settings.markColor||MARKCOLORS[0].c);
  const m=document.createElement("div");m.className="menu ctx";m.id="colmenu";
  m.innerHTML=`<div class="mlabel">${art==="fore"?tr("Schriftfarbe"):tr("Texthervorhebung")}</div>
    <div class="swatches">${liste.map(x=>
      `<button class="sw" data-col="${x.c}" title="${esc(tr(x.n))}" aria-label="${esc(tr(x.n))}"
        style="background:${x.c}${x.c.toLowerCase()===String(aktuell).toLowerCase()?";box-shadow:0 0 0 2px var(--stamp)":""}"></button>`).join("")}
    </div>
    <label class="mi" id="colOwn">${tr("Eigene Farbe")}&hellip;
      <input type="color" id="colPick" value="${aktuell}"></label>
    <div class="msep"></div>
    <button class="mi" data-col="none"><span class="chk"></span>${
      art==="fore"?tr("Farbe entfernen"):tr("Hervorhebung entfernen")}</button>`;
  document.body.appendChild(m);
  const r=e.currentTarget?e.currentTarget.getBoundingClientRect():{left:e.clientX,bottom:e.clientY};
  m.style.left=Math.min(r.left,innerWidth-m.offsetWidth-8)+"px";
  m.style.top=Math.min(r.bottom+4,innerHeight-m.offsetHeight-8)+"px";
  /* Auswahl im Editor darf beim Klicken nicht verlorengehen */
  m.addEventListener("mousedown",ev=>{if(ev.target.type!=="color")ev.preventDefault()});
  m.onclick=ev=>{
    const b=ev.target.closest("[data-col]");if(!b)return;
    closeMenu();
    if(b.dataset.col==="none")farbeEntfernen(art);else farbeAnwenden(art,b.dataset.col);
  };
  const pick=m.querySelector("#colPick");
  pick.oninput=()=>{farbeAnwenden(art,pick.value)};
  pick.onchange=()=>{closeMenu()};
}

/* ---- Einrücken / Ausrücken ---- */
const IND_STEP=2,IND_MAX=12; /* em, also skaliert mit Schriftgröße und Zoom */
function curListItem(){
  const s=getSelection();if(!s.rangeCount)return null;
  let n=s.getRangeAt(0).startContainer;
  n=n.nodeType===1?n:n.parentElement;
  const ed=$("#editor");
  return (n&&ed&&ed.contains(n))?n.closest("li"):null;
}
function selectedBlocks(){
  const ed=$("#editor");if(!ed)return[];
  const s=getSelection();if(!s.rangeCount)return[];
  const r=s.getRangeAt(0);
  const out=[...ed.children].filter(b=>{try{return r.intersectsNode(b)}catch(e){return false}});
  if(out.length)return out;
  const b=curBlock();return b?[b]:[];
}
function indentBlocks(dir){
  const ed=$("#editor");
  if(S.mode!=="write"||!ed){toast(tr("Nur im Schreibmodus"));return}
  ed.focus();
  /* In Listen macht die native Verschachtelung mehr Sinn als ein Rand */
  if(curListItem()){
    document.execCommand(dir>0?"indent":"outdent");
    flush();dirty=true;commit();queuePaginate();drawStatus();return;
  }
  const blocks=selectedBlocks();
  if(!blocks.length)return;
  blocks.forEach(b=>{
    if(b.classList&&b.classList.contains("pgbreak"))return;
    const cur=parseFloat(b.style.marginLeft)||0;
    const next=Math.min(IND_MAX,Math.max(0,cur+dir*IND_STEP));
    b.style.marginLeft=next>0?next+"em":"";
  });
  flush();dirty=true;commit();queuePaginate();drawAnchors();drawStatus();
}

/* Glossarbegriffe markieren */
function markTerms(){
  const ed=$("#editor");if(!ed)return;
  unmark();
  const entries=S.glossary.filter(g=>g.gid===doc().glossaryId);
  const terms=entries.map(g=>g.term).filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!terms.length)return;
  const rx=new RegExp("\\b("+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
  const walk=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);
  const jobs=[];let n;
  while(n=walk.nextNode()){if(n.parentElement.classList.contains("glossterm"))continue;
    if(rx.test(n.nodeValue)){rx.lastIndex=0;jobs.push(n)}}
  jobs.forEach(node=>{
    const frag=document.createDocumentFragment();let last=0,m;rx.lastIndex=0;
    while(m=rx.exec(node.nodeValue)){
      frag.appendChild(document.createTextNode(node.nodeValue.slice(last,m.index)));
      const g=entries.find(x=>x.term.toLowerCase()===m[0].toLowerCase());
      const sp=document.createElement("span");sp.className="glossterm";sp.textContent=m[0];
      sp.title=g?g.def:"";frag.appendChild(sp);last=m.index+m[0].length}
    frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
    node.parentNode.replaceChild(frag,node)});
}
function unmark(){const ed=$("#editor");if(!ed)return;
  ed.querySelectorAll(".glossterm").forEach(s=>s.replaceWith(document.createTextNode(s.textContent)));ed.normalize()}

/* ================= Notizen ================= */
function noteBody(n){
  if(n.html!==undefined&&n.html!==null)return n.html;
  return n.text?"<p>"+esc(n.text).replace(/\n/g,"<br>")+"</p>":"";
}
function noteText(n){const t=document.createElement("div");t.innerHTML=noteBody(n);return (n.title?n.title+" ":"")+(t.innerText||"")}
/* Inneres Markup einer Notizkarte — identisch für Raster- und Listenansicht,
   nur die Hülle (absolut positioniert vs. Zeile im Fluss) unterscheidet sich. */
function noteCardInner(n){
  return `
        <div class="grip"></div>
        ${anchorCount(n.id)?`<div class="anchbadge">${S.settings.uiLang==="en"
            ?anchorCount(n.id)+(anchorCount(n.id)>1?" spots in text":" spot in text")
            :anchorCount(n.id)+" Stelle"+(anchorCount(n.id)>1?"n":"")+" im Text"}</div>`:""}
        ${n._here?`<div class="src">${n._here}&times; ${tr("hier")}</div>`:""}
        ${n.title?`<div class="ntitle">${esc(n.title)}</div>`:""}
        <div class="nbody" data-hint="${esc(tr("Leere Notiz — anklicken zum Öffnen"))}">${noteBody(n)}</div>
        <div class="fade"></div>
        <div class="meta">${new Date(n.created).toLocaleDateString(LOC())}</div>
        <div class="sw">${NOTECOLORS.map(x=>`<button data-color="${x.c}" data-nid="${n.id}" style="background:${x.c}" title="${tr(x.n)}"></button>`).join("")}</div>
        <button class="del" data-del="${n.id}" title="${tr("Löschen")}">&times;</button>`;
}
function drawNotes(){
  const list=
    S.notes.map(n=>({...n,_here:anchorsInDoc(n.id)}));
  const q=(window._nq||"").toLowerCase();
  const vis=list.filter(n=>(!q||noteText(n).toLowerCase().includes(q))
    &&(S.noteFilter==="all"
      ||(S.noteFilter==="doc"&&n._here>0)
      ||(S.noteFilter==="free"&&!anchorCount(n.id))));
  const leer=`<div class="empty">${tr("Noch keine Notizen.<br>Neue Notiz anlegen mit <b>Alt+Umschalt+N</b> — das geht auch mitten im Schreiben, ohne die Ansicht zu wechseln.<br>Ein Klick öffnet eine Notiz zum Bearbeiten, Ziehen verschiebt sie.")}</div>`;
  if(S.noteView==="list"){
    $("#pane").innerHTML=`<div class="notecanvas list" id="canvas">${
      vis.length?vis.map(n=>`
        <div class="note nrow ${n.id===openNoteId?"sel":""}" data-id="${n.id}"
          style="background:${n.color||NOTECOLORS[0].c};--nc:${n.color||NOTECOLORS[0].c}">${noteCardInner(n)}</div>`).join("")
      :leer
    }</div>`;
  } else {
    $("#pane").innerHTML=`<div class="notecanvas" id="canvas" style="min-height:${Math.max(420,...vis.map(n=>n.y+NH+NPAD*2))}px">${
      vis.length?vis.map(n=>`
        <div class="note ${n.id===openNoteId?"sel":""}" data-id="${n.id}"
          style="left:${n.x}px;top:${n.y}px;background:${n.color||NOTECOLORS[0].c};--nc:${n.color||NOTECOLORS[0].c}">${noteCardInner(n)}</div>`).join("")
      :leer
    }</div>`;
  }
  enableDrag();
}
function findNote(id){return S.notes.find(x=>x.id===id)||null}
function anchorsInDoc(id,d){const t=document.createElement("div");t.innerHTML=(d||doc()).html||"";
  return t.querySelectorAll('.anch[data-n="'+id+'"]').length}
/* Platz für eine neue Notiz: das erste freie Rasterfeld von oben links.
   Vorher wurde nach Array-Index gerechnet, wodurch die zwanzigste Notiz
   zwangsläufig ganz unten landete — auch wenn oben längst alles frei war,
   weil Notizen verschoben oder gelöscht wurden. */
const NW=224,NH=224,NGAP=12,NPAD=16;
function freierNotizPlatz(){
  const canvas=$("#canvas");
  const breite=(canvas?canvas.clientWidth:0)||($("#pane")?$("#pane").clientWidth:0)||760;
  const spalten=Math.max(1,Math.floor((breite-NPAD)/(NW+NGAP)));
  const belegt=S.notes.map(n=>({x:n.x||0,y:n.y||0}));
  const frei=(x,y)=>!belegt.some(b=>Math.abs(b.x-x)<NW+NGAP*0.5&&Math.abs(b.y-y)<NH+NGAP*0.5);
  for(let reihe=0;reihe<400;reihe++)
    for(let sp=0;sp<spalten;sp++){
      const x=NPAD+sp*(NW+NGAP),y=NPAD+reihe*(NH+NGAP);
      if(frei(x,y))return{x,y};
    }
  return{x:NPAD,y:NPAD};
}
function addNote(text,open){
  const pos=freierNotizPlatz();
  const n={id:uid(),title:"",html:text?"<p>"+esc(text).replace(/\n/g,"<br>")+"</p>":"",
    color:NOTECOLORS[0].c,fs:14,x:pos.x,y:pos.y,created:Date.now()};
  S.notes.push(n);dirty=true;commit();
  if(open){setMode("notes");openNote(n.id,"titel")}
  return n;
}
/* Zwei Notizen tauschen den Platz: in der Rasteransicht die Koordinaten,
   in der Liste die Reihenfolge im Array (das ist dort die Anzeigereihenfolge). */
function swapNotes(idA,idB){
  if(S.noteView==="list"){
    const ia=S.notes.findIndex(x=>x.id===idA),ib=S.notes.findIndex(x=>x.id===idB);
    if(ia<0||ib<0)return;
    [S.notes[ia],S.notes[ib]]=[S.notes[ib],S.notes[ia]];
  } else {
    const a=findNote(idA),b=findNote(idB);
    if(!a||!b)return;
    const tx=a.x,ty=a.y;a.x=b.x;a.y=b.y;b.x=tx;b.y=ty;
  }
  dirty=true;commit();
}
function enableDrag(){
  const pane=$("#pane"),canvas=$("#canvas");
  if(!canvas)return;
  let cur=null,ziel=null,gx=0,gy=0,sx=0,sy=0,moved=false,lauf=null,letzteX=0,letzteY=0;
  const stopp=()=>{if(lauf){cancelAnimationFrame(lauf);lauf=null}};
  /* Position aus der Zeigerlage im Blatt, nicht aus einem Startversatz —
     so bleibt die Notiz am Zeiger, auch wenn die Fläche mitscrollt. In der
     Listenansicht gibt es kein x/y, dort hebt sich die Zeile per Transform. */
  const bewegen=()=>{
    if(!cur)return;
    if(S.noteView==="list"){
      cur.style.transform=`translateY(${letzteY-sy}px)`;
    } else {
      const cr=canvas.getBoundingClientRect();
      const maxX=Math.max(0,canvas.clientWidth-NW);
      cur.style.left=Math.min(maxX,Math.max(0,letzteX-cr.left-gx))+"px";
      cur.style.top=Math.max(0,letzteY-cr.top-gy)+"px";
    }
    /* Ablageziel ermitteln: welche andere Notiz liegt gerade unter dem Zeiger?
       .drag hat pointer-events:none, daher trifft elementFromPoint die
       darunterliegende Karte, nicht die gezogene selbst. */
    const unter=document.elementFromPoint(letzteX,letzteY);
    const treffer=unter&&unter.closest?unter.closest(".note"):null;
    const neuesZiel=(treffer&&treffer!==cur)?treffer:null;
    if(neuesZiel!==ziel){
      if(ziel)ziel.classList.remove("drop-target");
      ziel=neuesZiel;
      if(ziel)ziel.classList.add("drop-target");
    }
  };
  canvas.querySelectorAll(".note").forEach(el=>{
    el.onmousedown=e=>{
      if(e.target.closest("button"))return;
      const r=el.getBoundingClientRect();
      cur=el;gx=e.clientX-r.left;gy=e.clientY-r.top;
      sx=e.clientX;sy=e.clientY;moved=false;e.preventDefault()};
  });
  document.onmousemove=e=>{
    if(!cur)return;
    if(!moved&&Math.abs(e.clientX-sx)<=4&&Math.abs(e.clientY-sy)<=4)return;
    if(!moved){moved=true;cur.classList.add("drag")}
    letzteX=e.clientX;letzteY=e.clientY;
    bewegen();
    /* Am oberen und unteren Rand mitscrollen, sonst endet das Ziehen am Fensterrand */
    const pr=pane.getBoundingClientRect();
    const oben=letzteY-pr.top,unten=pr.bottom-letzteY;
    stopp();
    const schritt=oben<44?-Math.min(20,(44-oben)/2):unten<44?Math.min(20,(44-unten)/2):0;
    if(schritt){
      const tick=()=>{pane.scrollTop+=schritt;bewegen();lauf=requestAnimationFrame(tick)};
      lauf=requestAnimationFrame(tick);
    }
  };
  document.onmouseup=()=>{
    if(!cur)return;
    stopp();
    cur.classList.remove("drag");
    cur.style.transform="";
    if(ziel)ziel.classList.remove("drop-target");
    const el=cur,zielEl=ziel;cur=null;ziel=null;
    if(!moved){
      const n=findNote(el.dataset.id);
      openNote(el.dataset.id,(n&&!n.title)?"titel":undefined);
      return;
    }
    if(zielEl){
      swapNotes(el.dataset.id,zielEl.dataset.id);
    } else if(S.noteView!=="list"){
      const n=findNote(el.dataset.id);
      if(n){n.x=parseInt(el.style.left)||0;n.y=parseInt(el.style.top)||0;dirty=true;commit()}
    }
    /* Neu zeichnen, damit die Fläche mitwächst — sonst bleibt eine weit unten
       abgelegte Notiz außerhalb des scrollbaren Bereichs. */
    drawNotes();
  };
}

/* ================= Glossar ================= */
/* Getrennte Glossare: jedes Dokument gehört zu genau einer Sammlung */
function ensureGlossaries(){
  if(!S.glossary)S.glossary=[];
  if(!S.glossaries||!S.glossaries.length){
    const gid=uid();
    S.glossaries=[{id:gid,name:"Glossar"}];
    S.glossary.forEach(g=>{if(!g.gid)g.gid=gid});
  }
  const known=new Set(S.glossaries.map(c=>c.id));
  S.glossary.forEach(g=>{if(!g.gid||!known.has(g.gid))g.gid=S.glossaries[0].id});
  /* null heißt „bewusst ohne Zuordnung“ und bleibt stehen; fehlend oder
     verwaist bekommt die erste Sammlung. */
  S.docs.forEach(d=>{
    if(d.glossaryId===null)return;
    if(!d.glossaryId||!known.has(d.glossaryId))d.glossaryId=S.glossaries[0].id;
  });
}
/* Welche Sammlung gerade angesehen wird. Bewusst getrennt von der Zuordnung
   des Dokuments: Reiter wechseln zeigt nur an, es bindet nichts um. Nicht
   gespeichert — beim Dokumentwechsel fällt die Ansicht auf dessen Glossar. */
let gView=null,gViewFor=null;
function curGView(){
  const d=doc();
  if(gViewFor!==d.id||!gView||!S.glossaries.some(c=>c.id===gView)){
    /* Ein Dokument ohne Zuordnung zeigt trotzdem etwas an — dann die erste Sammlung */
    gView=(d.glossaryId&&S.glossaries.some(c=>c.id===d.glossaryId))?d.glossaryId:S.glossaries[0].id;
    gViewFor=d.id;
  }
  return gView;
}
function setGView(id){gView=id;gViewFor=doc().id}
/* Zwei gleichnamige Reiter sind nicht auseinanderzuhalten, darum durchnummerieren */
function freierCollName(basis){
  const belegt=new Set(S.glossaries.map(c=>tr(c.name).trim().toLowerCase()));
  if(!belegt.has(basis.trim().toLowerCase()))return basis;
  for(let i=2;;i++){const k=basis+" "+i;if(!belegt.has(k.toLowerCase()))return k}
}
function newGlossColl(){
  const id=uid();
  S.glossaries.push({id,name:freierCollName(tr("Ohne Titel"))});
  setGView(id);
  commit();render();
  renameGlossColl(id);
}
function renameGlossColl(id){
  const c=S.glossaries.find(x=>x.id===id);if(!c)return;
  /* Die angesehene Sammlung im Kopf umbenennen — dort steht der Name groß und
     ist auch dann da, wenn die Reiterleiste (bei nur einem Glossar) fehlt. */
  const imKopf=id===curGView();
  const el=imKopf?document.querySelector(".ghead h2"):document.querySelector(`.gcoll[data-gc="${id}"]`);
  if(!el)return;
  const input=document.createElement("input");
  input.value=c.name||"";input.maxLength=40;
  input.style.cssText=imKopf
    ?"width:min(100%,340px);border:1px solid var(--rule);background:var(--paper);font:inherit;font-family:Georgia,serif;font-size:20px;font-weight:600;color:var(--ink);outline:none;border-radius:var(--radius);padding:1px 6px"
    :"width:100px;border:none;background:rgba(255,255,255,.6);font:inherit;color:inherit;outline:none;border-radius:2px;padding:0 2px";
  el.replaceWith(input);input.focus();input.select();
  let done=false;
  const finish=()=>{
    if(done)return;done=true;
    const v=input.value.trim().slice(0,40);
    /* Beim Umbenennen ebenfalls entdoppeln — sonst stehen zwei gleiche Reiter da */
    const andere=S.glossaries.filter(x=>x.id!==id).map(x=>tr(x.name).trim().toLowerCase());
    let neu=v||tr("Ohne Titel");
    if(andere.includes(neu.toLowerCase())){
      for(let i=2;;i++){const k=neu+" "+i;if(!andere.includes(k.toLowerCase())){neu=k;break}}
    }
    c.name=neu;
    save();render();
  };
  input.addEventListener("blur",finish);
  input.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"){ev.preventDefault();input.blur()}
    if(ev.key==="Escape"){ev.preventDefault();done=true;render()}
  });
}

/* Wie ein gedrucktes Glossar in Abschnitte teilen: nach Anfangsbuchstabe
   bzw. Kategorie. Nach Datum sortiert ergäbe eine Gruppierung keinen Sinn. */

  if(S.gsort==="date")return [[null,list]];
  const kopf=g=>S.gsort==="cat"?(g.cat||tr("Ohne Kategorie"))
    :(g.term||"").trim().charAt(0).toLocaleUpperCase(LOC())||"—";

  list.forEach(g=>{

    if(raus.length&&raus[raus.length-1][0]===k)raus[raus.length-1][1].push(g);
    else raus.push([k,[g]]);
