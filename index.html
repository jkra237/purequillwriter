/* ================= Schreiben ================= */
function drawWrite(){
  const d=doc();
  $("#pane").innerHTML=`<div class="sheet" id="sheet"><div class="pagewrap">
    <div class="papercol">
      <div class="ruler" id="ruler"></div>
      <div class="paper" id="paper">
        <div id="pagelayer"></div>
        <div id="editor" contenteditable="true" spellcheck="true" lang="${S.settings.lang}" data-doc-id="${d.id}"></div>
        <div class="hfhint" id="hfhint"></div>
        <div class="hfedit" id="hfedit" contenteditable="true" spellcheck="false"></div>
        <div class="hfgrip" id="hfgrip" title="${esc(tr("Kopf-/Fußzeilenbereich ziehen"))}"></div>
        <div class="figrsz" id="figrsz" title="${esc(tr("Ziehen, um die Bildgröße zu ändern"))}"></div>
      </div>
    </div>
    <div class="anchcol" id="anchcol"></div>
  </div><div class="pageflag" id="pageflag"></div></div>`;
  const ed=$("#editor");
  ed.innerHTML=d.html||"<p><br></p>";
  ed.style.fontFamily=(d.font||S.settings.font)+",serif";
  ed.style.setProperty("--fs",(d.size||S.settings.size)+"pt");
  ed.style.setProperty("--lh",lhOf(d));
  ed.style.setProperty("--ps",psOf(d)+"em");
  if(S.fitPage!==false)fitZoom();
  $("#paper").style.setProperty("--zoom",S.zoom);
  ed.addEventListener("input",()=>{dirty=true;setTyping();markEmpty();
    drawStatus();queueAnchors();queuePaginate();typewriter();slashCheck();syncToolbarState()});
  ed.addEventListener("keydown",e=>{
    if(slashOn){
      if(e.key==="ArrowDown"){e.preventDefault();slashIdx=Math.min(slashIdx+1,slashHits.length-1);slashOpen(currentSlashQuery());return}
      if(e.key==="ArrowUp"){e.preventDefault();slashIdx=Math.max(slashIdx-1,0);slashOpen(currentSlashQuery());return}
      if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();slashRun(slashIdx);return}
      if(e.key==="Escape"){e.preventDefault();slashClose();return}
    }
    if(e.key!=="Tab")return;
    const cell=curCell();
    if(!cell){e.preventDefault();indentBlocks(e.shiftKey?-1:1);return}
    e.preventDefault();
    const table=cell.closest("table");
    const cells=[...table.querySelectorAll("td,th")];
    let i=cells.indexOf(cell)+(e.shiftKey?-1:1);
    if(i>=cells.length){
      const last=table.rows[table.rows.length-1];
      const nr=document.createElement("tr");
      [...last.children].forEach(()=>{const td=document.createElement("td");td.innerHTML="<br>";nr.appendChild(td)});
      last.parentNode.appendChild(nr);
      i=cells.length;
      const fresh=[...table.querySelectorAll("td,th")];
      putCaret(fresh[i]);dirty=true;queuePaginate();return;
    }
    if(i<0)return;
    putCaret(cells[i]);
  });
  /* Kopiertes bekommt eine Herkunftsmarke mit — beim Einfügen ist sonst nicht
     zu unterscheiden, ob der Inhalt aus diesem Dokument stammt oder von einer
     fremden Seite (siehe cleanPasteForeign). Suchtreffer und Prüfmarkierungen
     sind Anzeige, kein Inhalt, und bleiben wie beim Speichern draußen. */
  const stempeln=e=>{
    const sel=getSelection();
    if(!sel.rangeCount||sel.isCollapsed||!e.clipboardData)return false;
    const box=document.createElement("div");
    box.setAttribute(PQW_MARK,"1");
    box.appendChild(sel.getRangeAt(0).cloneContents());
    box.querySelectorAll(".hit,.spellerr,.glossterm").forEach(unwrap);
    box.querySelectorAll(".fhwrap").forEach(n=>n.remove());
    e.clipboardData.setData("text/html",box.outerHTML);
    e.clipboardData.setData("text/plain",sel.toString());
    e.preventDefault();
    return true;
  };
  ed.addEventListener("copy",stempeln);
  ed.addEventListener("cut",e=>{
    if(!stempeln(e))return;
    /* Nach preventDefault entfernt der Browser die Auswahl nicht mehr selbst.
       execCommand statt eigenem Löschen: es kennt die Blockgrenzen und hängt
       sich in dieselbe Rückgängig-Kette wie alles andere. */
    document.execCommand("delete");
    flush();dirty=true;commit();queuePaginate();
  });
  ed.addEventListener("paste",e=>{
    const cd=e.clipboardData;
    if(!cd)return;
    /* Strg+Umschalt+V: Gliederung und Auszeichnung der Quelle bleiben ganz
       draußen, es kommt nur der Text an — gedacht fürs Zitieren mitten in den
       eigenen Fließtext. Eine einzelne Zeile wird an der Cursorstelle
       eingesetzt, statt dort einen Absatz aufzureißen. */
    if(plainPaste){
      plainPaste=false;
      const text=cd.getData("text/plain");
      if(!text)return;
      e.preventDefault();
      if(text.indexOf("\n")<0)document.execCommand("insertText",false,text);
      else document.execCommand("insertHTML",false,plainToHtml(text));
      flush();dirty=true;commit();queuePaginate();
      toast(tr("Ohne Formatierung eingefügt"));
      return;
    }
    const html=cd.getData("text/html");
    /* Ein Bild ohne begleitendes HTML ist ein Screenshot o. ä. — der wird
       eingebettet. Liegt HTML daneben, ist es kopierter Seiteninhalt. */
    if(!html){
      const it=[...cd.items].find(x=>x.type.startsWith("image/"));
      if(it){e.preventDefault();const f=it.getAsFile();if(f)addImage(f)}
      return;                       /* reiner Text: der Browser macht das richtig */
    }
    e.preventDefault();
    pasteBarClose();                 /* ein früherer Knopf gilt nicht mehr */
    const eigen=html.indexOf(PQW_MARK)>=0;
    const sauber=eigen?cleanPasteOwn(html):cleanPasteForeign(html);
    const rohtext=cd.getData("text/plain");
    /* Der Knopf lohnt nur bei fremdem Inhalt: was aus dem eigenen Dokument
       kommt, ist bewusst so formatiert kopiert worden. Beim Verschieben von
       Absätzen ginge er sonst dauernd auf. */
    const zeigen=!eigen&&rohtext&&pasteHasFormat(sauber);
    const snapshot=zeigen?ed.innerHTML:null;
    const caretVor=zeigen?caretPath(ed):null;
    /* Vorher merken, welche Fernbilder schon dastanden: nachgeladen werden
       sollen nur die neuen, sonst klopfte jedes Einfügen erneut bei allen
       Quellservern früherer Einfügungen an. */
    const vorher=new Set([...ed.querySelectorAll('img[src^="http"]')]);
    if(sauber)document.execCommand("insertHTML",false,sauber);
    pasteTidy();
    flush();dirty=true;commit();queuePaginate();
    if(zeigen)pasteBarShow(snapshot,caretVor,rohtext);
    if(!eigen)embedRemoteImages([...ed.querySelectorAll('img[src^="http"]')]
      .filter(i=>!vorher.has(i)));
  });
  ed.addEventListener("dragover",e=>{
    if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files"))e.preventDefault()});
  ed.addEventListener("drop",e=>{
    const f=e.dataTransfer&&e.dataTransfer.files[0];
    if(f&&f.type.startsWith("image/")){e.preventDefault();addImage(f)}
  });
  ed.addEventListener("keyup",e=>{
    if(["ArrowUp","ArrowDown","PageUp","PageDown","Enter"].includes(e.key))typewriter()});
  $("#sheet").addEventListener("scroll",()=>{pageFlag();if(hfEditing)drawHfBar();if(selFig)drawImgBar();updateOutlineActive()});
  /* #pane ist der Container, der bei langen Dokumenten tatsächlich scrollt
     (siehe updateOutlineActive) - #sheet selbst bleibt in der Praxis meist
     so groß wie sein Inhalt und scrollt dann gar nicht. Beide Listener zu
     binden ist billig und deckt beide Fälle ab, ohne das bestehende
     Bildlauf-Verhalten (Seitenflagge, Kopf-/Fußzeilen-Leiste) anzutasten. */
  $("#pane").addEventListener("scroll",()=>updateOutlineActive());
  ed.addEventListener("blur",()=>{flush();if(S.settings.autosave)commit()});
  /* Kopf-/Fußzeile: Hinweis beim Überfahren, Doppelklick öffnet sie */
  $("#sheet").addEventListener("mousemove",e=>hfHintAt(e.clientY));
  $("#sheet").addEventListener("mouseleave",()=>{const h=$("#hfhint");if(h)h.classList.remove("on")});
  ed.addEventListener("dblclick",e=>{
    const zone=hfZoneAt(e.clientY);
    if(!zone)return;
    e.preventDefault();hfEditOpen(zone.which,zone.page);
  });
  $("#hfgrip").addEventListener("mousedown",hfGripDrag);
  $("#figrsz").addEventListener("mousedown",figResizeDrag);
  const hb=$("#hfedit");
  hb.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&e.shiftKey){   /* zweite Zeile in der Kopf-/Fußzeile */
      e.preventDefault();document.execCommand("insertLineBreak");
      setTimeout(()=>{placeHfGrip();drawHfBar()},0);return}
    if(e.key==="Enter"){e.preventDefault();hfEditCommit();hfEditClose();ed.focus();return}
    if(e.key==="Escape"){e.preventDefault();hfEditClose();ed.focus();return}
    if(e.key==="Tab"){e.preventDefault();
      const other=hfEditing&&hfEditing.which==="hdr"?"ftr":"hdr",pg=hfEditing?hfEditing.page:0;
      hfEditCommit();hfEditClose();hfEditOpen(other,pg)}
  });
  hb.addEventListener("blur",()=>{
    /* Klicks in der Leiste dürfen die Bearbeitung nicht beenden */
    setTimeout(()=>{if(hfEditing&&document.activeElement!==hb){hfEditCommit();hfEditClose()}},0);
  });
  ed.addEventListener("mousemove",e=>{
    if(tableDragActive)return;
    const edge=findTableEdge(e.clientX,e.clientY);
    ed.style.cursor=edge?(edge.type==="col"?"col-resize":"row-resize"):"";
  });
  ed.addEventListener("mousedown",e=>{
    const edge=findTableEdge(e.clientX,e.clientY);
    if(edge){startTableDrag(e,edge);return}
    freeFigMouseDown(e);
  });
  ed.addEventListener("click",e=>{
    /* Zahnrad/Aktualisieren sollen nicht dauerhaft im Text stehen - erst ein
       Klick auf den Block blendet sie ein (zusätzlich zum reinen Hover per
       CSS), ein Klick daneben blendet sie wieder aus. */
    const tocHit=e.target.closest(".toc");
    ed.querySelectorAll(".toc.sel").forEach(t=>{if(t!==tocHit)t.classList.remove("sel")});
    if(tocHit)tocHit.classList.add("sel");
    const fig=e.target.closest("figure.fig");
    if(fig&&!e.target.closest("figcaption")){selectFig(fig);return}
    if(!fig)selectFig(null);
    const lk=e.target.closest("a");
    if(lk&&!lk.closest(".toc")&&(e.ctrlKey||e.metaKey)){e.preventDefault();
      window.open(lk.getAttribute("href"),"_blank","noopener");return}
    const a=e.target.closest(".anch");
    if(a){const id=a.dataset.n;hotNote=id;
      const list=spansOf(id);curOcc[id]=Math.max(0,list.indexOf(a));drawAnchors();return}
    const fn=e.target.closest(".fn");
    if(fn){e.preventDefault();editFootnote(fn.dataset.fn);return}
    const tocRefresh=e.target.closest(".toc-refresh");
    if(tocRefresh){e.preventDefault();refreshToc(tocRefresh.closest(".toc"));return}
    const tocSettings=e.target.closest(".toc-settings");
    if(tocSettings){e.preventDefault();tocSettingsDialog(tocSettings.closest(".toc"));return}
    /* Der Eintragstext (.toc-t) ist die einzige editierbare Insel im sonst
       gesperrten Verzeichnis-Block - ein normaler Klick setzt dort die
       Schreibmarke zum Umbenennen, erst Strg-Klick springt zur Überschrift.
       Ein Klick daneben (Leader/Seitenzahl) springt immer, wie gehabt. */
    const tocTitle=e.target.closest(".toc-t");
    if(tocTitle){
      if(e.ctrlKey||e.metaKey){e.preventDefault();jumpToHeading(tocTitle.closest("a").getAttribute("href"))}
      return;
    }
    const tocLink=e.target.closest(".toc a");
    if(tocLink){e.preventDefault();jumpToHeading(tocLink.getAttribute("href"));return}
  });
  ed.focus();
  placeCaretEnd(ed);
  if(S.marks)markTerms();
  markEmpty();setPrintPage();
  paginate();
  drawAnchors();
  drawOutline();
}
function placeCaretEnd(el){const r=document.createRange();r.selectNodeContents(el);r.collapse(false);
  const s=getSelection();s.removeAllRanges();s.addRange(r)}
function flush(){const ed=$("#editor");if(ed&&ed.dataset.docId===S.active){const d=doc();
  const c=ed.cloneNode(true);
  c.querySelectorAll("figure.fig").forEach(f=>f.classList.remove("sel"));
  c.querySelectorAll(".toc").forEach(t=>t.classList.remove("sel"));
  c.querySelectorAll(".fhwrap").forEach(w=>w.remove());
  c.querySelectorAll(".hit,.glossterm,.spellerr,.cleanerr").forEach(s=>{
    const p=s.parentNode;while(s.firstChild)p.insertBefore(s.firstChild,s);p.removeChild(s)});
  c.querySelectorAll(".cleanp").forEach(p=>p.classList.remove("cleanp","cur"));
  c.normalize();
  d.html=c.innerHTML;
  /* Titel aus dem bereinigten HTML, nicht aus dem lebenden Editor: dort steht
     auch das Löschkreuz der Anfasser mit drin und wurde sonst zum Titel. */
  if(!d.customTitle){const t=stripHtml(d.html).trim().split("\n")[0].slice(0,32);d.title=t||"Ohne Titel"}}}
/* Schriftgröße frei eingebbar, wie das Kombifeld in Word. Der Wert geht an
   --fs; ein direktes style.fontSize würde die Zoomberechnung überschreiben. */
const FS_MIN=4,FS_MAX=200;
function setFontSize(v){
  const roh=parseFloat(String(v).replace(",","."));
  if(!isFinite(roh))return drawTools();
  const n=Math.min(FS_MAX,Math.max(FS_MIN,Math.round(roh*2)/2));
  doc().size=n;
  const ed=$("#editor");
  if(ed)ed.style.setProperty("--fs",n+"pt");
  commit();drawTools();queuePaginate();
  return n;
}
function sizeMenu(e){
  closeMenu();
  const akt=doc().size||S.settings.size;
  const m=document.createElement("div");m.className="menu ctx";m.id="fsmenu";
  m.style.minWidth="86px";
  m.innerHTML=SIZES.map(x=>
    `<button class="mi" data-fs="${x}"><span class="chk">${x==akt?"✓":""}</span>${x}</button>`).join("");
  document.body.appendChild(m);

  m.style.left=Math.min(r.left,innerWidth-m.offsetWidth-8)+"px";
  m.style.top=Math.min(r.bottom+4,innerHeight-m.offsetHeight-8)+"px";
  m.onclick=ev=>{const b=ev.target.closest("[data-fs]");if(!b)return;
    closeMenu();setFontSize(b.dataset.fs);const ed=$("#editor");ed&&ed.focus()};
}
function cmd(c){document.execCommand(c,false,null);$("#editor")&&$("#editor").focus();dirty=true;drawStatus();syncToolbarState()}
/* Die Werkzeugleiste zeigte nie, was an der Schreibmarke gerade gilt - der
   Fett-Knopf blieb inaktiv, auch mitten in fettem Text, und "Absatzformat"
   stand immer auf Fließtext, selbst in einer Überschrift. Die CSS-Klasse
   .tb.on dafür gab es schon, nur setzte sie nie jemand. selectionchange
   feuert auch bei reiner Cursorbewegung (Pfeiltasten), execCommand-Klicks
   ändern die Selektion selbst oft nicht, darum ruft cmd() das hier zusätzlich
   direkt auf. */
const TOOLBAR_STATE_CMDS=["bold","italic","underline","strikeThrough",
  "justifyLeft","justifyCenter","justifyRight","justifyFull","insertUnorderedList","insertOrderedList"];
function syncToolbarState(){
  if(S.mode!=="write")return;
  const ed=$("#editor");if(!ed)return;
  const sel=getSelection();
  if(!sel.rangeCount||!ed.contains(sel.anchorNode))return;
  TOOLBAR_STATE_CMDS.forEach(c=>{
    const btn=document.querySelector(`.tools [data-cmd="${c}"]`);
    if(!btn)return;
    let aktiv=false;
    try{aktiv=document.queryCommandState(c)}catch(e){}
    btn.classList.toggle("on",aktiv);
  });
  const fb=$("#fBlock");
  if(fb){
    let n=sel.anchorNode;n=n.nodeType===1?n:n.parentElement;
    const block=n&&n.closest("h1,h2,h3,blockquote");
    fb.value=block?block.tagName.toLowerCase():"p";
  }
}
document.addEventListener("selectionchange",syncToolbarState);

/* ---- Schriftfarbe und Texthervorhebung ----
   Eine Hervorhebung setzt zusätzlich passende Schrift, sonst wäre helle
   Schrift auf hellem Pastell oder dunkle Schrift auf einem der dunklen
   Töne im vollen Raster unlesbar — dieselbe Regel, nach der auch die
   Notizzettel arbeiten. War früher immer MARKINK (dunkel), reicht aber
   nicht mehr, seit die Hervorhebung dasselbe 60-Farben-Raster wie die
   Schriftfarbe nutzt und damit auch dunkle Felder anbietet. Kontrast
   gegen Schwarz und gegen Weiß gemessen, nicht die Helligkeit geschätzt. */
function bestInk(hex){
  const rgb=hex.replace("#","").match(/.{2}/g).map(x=>parseInt(x,16));
  const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
  const L=0.2126*f(rgb[0])+0.7152*f(rgb[1])+0.0722*f(rgb[2]);
  const kontrast=l2=>{const [a,b]=L>l2?[L,l2]:[l2,L];return (a+0.05)/(b+0.05)};
  return kontrast(1)>kontrast(0)?"#FFFFFF":MARKINK;
}
function farbeAnwenden(art,c){
  const ed=$("#editor");if(!ed)return;
  ed.focus();
  document.execCommand("styleWithCSS",false,true);
  if(art==="fore")document.execCommand("foreColor",false,c);
  else{document.execCommand("hiliteColor",false,c);document.execCommand("foreColor",false,bestInk(c))}
  if(art==="fore")S.settings.foreColor=c; else S.settings.markColor=c;
  dirty=true;commit();drawTools();queuePaginate();
}
/* Farbe entfernen: eine Kennfarbe setzen, danach genau die Elemente
   aufräumen, die sie tragen. Ohne den Umweg gäbe es keinen verlässlichen
   Weg, execCommand eine gesetzte Farbe wieder wegnehmen zu lassen. */
function farbeEntfernen(art){
  const ed=$("#editor");if(!ed)return;
  ed.focus();
  document.execCommand("styleWithCSS",false,true);
  const kenn="#010203";
  document.execCommand(art==="fore"?"foreColor":"hiliteColor",false,kenn);
  if(art!=="fore")document.execCommand("foreColor",false,kenn);
  const treffer=/rgb\(1,\s*2,\s*3\)|#010203/i;
  ed.querySelectorAll("[style]").forEach(el=>{
    let ran=false;
    ["color","backgroundColor"].forEach(p=>{
      if(el.style[p]&&treffer.test(el.style[p])){el.style[p]="";ran=true}
    });
    if(!ran)return;
    if(!el.getAttribute("style"))el.removeAttribute("style");
    if(el.tagName==="SPAN"&&!el.attributes.length){
      while(el.firstChild)el.parentNode.insertBefore(el.firstChild,el);
      el.remove();
    }
  });
  ed.normalize();
  dirty=true;commit();queuePaginate();
}
function colorMenu(e,art){
  closeMenu();
  const aktuell=art==="fore"?(S.settings.foreColor||TEXTCOLORS[0].c):(S.settings.markColor||MARKCOLORS[0].c);
  const swatchHtml=x=>`<button class="csw" data-col="${x.c}" title="${esc(x.n)}" aria-label="${esc(x.n)}"
        style="background:${x.c}${x.c.toLowerCase()===String(aktuell).toLowerCase()?";box-shadow:0 0 0 2px var(--stamp)":""}"></button>`;
  const grid=`<div class="swatches grid">${TEXTGRID.map(row=>row.map(c=>swatchHtml({c,n:c})).join("")).join("")}</div>`;
  const m=document.createElement("div");m.className="menu ctx";m.id="colmenu";
  m.innerHTML=`<div class="mlabel">${art==="fore"?tr("Schriftfarbe"):tr("Texthervorhebung")}</div>
    ${grid}
    <label class="mi" id="colOwn">${tr("Eigene Farbe")}&hellip;
      <input type="color" id="colPick" value="${aktuell}"></label>
    <div class="msep"></div>

/* ---- Einrücken / Ausrücken ---- */
const IND_STEP=2,IND_MAX=12; /* em, also skaliert mit Schriftgröße und Zoom */
function curListItem(){
  const s=getSelection();if(!s.rangeCount)return null;
  let n=s.getRangeAt(0).startContainer;
  n=n.nodeType===1?n:n.parentElement;
  const ed=$("#editor");
  return (n&&ed&&ed.contains(n))?n.closest("li"):null;
}
function selectedBlocks(){
  const ed=$("#editor");if(!ed)return[];
  const s=getSelection();if(!s.rangeCount)return[];
  const r=s.getRangeAt(0);
  const out=[...ed.children].filter(b=>{try{return r.intersectsNode(b)}catch(e){return false}});
  if(out.length)return out;
  const b=curBlock();return b?[b]:[];
}
function indentBlocks(dir){
  const ed=$("#editor");
  if(S.mode!=="write"||!ed){toast(tr("Nur im Schreibmodus"));return}
  ed.focus();
  /* In Listen macht die native Verschachtelung mehr Sinn als ein Rand */
  if(curListItem()){
    document.execCommand(dir>0?"indent":"outdent");
    flush();dirty=true;commit();queuePaginate();drawStatus();return;
  }
  const blocks=selectedBlocks();
  if(!blocks.length)return;
  blocks.forEach(b=>{
    if(b.classList&&b.classList.contains("pgbreak"))return;
    const cur=parseFloat(b.style.marginLeft)||0;
    const next=Math.min(IND_MAX,Math.max(0,cur+dir*IND_STEP));
    b.style.marginLeft=next>0?next+"em":"";
  });
  flush();dirty=true;commit();queuePaginate();drawAnchors();drawStatus();
}

/* Glossarbegriffe markieren */
function markTerms(){
  const ed=$("#editor");if(!ed)return;
  unmark();
  const entries=S.glossary.filter(g=>g.gid===doc().glossaryId);
  const terms=entries.map(g=>g.term).filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!terms.length)return;
  const rx=new RegExp("\\b("+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
  const walk=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);
  const jobs=[];let n;
  while(n=walk.nextNode()){if(n.parentElement.classList.contains("glossterm"))continue;
    if(rx.test(n.nodeValue)){rx.lastIndex=0;jobs.push(n)}}
  jobs.forEach(node=>{
    const frag=document.createDocumentFragment();let last=0,m;rx.lastIndex=0;
    while(m=rx.exec(node.nodeValue)){
      frag.appendChild(document.createTextNode(node.nodeValue.slice(last,m.index)));
      const g=entries.find(x=>x.term.toLowerCase()===m[0].toLowerCase());
      const sp=document.createElement("span");sp.className="glossterm";sp.textContent=m[0];
      sp.title=g?g.def:"";frag.appendChild(sp);last=m.index+m[0].length}
    frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
    node.parentNode.replaceChild(frag,node)});
}
function unmark(){const ed=$("#editor");if(!ed)return;
  ed.querySelectorAll(".glossterm").forEach(s=>s.replaceWith(document.createTextNode(s.textContent)));ed.normalize()}

function noteText(n){const t=document.createElement("div");t.innerHTML=noteBody(n);return (n.title?n.title+" ":"")+(t.innerText||"")}
/* Inneres Markup einer Notizkarte — identisch für Raster- und Listenansicht,
   nur die Hülle (absolut positioniert vs. Zeile im Fluss) unterscheidet sich. */
function noteCardInner(n){

        <div class="grip"></div>

            anchorCount(n.id)+" Stelle"+(anchorCount(n.id)>1?"n":"")+" im Text",

            anchorCount(n.id)+(anchorCount(n.id)>1?" passages dans le texte":" passage dans le texte"),
            anchorCount(n.id)+(anchorCount(n.id)>1?" lugares en el texto":" lugar en el texto"),
            anchorCount(n.id)+(anchorCount(n.id)>1?" trechos no texto":" trecho no texto"))}</div>`:""}
        ${n._here?`<div class="src">${n._here}&times; ${tr("hier")}</div>`:""}
        ${n.title?`<div class="ntitle">${esc(n.title)}</div>`:""}

        <button class="del" data-del="${n.id}" title="${tr("Löschen")}">&times;</button>`;
}
function drawNotes(){
  const list=
    S.notes.map(n=>({...n,_here:anchorsInDoc(n.id)}));
  const q=(window._nq||"").toLowerCase();
  const vis=list.filter(n=>(!q||noteText(n).toLowerCase().includes(q))
    &&(S.noteFilter==="all"
      ||(S.noteFilter==="doc"&&n._here>0)
      ||(S.noteFilter==="free"&&!anchorCount(n.id))));
  const leer=`<div class="empty">${tr("Noch keine Notizen.<br>Neue Notiz anlegen mit <b>Alt+Umschalt+N</b> — das geht auch mitten im Schreiben, ohne die Ansicht zu wechseln.<br>Ein Klick öffnet eine Notiz zum Bearbeiten, Ziehen verschiebt sie.")}</div>`;
  if(S.noteView==="list"){
    $("#pane").innerHTML=`<div class="notecanvas list" id="canvas">${
      vis.length?vis.map(n=>`
        <div class="note nrow ${n.id===openNoteId?"sel":""}" data-id="${n.id}"
          style="background:${n.color||NOTECOLORS[0].c};--nc:${n.color||NOTECOLORS[0].c}">${noteCardInner(n)}</div>`).join("")
      :leer
    }</div>`;
  } else {
    $("#pane").innerHTML=`<div class="notecanvas" id="canvas" style="min-height:${Math.max(420,...vis.map(n=>n.y+NH+NPAD*2))}px">${
      vis.length?vis.map(n=>`
        <div class="note ${n.id===openNoteId?"sel":""}" data-id="${n.id}"
          style="left:${n.x}px;top:${n.y}px;background:${n.color||NOTECOLORS[0].c};--nc:${n.color||NOTECOLORS[0].c}">${noteCardInner(n)}</div>`).join("")
      :leer
    }</div>`;
  }
  enableDrag();
}
function findNote(id){return S.notes.find(x=>x.id===id)||null}
function anchorsInDoc(id,d){const t=document.createElement("div");t.innerHTML=(d||doc()).html||"";
  return t.querySelectorAll('.anch[data-n="'+id+'"]').length}
/* Platz für eine neue Notiz: das erste freie Rasterfeld von oben links.
   Vorher wurde nach Array-Index gerechnet, wodurch die zwanzigste Notiz
   zwangsläufig ganz unten landete — auch wenn oben längst alles frei war,
   weil Notizen verschoben oder gelöscht wurden. */
const NW=224,NH=224,NGAP=12,NPAD=16;
function freierNotizPlatz(){
  const canvas=$("#canvas");
  const breite=(canvas?canvas.clientWidth:0)||($("#pane")?$("#pane").clientWidth:0)||760;
  const spalten=Math.max(1,Math.floor((breite-NPAD)/(NW+NGAP)));
  const belegt=S.notes.map(n=>({x:n.x||0,y:n.y||0}));
  const frei=(x,y)=>!belegt.some(b=>Math.abs(b.x-x)<NW+NGAP*0.5&&Math.abs(b.y-y)<NH+NGAP*0.5);
  for(let reihe=0;reihe<400;reihe++)
    for(let sp=0;sp<spalten;sp++){
      const x=NPAD+sp*(NW+NGAP),y=NPAD+reihe*(NH+NGAP);
      if(frei(x,y))return{x,y};
    }
  return{x:NPAD,y:NPAD};
}
function addNote(text,open){
  const pos=freierNotizPlatz();
  const n={id:uid(),title:"",html:text?"<p>"+esc(text).replace(/\n/g,"<br>")+"</p>":"",
    color:NOTECOLORS[0].c,fs:14,x:pos.x,y:pos.y,created:Date.now()};
  S.notes.push(n);dirty=true;commit();
  if(open){setMode("notes");openNote(n.id,"titel")}
  return n;
}
/* Zwei Notizen tauschen den Platz: in der Rasteransicht die Koordinaten,
   in der Liste die Reihenfolge im Array (das ist dort die Anzeigereihenfolge). */
function swapNotes(idA,idB){
  if(S.noteView==="list"){
    const ia=S.notes.findIndex(x=>x.id===idA),ib=S.notes.findIndex(x=>x.id===idB);
    if(ia<0||ib<0)return;
    [S.notes[ia],S.notes[ib]]=[S.notes[ib],S.notes[ia]];
  } else {
    const a=findNote(idA),b=findNote(idB);
    if(!a||!b)return;
    const tx=a.x,ty=a.y;a.x=b.x;a.y=b.y;b.x=tx;b.y=ty;
  }
  dirty=true;commit();
}
function enableDrag(){
  const pane=$("#pane"),canvas=$("#canvas");
  if(!canvas)return;
  let cur=null,ziel=null,gx=0,gy=0,sx=0,sy=0,moved=false,lauf=null,letzteX=0,letzteY=0;
  const stopp=()=>{if(lauf){cancelAnimationFrame(lauf);lauf=null}};
  /* Position aus der Zeigerlage im Blatt, nicht aus einem Startversatz —
     so bleibt die Notiz am Zeiger, auch wenn die Fläche mitscrollt. In der
     Listenansicht gibt es kein x/y, dort hebt sich die Zeile per Transform. */
  const bewegen=()=>{
    if(!cur)return;
    if(S.noteView==="list"){
      cur.style.transform=`translateY(${letzteY-sy}px)`;
    } else {
      const cr=canvas.getBoundingClientRect();
      const maxX=Math.max(0,canvas.clientWidth-NW);
      cur.style.left=Math.min(maxX,Math.max(0,letzteX-cr.left-gx))+"px";
      cur.style.top=Math.max(0,letzteY-cr.top-gy)+"px";
    }
    /* Ablageziel ermitteln: welche andere Notiz liegt gerade unter dem Zeiger?
       .drag hat pointer-events:none, daher trifft elementFromPoint die
       darunterliegende Karte, nicht die gezogene selbst. */
    const unter=document.elementFromPoint(letzteX,letzteY);
    const treffer=unter&&unter.closest?unter.closest(".note"):null;
    const neuesZiel=(treffer&&treffer!==cur)?treffer:null;
    if(neuesZiel!==ziel){
      if(ziel)ziel.classList.remove("drop-target");
      ziel=neuesZiel;
      if(ziel)ziel.classList.add("drop-target");
    }
  };
  canvas.querySelectorAll(".note").forEach(el=>{
    el.onmousedown=e=>{
      if(e.target.closest("button"))return;
      const r=el.getBoundingClientRect();
      cur=el;gx=e.clientX-r.left;gy=e.clientY-r.top;
      sx=e.clientX;sy=e.clientY;moved=false;e.preventDefault()};
  });
  document.onmousemove=e=>{
    if(!cur)return;
    if(!moved&&Math.abs(e.clientX-sx)<=4&&Math.abs(e.clientY-sy)<=4)return;
    if(!moved){moved=true;cur.classList.add("drag")}
    letzteX=e.clientX;letzteY=e.clientY;
    bewegen();
    /* Am oberen und unteren Rand mitscrollen, sonst endet das Ziehen am Fensterrand */
    const pr=pane.getBoundingClientRect();
    const oben=letzteY-pr.top,unten=pr.bottom-letzteY;
    stopp();
    const schritt=oben<44?-Math.min(20,(44-oben)/2):unten<44?Math.min(20,(44-unten)/2):0;
    if(schritt){
      const tick=()=>{pane.scrollTop+=schritt;bewegen();lauf=requestAnimationFrame(tick)};
      lauf=requestAnimationFrame(tick);
    }
  };
  document.onmouseup=()=>{
    if(!cur)return;
    stopp();
    cur.classList.remove("drag");
    cur.style.transform="";
    if(ziel)ziel.classList.remove("drop-target");
    const el=cur,zielEl=ziel;cur=null;ziel=null;
    if(!moved){
      const n=findNote(el.dataset.id);
      openNote(el.dataset.id,(n&&!n.title)?"titel":undefined);
      return;
    }
    if(zielEl){
      swapNotes(el.dataset.id,zielEl.dataset.id);
    } else if(S.noteView!=="list"){
      const n=findNote(el.dataset.id);
      if(n){n.x=parseInt(el.style.left)||0;n.y=parseInt(el.style.top)||0;dirty=true;commit()}
    }
    /* Neu zeichnen, damit die Fläche mitwächst — sonst bleibt eine weit unten
       abgelegte Notiz außerhalb des scrollbaren Bereichs. */
    drawNotes();
  };
}

/* ================= Glossar ================= */
/* Getrennte Glossare: jedes Dokument gehört zu genau einer Sammlung */
function ensureGlossaries(){
  if(!S.glossary)S.glossary=[];
  if(!S.glossaries||!S.glossaries.length){
    const gid=uid();
    S.glossaries=[{id:gid,name:"Glossar"}];
    S.glossary.forEach(g=>{if(!g.gid)g.gid=gid});
  }
  const known=new Set(S.glossaries.map(c=>c.id));
  S.glossary.forEach(g=>{if(!g.gid||!known.has(g.gid))g.gid=S.glossaries[0].id});
  /* null heißt „bewusst ohne Zuordnung“ und bleibt stehen; fehlend oder
     verwaist bekommt die erste Sammlung. */
  S.docs.forEach(d=>{
    if(d.glossaryId===null)return;
    if(!d.glossaryId||!known.has(d.glossaryId))d.glossaryId=S.glossaries[0].id;
  });
}
/* Welche Sammlung gerade angesehen wird. Bewusst getrennt von der Zuordnung
   des Dokuments: Reiter wechseln zeigt nur an, es bindet nichts um. Nicht
   gespeichert — beim Dokumentwechsel fällt die Ansicht auf dessen Glossar. */
let gView=null,gViewFor=null;
function curGView(){
  const d=doc();
  if(gViewFor!==d.id||!gView||!S.glossaries.some(c=>c.id===gView)){
    /* Ein Dokument ohne Zuordnung zeigt trotzdem etwas an — dann die erste Sammlung */
    gView=(d.glossaryId&&S.glossaries.some(c=>c.id===d.glossaryId))?d.glossaryId:S.glossaries[0].id;
    gViewFor=d.id;
  }
  return gView;
}
function setGView(id){gView=id;gViewFor=doc().id}
/* Zwei gleichnamige Reiter sind nicht auseinanderzuhalten, darum durchnummerieren */
function freierCollName(basis){
  const belegt=new Set(S.glossaries.map(c=>tr(c.name).trim().toLowerCase()));
  if(!belegt.has(basis.trim().toLowerCase()))return basis;
  for(let i=2;;i++){const k=basis+" "+i;if(!belegt.has(k.toLowerCase()))return k}
}
function newGlossColl(){
  const id=uid();
  S.glossaries.push({id,name:freierCollName(tr("Ohne Titel"))});
  setGView(id);
  commit();render();
  renameGlossColl(id);
}
function renameGlossColl(id){
  const c=S.glossaries.find(x=>x.id===id);if(!c)return;
  /* Die angesehene Sammlung im Kopf umbenennen — dort steht der Name groß und
     ist auch dann da, wenn die Reiterleiste (bei nur einem Glossar) fehlt. */
  const imKopf=id===curGView();
  const el=imKopf?document.querySelector(".ghead h2"):document.querySelector(`.gcoll[data-gc="${id}"]`);
  if(!el)return;
  const input=document.createElement("input");
  input.value=c.name||"";input.maxLength=40;
  input.style.cssText=imKopf
    ?"width:min(100%,340px);border:1px solid var(--rule);background:var(--paper);font:inherit;font-family:Georgia,serif;font-size:20px;font-weight:600;color:var(--ink);outline:none;border-radius:var(--radius);padding:1px 6px"
    :"width:100px;border:none;background:rgba(255,255,255,.6);font:inherit;color:inherit;outline:none;border-radius:2px;padding:0 2px";
  el.replaceWith(input);input.focus();input.select();
  let done=false;
  const finish=()=>{
    if(done)return;done=true;
    const v=input.value.trim().slice(0,40);
    /* Beim Umbenennen ebenfalls entdoppeln — sonst stehen zwei gleiche Reiter da */
    const andere=S.glossaries.filter(x=>x.id!==id).map(x=>tr(x.name).trim().toLowerCase());
    let neu=v||tr("Ohne Titel");
    if(andere.includes(neu.toLowerCase())){
      for(let i=2;;i++){const k=neu+" "+i;if(!andere.includes(k.toLowerCase())){neu=k;break}}
    }
    c.name=neu;
    save();render();
  };
  input.addEventListener("blur",finish);
  input.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"){ev.preventDefault();input.blur()}
    if(ev.key==="Escape"){ev.preventDefault();done=true;render()}
  });
}
function collContextMenu(e,id){
  closeMenu();
  const c=S.glossaries.find(x=>x.id===id);if(!c)return;
  const m=document.createElement("div");m.className="menu ctx";m.id="collmenu";
  m.innerHTML=`
    <button class="mi" data-ca="rename"><span class="chk"></span>${tr("Umbenennen")}&hellip;</button>
    <button class="mi" data-ca="io"><span class="chk"></span>${tr("Importieren / Exportieren")}&hellip;</button>

/* ================= Statuszeile ================= */
/* Schreibziel: vier wählbare Zähleinheiten, alle aus einem countStats()-Durchlauf.
   "pages" sind Normseiten (1500 Zeichen inkl. Leerzeichen = 1 Seite) - die für
   Buchautoren übliche, motivierende Größe statt reiner Wortzahl. */
const GOAL_UNITS=[
  {k:"words",label:"Wörter"},
  {k:"charsSp",label:"Zeichen (mit Leerzeichen)"},
  {k:"charsNoSp",label:"Zeichen (ohne Leerzeichen)"},
  {k:"pages",label:"Normseiten (1500 Z.)"}
];
function goalMetric(txt,unit){
  const d=countStats(txt);
  if(unit==="charsSp")return d.chars;
  if(unit==="charsNoSp")return d.charsNoSp;
  if(unit==="pages")return d.chars/1500;
  return d.words;
}
function goalUnitAbbr(unit){
  const T=PL({charsSp:"Z",charsNoSp:"Z⁻",pages:"NS",words:"W"},
             {charsSp:"ch",charsNoSp:"ch⁻",pages:"ms",words:"w"},
             {charsSp:"car",charsNoSp:"car⁻",pages:"ms",words:"m"},
             {charsSp:"car",charsNoSp:"car⁻",pages:"ms",words:"p"},
             {charsSp:"car",charsNoSp:"car⁻",pages:"ms",words:"p"});
  if(unit==="charsSp")return T.charsSp;
  if(unit==="charsNoSp")return T.charsNoSp;
  if(unit==="pages")return T.pages;
  return T.words;
}
function goalFmtNum(v,unit){
  if(unit==="pages"){const s=v.toFixed(1);return S.settings.uiLang==="en"?s:s.replace(".",",")}
  return Math.round(v).toLocaleString(LOC());
}
function goalHtml(txt){
  const g=S.goal;
  if(!g||!g.on)return "";
  const unit=g.unit||"words";
  const geschafft=Math.max(0,goalTotal(goalMetric(txt,unit))-(g.base||0));
  const anteil=Math.min(100,Math.round(geschafft/g.target*100));
  const done=geschafft>=g.target;
  const phase=anteil<=20?1:anteil<=40?2:anteil<=60?3:anteil<=80?4:5;
  return `<span class="goal" id="goalBox" title="${tr("Schreibziel einstellen")}">
    ${goalFmtNum(geschafft,unit)} / ${goalFmtNum(g.target,unit)} ${goalUnitAbbr(unit)}${done?
      '<svg class="goalcheck" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>':""}
    <span class="goalbar phase${phase} ${done?"done":""}"><i style="width:${anteil}%"></i></span></span>`;
}

/* innerText liefert bei einem nicht angezeigten Element keine Zeilenumbrüche,
   dadurch liefen Absätze zusammen — Wortzählung und TXT-Export inbegriffen. */
const stripHtml=h=>{
  const t=document.createElement("div");t.innerHTML=h||"";
  t.querySelectorAll("br").forEach(b=>b.replaceWith("\n"));
  t.querySelectorAll("p,div,li,tr,h1,h2,h3,h4,h5,h6,figcaption,blockquote")
    .forEach(el=>el.appendChild(document.createTextNode("\n")));
  return t.textContent||"";
};

/* Metrik der übrigen Dokumente (in der aktuell gewählten Zähleinheit) wird
   zwischengespeichert, damit die Statuszeile nicht bei jedem Tastendruck
   alle Dokumente neu auszählen muss. */
let goalOthers=0;
function recalcGoalOthers(){
  const unit=(S.goal&&S.goal.unit)||"words";
  goalOthers=S.docs.reduce((s,d)=>s+(d.id===S.active?0:goalMetric(stripHtml(d.html),unit)),0);
}
function goalTotal(m){return goalOthers+m}
function setGoal(on,target,unit){
  S.goal=S.goal||{on:false,target:1000,base:0,unit:"words"};
  /* Ein Wechsel der Einheit macht den alten Wortstand als Basis unbrauchbar -
     bei laufendem Ziel wird darum in der neuen Einheit neu geeicht. */
  if(unit!==undefined&&unit!==S.goal.unit){
    S.goal.unit=unit;
    if(S.goal.on)goalReset();
  }
  if(target!==undefined){
    S.goal.target=S.goal.unit==="pages"
      ?Math.max(.5,Math.round(target*2)/2)
      :Math.max(1,Math.round(target));
  }
  if(on!==undefined&&on!==S.goal.on){
    S.goal.on=on;
    if(on)goalReset();
  }
  save();drawStatus();
}

  flush();recalcGoalOthers();
  const unit=(S.goal&&S.goal.unit)||"words";
  S.goal.base=goalTotal(goalMetric(stripHtml(doc().html),unit));
  save();drawStatus();
}

function exportTxt(){

  /* Blöcke durch Leerzeilen trennen, Zeilenumbrüche innerhalb eines Absatzes behalten —
     nur so kommt der Text beim Wiedereinlesen als Absätze zurück. */
  const t=document.createElement("div");t.innerHTML=d.html||"";

/* ---- Glossar importieren ----
   Fremde Tabellen kommen mit Semikolon, Komma oder Tabulator; das Trennzeichen
   wird aus der Kopfzeile geraten. Anführungszeichen nach RFC 4180. */
function parseCsv(text){
  text=text.replace(/^\uFEFF/,"");
  const erste=text.split(/\r?\n/)[0]||"";
  const ausserhalb=(zeile,z)=>{let n=0,q=false;
    for(let i=0;i<zeile.length;i++){const ch=zeile[i];
      if(ch==='"')q=!q;else if(ch===z&&!q)n++}
    return n};
  const sep=[";","\t",","].map(z=>[z,ausserhalb(erste,z)]).sort((a,b)=>b[1]-a[1])[0][0];
  const zeilen=[];let feld="",zeile=[],inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){if(text[i+1]==='"'){feld+='"';i++}else inQ=false}
      else feld+=ch;
    }else if(ch==='"')inQ=true;
    else if(ch===sep){zeile.push(feld);feld=""}
    else if(ch==="\n"){zeile.push(feld);zeilen.push(zeile);zeile=[];feld=""}
    else if(ch!=="\r")feld+=ch;
  }
  if(feld||zeile.length){zeile.push(feld);zeilen.push(zeile)}
  return zeilen.filter(r=>r.some(c=>c.trim()));
}
function begriffeAusDatei(name,raw){
  const ext=(String(name).match(/\.([a-z0-9]+)$/i)||[,""])[1].toLowerCase();
  if(ext==="json"){
    let b;try{b=JSON.parse(raw)}catch(e){return null}
    const arr=Array.isArray(b)?b:(b&&b.glossary)||[];
    return arr.filter(g=>g&&g.term).map(g=>({term:String(g.term),def:String(g.def||""),cat:String(g.cat||"")}));
  }
  const rows=parseCsv(raw);
  if(!rows.length)return [];
  /* Kopfzeile weglassen, wenn die erste Zelle wie eine Überschrift aussieht */
  const kopf=["begriff","term","wort","stichwort","name","eintrag","entry"];
  if(rows[0][0]&&kopf.includes(rows[0][0].trim().toLowerCase()))rows.shift();
  return rows.filter(r=>r[0]&&r[0].trim())
    .map(r=>({term:r[0].trim().slice(0,120),def:(r[1]||"").trim(),cat:(r[2]||"").trim()}));
}

function importGloss(dateiname,liste,ziel){

      name:String(dateiname).replace(/\.[^.]+$/,"").slice(0,40)||tr("Neues Glossar")});

function fuzzy(q,s){
  s=s.toLowerCase();q=q.toLowerCase();
  if(!q)return 0;
  const i=s.indexOf(q);if(i>=0)return 100-i;
  let p=0;for(const ch of q){p=s.indexOf(ch,p);if(p<0)return -1;p++}
  return 10;
}

function exportMd(){
  flush();const d=doc();const t=document.createElement("div");t.innerHTML=d.html||"";
  let out="";
  t.childNodes.forEach(n=>{
    if(n.nodeType===3){out+=n.textContent+"\n\n";return}
    if(n.nodeType===1&&n.classList&&n.classList.contains("toc"))return;
    const tag=(n.tagName||"").toLowerCase(),tx=(n.innerText||"").trim();
    if(!tx&&tag!=="br")return;
    if(tag==="h1")out+="# "+tx+"\n\n";
    else if(tag==="h2")out+="## "+tx+"\n\n";
    else if(tag==="h3")out+="### "+tx+"\n\n";
    else if(tag==="ul")n.querySelectorAll("li").forEach(li=>out+="- "+li.innerText.trim()+"\n"),out+="\n";
    else if(tag==="ol"){let i=1;n.querySelectorAll("li").forEach(li=>out+=(i++)+". "+li.innerText.trim()+"\n");out+="\n"}
    else out+=tx+"\n\n"});
  const fnOrder=footnoteOrderFromHtml(d.html);
  if(fnOrder.length){
    out+="---\n\n";
    fnOrder.forEach((id,i)=>{const f=(d.footnotes||[]).find(x=>x.id===id);out+="["+(i+1)+"] "+((f&&f.text)||"")+"\n"});
  }
  download(d.title+".md",out.trim()+"\n","text/markdown");
}
/* ================= DOCX-Export ================= */
/* Echtes OOXML statt des alten HTML-in-.doc-Tricks, den Word zwar öffnet,
   aber inzwischen mit einer Kompatibilitätswarnung quittiert, weil die Datei
   strukturell kein Word-Dokument ist. Ein .docx ist im Kern nur ein ZIP mit
   XML-Teilen darin - für die Kompression reicht CompressionStream, das
   Gegenstück zu dem DecompressionStream, den zipEintrag() beim Import schon
   zum Entpacken von .docx/.odt nutzt. */
const mmToTwip=mm=>Math.round(mm*56.6929133858);
const mmToEmu=mm=>Math.round(mm*36000);
const CRC32_TABLE=(()=>{
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}
  return t;
})();
function crc32(bytes){
  let c=0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++)c=CRC32_TABLE[(c^bytes[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
async function deflateRaw(bytes){
  const strom=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(strom).arrayBuffer());
}
/* Nur was ein docx braucht: Deflate, keine Verzeichniseinträge, kein ZIP64 -
   die Dateien hier bleiben weit unter dessen Grenzen. */
async function zipSchreiben(eintraege){
  const enc=new TextEncoder();
  const lokal=[],zentral=[];let versatz=0;
  for(const e of eintraege){
    const nameBytes=enc.encode(e.name);
    const komprimiert=await deflateRaw(e.bytes);
    const crc=crc32(e.bytes);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0,true);
    lh.setUint16(8,8,true);lh.setUint16(10,0,true);lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,komprimiert.length,true);lh.setUint32(22,e.bytes.length,true);
    lh.setUint16(26,nameBytes.length,true);lh.setUint16(28,0,true);
    lokal.push(new Uint8Array(lh.buffer),nameBytes,komprimiert);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint16(8,0,true);ch.setUint16(10,8,true);ch.setUint16(12,0,true);ch.setUint16(14,0,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,komprimiert.length,true);ch.setUint32(24,e.bytes.length,true);
    ch.setUint16(28,nameBytes.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
    ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,versatz,true);
    zentral.push(new Uint8Array(ch.buffer),nameBytes);
    versatz+=lh.byteLength+nameBytes.length+komprimiert.length;
  }
  const zentralStart=versatz;
  const zentralGroesse=zentral.reduce((s,p)=>s+p.length,0);
  const eocd=new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true);eocd.setUint16(4,0,true);eocd.setUint16(6,0,true);
  eocd.setUint16(8,eintraege.length,true);eocd.setUint16(10,eintraege.length,true);
  eocd.setUint32(12,zentralGroesse,true);eocd.setUint32(16,zentralStart,true);eocd.setUint16(20,0,true);
  return new Blob([...lokal,...zentral,new Uint8Array(eocd.buffer)]);
}

function numberingXml(){
  const stufe=(fmt,text)=>[0,1,2,3].map(i=>
    `<w:lvl w:ilvl="${i}"><w:start w:val="1"/><w:numFmt w:val="${fmt}"/><w:lvlText w:val="${text(i)}"/>`+
    `<w:pPr><w:ind w:left="${(i+1)*360}" w:hanging="360"/></w:pPr></w:lvl>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:abstractNum w:abstractNumId="0">${stufe("bullet",()=>"•")}</w:abstractNum>
<w:abstractNum w:abstractNumId="1">${stufe("decimal",i=>"%"+(i+1)+".")}</w:abstractNum>
<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>
<w:num w:numId="2"><w:abstractNumId w:val="1"/></w:num>
</w:numbering>`;
}
function stylesXml(d){
  const fs=Math.round((d.size||S.settings.size)*2),lh=Math.round(lhOf(d)*240);
  const after=Math.round(psOf(d)*(d.size||S.settings.size)*20);
  const ueberschrift=(n,sz)=>`<w:style w:type="paragraph" w:styleId="Heading${n}"><w:name w:val="heading ${n}"/>
    <w:basedOn w:val="Normal"/><w:next w:val="Normal"/>
    <w:pPr><w:spacing w:before="240" w:after="80"/><w:outlineLvl w:val="${n-1}"/></w:pPr>
    <w:rPr><w:b/><w:sz w:val="${sz}"/></w:rPr></w:style>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr>
  <w:rFonts w:ascii="${d.font||S.settings.font}" w:hAnsi="${d.font||S.settings.font}"/>
  <w:sz w:val="${fs}"/></w:rPr></w:rPrDefault>
  <w:pPrDefault><w:pPr><w:spacing w:line="${lh}" w:lineRule="auto" w:after="${after}"/></w:pPr></w:pPrDefault>
</w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>
${ueberschrift(1,36)}${ueberschrift(2,30)}${ueberschrift(3,26)}
<w:style w:type="character" w:styleId="Hyperlink"><w:name w:val="Hyperlink"/>
  <w:rPr><w:color w:val="0563C1"/><w:u w:val="single"/></w:rPr></w:style>
<w:style w:type="character" w:styleId="FootnoteReference"><w:name w:val="footnote reference"/>
  <w:rPr><w:vertAlign w:val="superscript"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="FootnoteText"><w:name w:val="footnote text"/><w:basedOn w:val="Normal"/>
  <w:rPr><w:sz w:val="20"/></w:rPr></w:style>
</w:styles>`;
}
/* Zwei Pflicht-Einträge (Trennlinie/Fortsetzungstrennlinie mit den festen
   IDs -1/0) gehen jedem echten Eintrag voraus - ohne sie öffnet Word die
   Datei zwar noch, meldet aber eine Reparatur beim Öffnen. */
function footnotesXml(list){
  const body=list.map(f=>`<w:footnote w:id="${f.id}"><w:p><w:pPr><w:pStyle w:val="FootnoteText"/></w:pPr>
    <w:r><w:rPr><w:rStyle w:val="FootnoteReference"/></w:rPr><w:footnoteRef/></w:r>
    <w:r><w:t xml:space="preserve"> ${xesc(f.text||"")}</w:t></w:r></w:p></w:footnote>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:footnotes xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:footnote w:type="separator" w:id="-1"><w:p><w:r><w:separator/></w:r></w:p></w:footnote>
<w:footnote w:type="continuationSeparator" w:id="0"><w:p><w:r><w:continuationSeparator/></w:r></w:p></w:footnote>
${body}
</w:footnotes>`;
}

/* -- HTML-Baum ablaufen und in OOXML-Absätze verwandeln -- */
/* Der Editor verschachtelt eine per execCommand erzeugte Liste manchmal in
   ein <p> statt sie als eigenen Block zu erzeugen (Browser-Eigenheit, kein
   Bug hier) - vor dem Ablaufen einmal geradeziehen, statt das an jeder
   Stelle im Baum gesondert abfangen zu müssen. */
function docxEinebnen(root){
  root.querySelectorAll("p > ul, p > ol, p > table, p > figure").forEach(kind=>{
    const p=kind.parentElement;p.parentNode.insertBefore(kind,p);
    if(!p.textContent.trim()&&!p.querySelector("img"))p.remove();
  });
}
function rPrXml(st){
  let x="";
  if(st.b)x+="<w:b/>";
  if(st.i)x+="<w:i/>";
  if(st.u)x+='<w:u w:val="single"/>';
  if(st.strike)x+="<w:strike/>";
  if(st.color)x+=`<w:color w:val="${st.color}"/>`;
  if(st.hi)x+=`<w:shd w:val="clear" w:color="auto" w:fill="${st.hi}"/>`;
  if(st.vert)x+=`<w:vertAlign w:val="${st.vert}"/>`;
  if(st.link)x+='<w:rStyle w:val="Hyperlink"/>';
  return x?`<w:rPr>${x}</w:rPr>`:"";
}
function runeXml(text,st){
  if(!text)return"";
  const raum=/^\s|\s$/.test(text)?' xml:space="preserve"':"";
  return `<w:r>${rPrXml(st)}<w:t${raum}>${xesc(text)}</w:t></w:r>`;
}
const HEX3=n=>n.toString(16).padStart(2,"0");
function farbHex(css){
  const m=css.match(/rgba?\(([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/);
  if(m)return(HEX3(+m[1])+HEX3(+m[2])+HEX3(+m[3])).toUpperCase();
  if(/^#/.test(css))return css.slice(1).toUpperCase();
  return null;
}
/* Läuft Inline-Inhalt eines Blocks ab und sammelt Läufe (Runs) auf - <br>
   wird zum weichen Zeilenumbruch INNERHALB desselben Absatzes, nicht zu
   einem neuen, weil das der optischen Wirkung im Editor entspricht. */
function inlineAblaufen(node,st,runs,links,ctx){
  node.childNodes.forEach(n=>{
    if(n.nodeType===3){runs.push(runeXml(n.nodeValue,st));return}
    if(n.nodeType!==1)return;
    const tag=n.tagName.toLowerCase();
    /* Eine echte Fußnote statt der generischen sup-Behandlung weiter unten -
       Word verwaltet Nummerierung und Seitenzuordnung dann selbst. */
    if(tag==="sup"&&n.classList.contains("fn")&&ctx&&ctx.footnotes){
      const fid=ctx.footnoteId++;
      ctx.footnotes.push({id:fid,text:(ctx.footnoteLookup&&ctx.footnoteLookup.get(n.dataset.fn))||""});
      runs.push(`<w:r><w:rPr><w:rStyle w:val="FootnoteReference"/></w:rPr><w:footnoteReference w:id="${fid}"/></w:r>`);
      return;
    }
    if(tag==="br"){runs.push("<w:r><w:br/></w:r>");return}
    if(["img","figure"].includes(tag))return;   /* Bilder laufen als eigener Block, nicht inline */
    const neu={...st};
    if(tag==="b"||tag==="strong"||n.style?.fontWeight>="600")neu.b=true;
    if(tag==="i"||tag==="em")neu.i=true;
    if(tag==="u")neu.u=true;
    if(tag==="s"||tag==="strike"||tag==="del")neu.strike=true;
    if(tag==="sup")neu.vert="superscript";
    if(tag==="sub")neu.vert="subscript";
    if(tag==="font"&&n.getAttribute("color"))neu.color=n.getAttribute("color").replace("#","").toUpperCase();
    if(n.style&&n.style.color){const h=farbHex(n.style.color);if(h)neu.color=h}
    if(n.style&&n.style.backgroundColor){const h=farbHex(n.style.backgroundColor);if(h)neu.hi=h}
    if(tag==="a"){neu.link=true;links.push({href:n.getAttribute("href")||"",start:runs.length})}
    inlineAblaufen(n,neu,runs,links,ctx);
    if(tag==="a")links[links.length-1].end=runs.length;
  });
}
function absatzXml(el,pPrExtra,basisStil,ctx){
  const runs=[],links=[];
  inlineAblaufen(el,basisStil||{},runs,links,ctx);
  /* Links brauchen eine Relationship-ID vom Aufrufer - hier nur die Spanne
     merken, damit walkBlocks() sie nachträglich in <w:hyperlink> einwickeln
     und der Gesamtliste der Beziehungen hinzufügen kann. */
  return {runs,links,pPr:pPrExtra||""};
}
function jcVon(el){
  const a=(el.style&&el.style.textAlign)||"";
  return {left:"left",center:"center",right:"right",justify:"both"}[a]||null;
}
async function bildInfo(img){
  const m=/^data:([^;]+);base64,(.+)$/.exec(img.src||"");
  if(!m)return null;
  const ext=m[1]==="image/png"?"png":m[1]==="image/jpeg"?"jpeg":null;
  if(!ext)return null;
  const bin=atob(m[2]);const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const groesse=await new Promise(res=>{
    const im=new Image();im.onload=()=>res({w:im.naturalWidth,h:im.naturalHeight});
    im.onerror=()=>res({w:100,h:100});im.src=img.src;
  });
  return {ext,bytes,...groesse};
}
/* Läuft die Blockebene (direkte Kinder von root, plus Zellinhalt in
   Tabellen) ab und baut daraus die eigentliche <w:body>-XML zusammen. */
async function walkBlocks(root,ctx){
  let xml="";
  for(const el of [...root.children]){
    const tag=el.tagName.toLowerCase();
    if(el.classList&&el.classList.contains("toc")){
      /* Kein exportierter Text - stattdessen ist an den Überschriften bereits
         outlineLvl gesetzt (siehe stylesXml), Word kann darüber sein eigenes,
         seitenzahlgenaues Inhaltsverzeichnis einfügen (Referenzen-Menüband). */
      continue;
    }
    if(tag==="blockquote"){
      /* Wie im Editor: eingerückt und kursiv, statt wie ein normaler Absatz */
      const jc=jcVon(el);
      const pPr=`<w:ind w:left="284"/>${jc?`<w:jc w:val="${jc}"/>`:""}`;
      const a=absatzXml(el,pPr,{i:true},ctx);
      xml+=absatzZuXml(a,ctx);
    }else if(tag==="p"||tag==="div"){
      const jc=jcVon(el);
      const a=absatzXml(el,jc?`<w:jc w:val="${jc}"/>`:"",null,ctx);
      xml+=absatzZuXml(a,ctx);
    }else if(/^h[1-3]$/.test(tag)){
      const a=absatzXml(el,`<w:pStyle w:val="Heading${tag[1]}"/>`,null,ctx);
      xml+=absatzZuXml(a,ctx);
    }else if(tag==="ul"||tag==="ol"){
      xml+=listeXml(el,tag==="ol"?2:1,0,ctx);
    }else if(tag==="table"){
      xml+=await tabelleXml(el,ctx);
    }else if(tag==="figure"){
      xml+=await figurXml(el,ctx);
    }else if(el.querySelector&&(el.querySelector("p,ul,ol,table,figure,h1,h2,h3"))){
      xml+=await walkBlocks(el,ctx);   /* fremdes Wrapper-Element: einfach hindurchsehen */
    }else{
      const a=absatzXml(el,"",null,ctx);
      xml+=absatzZuXml(a,ctx);
    }
  }
  return xml;
}
function absatzZuXml(a,ctx){
  let runs=a.runs;
  a.links.forEach(l=>{
    if(l.end===undefined)l.end=runs.length;
    const id="rIdLink"+(ctx.linkId++);
    ctx.links.push({id,href:l.href});
    const innen=runs.slice(l.start,l.end).join("");
    runs=[...runs.slice(0,l.start),`<w:hyperlink r:id="${id}">${innen}</w:hyperlink>`,...runs.slice(l.end)];
  });
  const pPr=a.pPr?`<w:pPr>${a.pPr}</w:pPr>`:"";
  return `<w:p>${pPr}${runs.join("")}</w:p>`;
}
function listeXml(list,numId,ilvl,ctx){
  let xml="";
  [...list.children].forEach(li=>{
    if(li.tagName.toLowerCase()!=="li")return;
    const unterliste=li.querySelector(":scope > ul, :scope > ol");
    const klon=li.cloneNode(true);
    if(unterliste)klon.querySelector(":scope > ul, :scope > ol")?.remove();
    const a=absatzXml(klon,`<w:numPr><w:ilvl w:val="${ilvl}"/><w:numId w:val="${numId}"/></w:numPr>`,null,ctx);
    xml+=absatzZuXml(a,ctx);
    if(unterliste)xml+=listeXml(unterliste,unterliste.tagName.toLowerCase()==="ol"?2:1,Math.min(3,ilvl+1),ctx);
  });
  return xml;
}
async function tabelleXml(table,ctx){
  const spalten=table.rows[0]?table.rows[0].children.length:0;
  const cg=table.querySelector(":scope > colgroup");
  const breiten=cg
    ?[...cg.children].map(c=>ctx.tableWidthTwip*parseFloat(c.style.width)/100)
    :Array(spalten).fill(ctx.tableWidthTwip/Math.max(1,spalten));
  const grid=breiten.map(w=>`<w:gridCol w:w="${Math.round(w)}"/>`).join("");
  let zeilen="";
  for(const tr of table.rows){
    const hEm=parseFloat(tr.style.height);
    const trHeight=hEm?`<w:trHeight w:val="${Math.round(hEm*(ctx.docSize)*20)}" w:hRule="atLeast"/>`:"";
    let zellen="";
    for(let i=0;i<tr.children.length;i++){
      const td=tr.children[i];
      const w=Math.round(breiten[i]||ctx.tableWidthTwip/spalten);
      const inhalt=td.querySelector("p,ul,ol,table,figure,h1,h2,h3")
        ?await walkBlocks(td,ctx)
        :absatzZuXml(absatzXml(td,"",null,ctx),ctx);
      zellen+=`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/></w:tcPr>${inhalt||"<w:p/>"}</w:tc>`;
    }
    zeilen+=`<w:tr>${trHeight?`<w:trPr>${trHeight}</w:trPr>`:""}${zellen}</w:tr>`;
  }
  return `<w:tbl><w:tblPr><w:tblW w:w="${ctx.tableWidthTwip}" w:type="dxa"/>`+
    `<w:tblBorders><w:top w:val="single" w:sz="4" w:color="999999"/><w:left w:val="single" w:sz="4" w:color="999999"/>`+
    `<w:bottom w:val="single" w:sz="4" w:color="999999"/><w:right w:val="single" w:sz="4" w:color="999999"/>`+
    `<w:insideH w:val="single" w:sz="4" w:color="999999"/><w:insideV w:val="single" w:sz="4" w:color="999999"/></w:tblBorders>`+
    `</w:tblPr><w:tblGrid>${grid}</w:tblGrid>${zeilen}</w:tbl><w:p/>`;
}
async function figurXml(fig,ctx){
  const img=fig.querySelector("img");if(!img)return"";
  const info=await bildInfo(img);if(!info)return"";
  const id="rIdImg"+(ctx.imgId++);
  ctx.images.push({id,ext:info.ext,bytes:info.bytes});
  const frei=fig.classList.contains("free");
  let wEmu,hEmu;
  if(frei){
    wEmu=mmToEmu(+fig.dataset.fw||40);hEmu=mmToEmu(+fig.dataset.fh||16);
  }else{
    const proz=(+fig.dataset.w||70)/100;
    wEmu=Math.round(ctx.contentWidthEmu*proz);
    hEmu=Math.round(wEmu*(info.h/info.w));
  }
  const cx="cx"+ctx.imgId,name="Bild"+ctx.imgId;
  const bildXml=`<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
    <pic:nvPicPr><pic:cNvPr id="${ctx.imgId}" name="${name}"/><pic:cNvPicPr/></pic:nvPicPr>
    <pic:blipFill><a:blip r:embed="${id}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>
    <pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${wEmu}" cy="${hEmu}"/></a:xfrm>
    <a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>`;
  if(frei){
    const x=mmToEmu(+fig.dataset.fx||0),y=mmToEmu(+fig.dataset.fy||0);
    return `<w:p><w:r><w:drawing><wp:anchor xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
      behindDoc="0" locked="0" layoutInCell="1" allowOverlap="1" relativeHeight="${ctx.imgId}">
      <wp:simplePos x="0" y="0"/>
      <wp:positionH relativeFrom="margin"><wp:posOffset>${x}</wp:posOffset></wp:positionH>
      <wp:positionV relativeFrom="margin"><wp:posOffset>${y}</wp:posOffset></wp:positionV>
      <wp:extent cx="${wEmu}" cy="${hEmu}"/><wp:wrapNone/>
      <wp:docPr id="${ctx.imgId}" name="${name}"/>
      <a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
      ${bildXml}</a:graphicData></a:graphic></wp:anchor></w:drawing></w:r></w:p>`;
  }
  return `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:drawing>
    <wp:inline xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
    <wp:extent cx="${wEmu}" cy="${hEmu}"/><wp:docPr id="${ctx.imgId}" name="${name}"/>
    <a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
    ${bildXml}</a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
}
async function exportDoc(){
  flush();const d=doc();
  const f=fmtOf(d);
  const container=document.createElement("div");container.innerHTML=d.html||"";
  docxEinebnen(container);
  const ctx={imgId:0,linkId:0,images:[],links:[],
    docSize:d.size||S.settings.size,
    tableWidthTwip:mmToTwip(f.w-f.m[1]-f.m[3]),
    contentWidthEmu:mmToEmu(f.w-f.m[1]-f.m[3]),
    footnoteId:1,footnotes:[],footnoteLookup:new Map((d.footnotes||[]).map(fn=>[fn.id,fn.text]))};
  const bodyXml=await walkBlocks(container,ctx);
  const sectPr=`<w:sectPr><w:pgSz w:w="${mmToTwip(f.w)}" w:h="${mmToTwip(f.h)}"/>`+
    `<w:pgMar w:top="${mmToTwip(f.m[0])}" w:right="${mmToTwip(f.m[1])}" w:bottom="${mmToTwip(f.m[2])}" w:left="${mmToTwip(f.m[3])}" `+
    `w:header="${mmToTwip(f.hd)}" w:footer="${mmToTwip(f.fd)}" w:gutter="0"/></w:sectPr>`;
  const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
  xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
  xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
  xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
  xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
<w:body>${bodyXml||"<w:p/>"}${sectPr}</w:body></w:document>`;
  const hatFussnoten=ctx.footnotes.length>0;
  const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
<Relationship Id="rIdNumbering" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>
${hatFussnoten?'<Relationship Id="rIdFootnotes" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footnotes" Target="footnotes.xml"/>':""}
${ctx.images.map(im=>`<Relationship Id="${im.id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${im.id}.${im.ext}"/>`).join("")}
${ctx.links.map(l=>`<Relationship Id="${l.id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="${xesc(l.href)}" TargetMode="External"/>`).join("")}
</Relationships>`;
  const contentTypes=hatFussnoten
    ?DOCX_CONTENT_TYPES.replace("</Types>",'<Override PartName="/word/footnotes.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footnotes+xml"/></Types>')
    :DOCX_CONTENT_TYPES;
  const enc=new TextEncoder();
  const eintraege=[
    {name:"[Content_Types].xml",bytes:enc.encode(contentTypes)},
    {name:"_rels/.rels",bytes:enc.encode(DOCX_RELS)},
    {name:"word/document.xml",bytes:enc.encode(documentXml)},
    {name:"word/styles.xml",bytes:enc.encode(stylesXml(d))},
    {name:"word/numbering.xml",bytes:enc.encode(numberingXml())},
    {name:"word/_rels/document.xml.rels",bytes:enc.encode(docRels)},
    ...ctx.images.map(im=>({name:`word/media/${im.id}.${im.ext}`,bytes:im.bytes})),
    ...(hatFussnoten?[{name:"word/footnotes.xml",bytes:enc.encode(footnotesXml(ctx.footnotes))}]:[])
  ];
  const blob=await zipSchreiben(eintraege);
  const u=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=u;a.download=d.title+".docx";a.click();
  setTimeout(()=>URL.revokeObjectURL(u),900);
}
/* Kein eigener PDF-Schreiber - der nutzt denselben Druckdialog wie
   "Drucken", nur unter einem Namen, unter dem Leute tatsächlich danach
   suchen. Chrome und Edge bieten dort "Als PDF speichern" als Ziel an;
   der Hinweis-Toast erscheint vor dem Dialog, weil window.print() danach
   blockiert, bis er geschlossen wird. */
function exportPdf(){
  flush();
  withPrintFootnotes(()=>{
    setPrintPage();
    toast(tr("Im Druckdialog Als PDF speichern als Ziel wählen"));
    setTimeout(()=>window.print(),500);
  });
}
/* ---- Fremde Dokumente laden ----
   Liest Text, Markdown und HTML. Unsere eigenen .doc-Exporte sind HTML und
   kommen damit ebenfalls zurück; echte Word-Dateien sind Binärformate. */
function textToHtml(t){
  return String(t).replace(/\r\n?/g,"\n").split(/\n{2,}/)
    .map(p=>p.trim()).filter(Boolean)
    .map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("")||"<p><br></p>";
}
function mdToHtml(src){
  const inline=s=>esc(s)
    .replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g,'<img src="$2" alt="$1" style="width:70%">')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<i>$2</i>")
    .replace(/(^|[\s(])_([^_\n]+)_/g,"$1<i>$2</i>");
  let out="",liste=null,absatz=[];
  const listeZu=()=>{if(liste){out+="</"+liste+">";liste=null}};
  const absatzZu=()=>{if(absatz.length){out+="<p>"+inline(absatz.join(" "))+"</p>";absatz=[]}};
  String(src).replace(/\r\n?/g,"\n").split("\n").forEach(zeile=>{
    const l=zeile.trimEnd();let m;
    if(!l.trim()){absatzZu();listeZu();return}
    if(m=/^(#{1,3})\s+(.*)$/.exec(l)){absatzZu();listeZu();
      out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;return}
    if(/^\s*(---+|\*\*\*+|___+)\s*$/.test(l)){absatzZu();listeZu();
      out+='<div class="pgbreak" contenteditable="false" data-label="'+esc(tr("Seitenumbruch"))+'"></div>';return}
    if(m=/^\s*[-*+]\s+(.*)$/.exec(l)){absatzZu();
      if(liste!=="ul"){listeZu();out+="<ul>";liste="ul"}out+="<li>"+inline(m[1])+"</li>";return}
    if(m=/^\s*\d+[.)]\s+(.*)$/.exec(l)){absatzZu();
      if(liste!=="ol"){listeZu();out+="<ol>";liste="ol"}out+="<li>"+inline(m[1])+"</li>";return}

function cleanHtml(src){
  const body=new DOMParser().parseFromString(String(src),"text/html").body;
  body.querySelectorAll("script,style,link,meta,base,title,iframe,object,embed,noscript,form,input,button,select,textarea")
    .forEach(n=>n.remove());
  const erlaubt=new Set(["href","src","alt","style","class","colspan","rowspan","data-w","data-label","data-n","data-fn","data-toc","data-tof","data-style","data-levels","data-pagenums","data-leader","title","contenteditable"]);
  body.querySelectorAll("*").forEach(el=>{
    [...el.attributes].forEach(a=>{
      const n=a.name.toLowerCase(),v=String(a.value||"");
      if(!erlaubt.has(n)||n.startsWith("on")){el.removeAttribute(a.name);return}
      if(/javascript:/i.test(v))el.removeAttribute(a.name);
    });
    if(el.tagName==="A"&&el.getAttribute("href")){
      el.setAttribute("target","_blank");el.setAttribute("rel","noopener");
    }
  });
  /* Unsere HTML-Exporte legen den Text in einen Gestaltungs-Container.
     Bliebe der stehen, wäre das ganze Dokument ein einziger Block und der
     Seitenumbruch könnte nicht mehr zwischen Absätzen trennen. */
  let w=body.firstElementChild;
  while(body.children.length===1&&w&&w.tagName==="DIV"&&!w.className&&w.children.length){
    while(w.firstChild)body.insertBefore(w.firstChild,w);
    body.removeChild(w);w=body.firstElementChild;
  }
  return body.innerHTML.trim()||"<p><br></p>";
}
/* ================= Einfügen aus der Zwischenablage ================= */
/* Beim Kopieren von einer Webseite kommt deren ganzes Layout mit: feste
   Pixelbreiten, Floats, fremde Klassen. Ungefiltert eingesetzt läuft der
   Inhalt über den Satzspiegel hinaus — und schlimmer, fremde Namen treffen
   auf unsere eigenen: ein <div class="toc" data-toc> von irgendeiner Seite
   gälte der App als das Inhaltsverzeichnis dieses Dokuments, und Chrome
   rechnet ein fremdes class="hit" in ein fest eingebranntes gelbes
   background-color um — die Farbe unserer Suchtreffer als Dauerzustand.

   Ein einziger Filter für alles ginge nicht, denn die App setzt selbst
   Inline-Stile, die von außen unerwünscht wären: margin-left fürs Einrücken,
   color/background-color für Farben, position/left/top für frei gesetzte
   Bilder. Was aus dem eigenen Dokument stammt, muss also erkennbar sein —
   deshalb bekommt Kopiertes hier eine Marke mit. */
const PQW_MARK="data-pqw-src";

   nur über die Tastatur festhalten — das paste-Ereignis selbst verrät nicht,
   welche Tasten es ausgelöst haben. */
let plainPaste=false;
/* Leerzeilen trennen Absätze, einzelne Umbrüche bleiben Umbrüche. */
function plainToHtml(t){
  const e=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return String(t).replace(/\r\n?/g,"\n").split(/\n{2,}/)
    .map(p=>"<p>"+(e(p).split("\n").join("<br>")||"<br>")+"</p>").join("");

/* Elemente ohne Textinhalt: sie tragen nichts bei und bringen nur Ärger */
const PASTE_WEG="script,style,link,meta,base,title,iframe,object,embed,noscript,"+
                "form,input,button,select,textarea,canvas,video,audio,svg,template";
/* Reine Layoutschachteln: Inhalt behalten, Hülle auflösen */
const PASTE_HUELLE=new Set(["DIV","SECTION","ARTICLE","HEADER","FOOTER","ASIDE","NAV",
                            "MAIN","CENTER","FONT","PICTURE","TIME","ABBR","LABEL"]);
/* Auszeichnung, die etwas bedeutet — nicht, wie die Quelle aussah */
const PASTE_STIL=new Set(["font-weight","font-style","text-decoration",
                          "text-decoration-line","text-align"]);
const PASTE_TAGS=new Set(["P","H1","H2","H3","H4","H5","H6","UL","OL","LI","TABLE",
  "THEAD","TBODY","TFOOT","TR","TD","TH","BLOCKQUOTE","PRE","CODE","B","STRONG","I",
  "EM","U","S","STRIKE","DEL","INS","SUP","SUB","A","IMG","FIGURE","FIGCAPTION","BR","HR","SPAN"]);

function pasteKeepStyle(el,erlaubt){
  const st=el.style,behalten=[];
  for(let i=0;i<st.length;i++){
    const p=st[i];
    if(erlaubt.has(p))behalten.push(p+":"+st.getPropertyValue(p));
  }
  if(behalten.length)el.setAttribute("style",behalten.join(";"));

/* Aus dem eigenen Dokument: alles bleibt, bis auf das, was sich nicht
   verdoppeln darf. Ein zweites Inhaltsverzeichnis wäre keins mehr, und
   doppelte Überschriften-Kennungen brächten die Gliederung durcheinander. */
function cleanPasteOwn(src){
  const b=new DOMParser().parseFromString(String(src),"text/html").body;
  const box=b.querySelector("["+PQW_MARK+"]")||b;
  box.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
  box.querySelectorAll("[data-toc],[data-tof]").forEach(e=>e.remove());
  return box.innerHTML;
}
/* Von außen: die Gliederung wird übernommen, die Gestaltung der Quelle nicht.
   Überschrift bleibt Überschrift, Liste bleibt Liste — aber Breiten, Floats,
   Schriftgrößen und Farben der fremden Seite bleiben draußen, damit sich der
   Text in dieses Dokument einfügt statt sein altes Layout mitzuschleppen. */
function cleanPasteForeign(src){
  const dom=new DOMParser().parseFromString(String(src),"text/html");
  const b=dom.body;
  b.querySelectorAll(PASTE_WEG).forEach(n=>n.remove());
  const w=dom.createTreeWalker(b,NodeFilter.SHOW_COMMENT);
  const komm=[];let k;while(k=w.nextNode())komm.push(k);
  komm.forEach(n=>n.remove());

  b.querySelectorAll("*").forEach(el=>{
    [...el.attributes].forEach(a=>{
      const n=a.name.toLowerCase();
      if(n==="colspan"||n==="rowspan")return;
      if(n==="alt"&&el.tagName==="IMG")return;
      if(n==="style"){pasteKeepStyle(el,PASTE_STIL);return}
      if(n==="href"&&el.tagName==="A"){
        if(/^\s*(javascript|data|vbscript):/i.test(a.value))el.removeAttribute("href");
        return;
      }
      if(n==="src"&&el.tagName==="IMG"){
        /* http(s) und eingebettete Bilder ja, alles andere nein */
        if(!/^\s*(https?:|data:image\/)/i.test(a.value))el.removeAttribute("src");
        return;
      }
      el.removeAttribute(a.name);      /* class, id, data-*, width, height, … */
    });
    if(el.tagName==="A"&&el.getAttribute("href")){
      el.setAttribute("target","_blank");el.setAttribute("rel","noopener");
    }
  });
  /* Hüllen auflösen. Von hinten nach vorn, damit verschachtelte Schachteln in
     einem Durchgang verschwinden und die Liste dabei gültig bleibt. */
  const alle=[...b.querySelectorAll("*")].reverse();
  alle.forEach(el=>{
    const t=el.tagName;
    if(t==="SPAN"&&!el.getAttribute("style")){unwrap(el);return}
    if(PASTE_HUELLE.has(t)||!PASTE_TAGS.has(t)){
      /* Eine Schachtel mit eigenem Text darf nicht spurlos verschwinden, sonst
         klebt ihr Text am vorigen Absatz. Sie wird dann selbst zum Absatz.
         Rein inline gedachte Hüllen (font, time, abbr …) lösen sich dagegen
         auf, die standen ohnehin mitten im Satz. */
      const inline=t==="FONT"||t==="SPAN"||t==="TIME"||t==="ABBR"||t==="LABEL";
      if(PASTE_HUELLE.has(t)&&!inline&&el.textContent.trim()
         &&!el.querySelector("p,h1,h2,h3,h4,h5,h6,li,tr,figure,blockquote,pre")){
        const p=dom.createElement("p");
        while(el.firstChild)p.appendChild(el.firstChild);
        el.replaceWith(p);return;
      }
      unwrap(el);
    }
  });
  b.querySelectorAll("img:not([src])").forEach(n=>n.remove());
  /* Ein Bild, das allein in seinem Block steht, wird zu einem Dokumentbild —
     dann greifen Werkzeugleiste und Ziehgriff darauf wie auf jedes andere. */
  b.querySelectorAll("img").forEach(img=>{
    if(img.closest("figure"))return;
    const p=img.parentNode;
    const allein=p===b||(p.children.length===1&&!(p.textContent||"").trim());
    if(!allein)return;
    const fig=dom.createElement("figure");fig.className="fig";
    (p===b?img:p).replaceWith(fig);fig.appendChild(img);
  });
  b.querySelectorAll("figure").forEach(f=>f.className="fig");
  return b.innerHTML.trim();
}
/* ---- Einfügeoptionen ----
   Nach dem Einfügen erscheint neben der Stelle ein kleiner Knopf, der die
   Formatierung nachträglich wegnehmen kann. Vorher zu fragen hätte einen
   Dialog gebraucht, der jedes Einfügen aufhält — so bemerkt ihn nur, wer ihn
   braucht. Er zeigt zugleich die Tastenkombination, damit man sie beiläufig
   lernt und ihn beim nächsten Mal nicht mehr benötigt. */
/* Rückgängig gemacht wird über den Zustand von vorher, nicht über Marken im
   Text: leere Marken-Spans rutschen beim Einsetzen von Blockinhalten an
   andere Stellen — die Endmarke landete im Versuch in einem <li>. Der
   gesicherte Stand ist unempfindlich dagegen und gilt nur, solange der Knopf
   steht. */
let pasteOpt=null;              /* {snapshot, pos, text} */
let pasteOptOff=null;           /* räumt die Abmelde-Ereignisse wieder ab */
/* Die Cursorstelle als Weg durch den Baum. Sie übersteht das Zurücksetzen des
   Inhalts, weil sie nicht an Knoten hängt, sondern an Positionen. */
function caretPath(ed){
  const s=getSelection();
  if(!s.rangeCount)return null;
  const r=s.getRangeAt(0);
  if(!ed.contains(r.startContainer))return null;
  const weg=[];let n=r.startContainer;
  while(n&&n!==ed){const p=n.parentNode;if(!p)return null;
    weg.unshift([...p.childNodes].indexOf(n));n=p}
  return {weg,off:r.startOffset};
}
function caretRestore(ed,pos){
  if(!pos)return;
  let n=ed;
  for(const i of pos.weg){if(!n.childNodes||!n.childNodes[i])break;n=n.childNodes[i]}
  const max=n.nodeType===3?(n.nodeValue||"").length:(n.childNodes?n.childNodes.length:0);
  try{
    const r=document.createRange();
    r.setStart(n,Math.min(pos.off,max));r.collapse(true);
    const s=getSelection();s.removeAllRanges();s.addRange(r);
  }catch(e){}
}
function pasteBarClose(){
  const bar=$("#pastebar");if(bar)bar.classList.remove("on");
  if(pasteOptOff){pasteOptOff();pasteOptOff=null}
  pasteOpt=null;
}
/* Lohnt sich der Knopf überhaupt? Bei reinem Text gäbe es nichts wegzunehmen. */
function pasteHasFormat(html){
  return /<(h[1-6]|b|strong|i|em|u|s|a|ul|ol|li|table|img|figure|blockquote|pre|code)[\s>]/i.test(html)
      || /style="/i.test(html);
}
function pasteBarShow(snapshot,pos,text){
  const ed=$("#editor");if(!ed)return;
  pasteOpt={snapshot,pos,text};
  const bar=$("#pastebar");
  bar.innerHTML=`<button class="pill" id="pbPlain">${tr("Nur Text übernehmen")}</button>
    <span class="k">${tr("Strg")} &#8679; V</span>
    <button class="tb" id="pbClose" title="${tr("Schließen")}">&times;</button>`;
  bar.classList.add("on");
  /* Am Ende des Eingefügten: dort steht der Cursor nach dem Einsetzen. */
  const s=getSelection();
  let r=null;
  if(s.rangeCount){
    const rects=s.getRangeAt(0).getClientRects();
    r=rects.length?rects[rects.length-1]:s.getRangeAt(0).getBoundingClientRect();
  }
  if(!r||(!r.width&&!r.height&&!r.top))r=ed.getBoundingClientRect();
  bar.style.left=Math.max(8,Math.min(r.left,innerWidth-bar.offsetWidth-10))+"px";
  bar.style.top=Math.min(r.bottom+6,innerHeight-bar.offsetHeight-8)+"px";
  $("#pbPlain").onclick=pasteBarPlain;
  $("#pbClose").onclick=pasteBarClose;
  /* Erst im nächsten Durchlauf anmelden: das Einfügen selbst löst noch ein
     input-Ereignis aus, das den Knopf sonst sofort wieder schlösse. */
  setTimeout(()=>{
    if(!pasteOpt)return;
    const zu=e=>{if(e&&e.target&&e.target.closest&&e.target.closest("#pastebar"))return;pasteBarClose()};
    document.addEventListener("mousedown",zu,true);
    ed.addEventListener("input",zu);
    ed.addEventListener("keydown",zu);
    $("#pane").addEventListener("scroll",zu);
    pasteOptOff=()=>{
      document.removeEventListener("mousedown",zu,true);
      ed.removeEventListener("input",zu);
      ed.removeEventListener("keydown",zu);
      const p=$("#pane");if(p)p.removeEventListener("scroll",zu);
    };
  },0);
}
function pasteBarPlain(){
  const ed=$("#editor");
  if(!ed||!pasteOpt)return;
  const {snapshot,pos,text}=pasteOpt;
  /* Auf den Stand vor dem Einfügen zurück, Cursor an seine Stelle, dann den
     Rohtext einsetzen — über execCommand, damit Absatzgrenzen stimmen und der
     Schritt in derselben Rückgängig-Kette landet wie alles andere. */
  ed.innerHTML=snapshot;
  ed.focus();

    if(text.indexOf("\n")<0)document.execCommand("insertText",false,text);
    else document.execCommand("insertHTML",false,plainToHtml(text));

  pasteBarClose();
  flush();dirty=true;commit();queuePaginate();
  if(typeof drawAnchors==="function")drawAnchors();

/* Steht der Cursor in einem Absatz, verschmilzt der Browser den ersten
   eingefügten Absatz damit — richtig so, ein Absatz kann nur eine Ausrichtung
   haben. Dabei rechnet Chrome dessen Blockeigenschaften aber in Inline-Spans
   um, wo sie nichts bewirken. Die tragen nichts und werden hier abgeräumt. */
function pasteTidy(){
  const ed=$("#editor");if(!ed)return;
  ed.querySelectorAll("span[style],b[style],i[style],em[style],strong[style],u[style],a[style]")
    .forEach(el=>{
      el.style.removeProperty("text-align");
      el.style.removeProperty("margin-left");
      el.style.removeProperty("text-indent");
      if(el.getAttribute("style"))return;
      el.removeAttribute("style");
      if(el.tagName==="SPAN")unwrap(el);
    });
