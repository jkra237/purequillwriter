/* ZIP (.docx/.odt) und OLE (.doc) sind Binärformate und lassen sich hier nicht lesen */
function looksBinary(s){
  const kopf=String(s).slice(0,400);
  if(kopf.startsWith("PK"))return true;
  let seltsam=0;
  for(let i=0;i<kopf.length;i++){const c=kopf.charCodeAt(i);if(c===0||c===0xFFFD)seltsam++}
  return seltsam>kopf.length*0.05;
}
/* Ein Eintrag je Zeile: Beschreibung für den Dateidialog, dazu die
   Endungen. Beides speist sowohl die benannten Gruppen des neuen Dialogs
   als auch die accept-Liste des alten — so kann die Liste der unterstützten
   Formate nicht zwischen beiden Wegen auseinanderlaufen. */
const DOKFORMATE=[
  {n:"Word-Dokumente",   e:[".doc",".docx"]},
  {n:"Text und Markdown",e:[".txt",".text",".md",".markdown"]},
  {n:"Webseiten",        e:[".html",".htm"]},
  {n:"OpenDocument und RTF",e:[".odt",".rtf"]}
];
const DOKENDUNGEN=DOKFORMATE.flatMap(f=>f.e);
async function ladeDokumente(dateien){
  if(!dateien.length)return;
  let geladen=0,abgelehnt=0;
  for(const f of dateien){
    const ext=(f.name.match(/\.([a-z0-9]+)$/i)||[,""])[1].toLowerCase();
    try{
      if(ZIPFORMATE.includes(ext)){
        const html=await zipDokument(f.name,await f.arrayBuffer());
        if(neuesDokumentAus(f.name,html))geladen++;else abgelehnt++;
      }else{
        if(importDocumentText(f.name,await f.text()))geladen++;else abgelehnt++;
      }
    }catch(e){abgelehnt++}
  }
  if(geladen)toast(geladen===1?tr("Dokument geladen"):geladen+" "+tr("Dokumente")+" "+tr("geladen"));
  else if(abgelehnt)toast(tr("Diese Datei ließ sich nicht lesen"));
}
function loadDocumentFile(){
  /* Chrome und Edge können benannte Formatgruppen im Dateidialog zeigen.
     Firefox und Safari kennen showOpenFilePicker nicht, und ohne HTTPS
     steht sie auch dort nicht bereit — dann der bisherige Weg mit einer
     kombinierten Filterzeile. */
  if(window.showOpenFilePicker&&window.isSecureContext){
    const alle={description:tr("Alle unterstützten Dokumente"),
      accept:{"application/octet-stream":DOKENDUNGEN}};
    const gruppen=DOKFORMATE.map(f=>({description:tr(f.n),
      accept:{"application/octet-stream":f.e}}));
    window.showOpenFilePicker({multiple:true,types:[alle,...gruppen]})
      .then(async handles=>ladeDokumente(await Promise.all(handles.map(h=>h.getFile()))))
      /* Abbrechen wirft AbortError — das ist keine Störung, sondern die
         Antwort des Nutzers, und darf keine Meldung auslösen. */
      .catch(err=>{if(err&&err.name!=="AbortError")dateiEingabeDialog()});
    return;
  }
  dateiEingabeDialog();
}
function dateiEingabeDialog(){
  const i=document.createElement("input");
  i.type="file";i.multiple=true;
  i.accept=DOKENDUNGEN.join(",");
  i.onchange=()=>ladeDokumente([...i.files]);
  i.click();
}
/* Gemeinsamer Abschluss für alle Formate */
function neuesDokumentAus(name,html){
  if(!html)return false;
  flush();
  const d=blankDoc(String(name).replace(/\.[^.]+$/,"").slice(0,60));
  d.customTitle=true;           /* Dateiname als Titel behalten */
  d.html=html;
  d.glossaryId=defaultGlossId();
  S.docs.push(d);S.active=d.id;
  save();render();
  return true;
}
function importDocumentText(name,raw){
  if(looksBinary(raw))return false;
  const ext=(String(name).match(/\.([a-z0-9]+)$/i)||[,""])[1].toLowerCase();
  let html;
  if(ext==="md"||ext==="markdown")html=mdToHtml(raw);
  else if(ext==="rtf"||/^\s*\{\\rtf/i.test(raw))html=rtfToHtml(raw);
  else if(["html","htm","doc"].includes(ext)||/^\s*<(!doctype|html|meta|body|div|p|h[1-6])\b/i.test(raw))html=cleanHtml(raw);
  else html=textToHtml(raw);
  return neuesDokumentAus(name,html);
}
/* RTF ist reiner Text mit Steuerworten. Absätze, Auszeichnungen und
   Sonderzeichen decken ab, was Textverarbeitungen üblicherweise ausgeben. */
function rtfToHtml(raw){
  let t=String(raw);
  t=t.replace(/\\'([0-9a-f]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)));
  t=t.replace(/\\u(-?\d+)\??/g,(m,n)=>String.fromCharCode(+n<0?+n+65536:+n));
  /* Gruppen, die nicht in den Text gehören */
  t=t.replace(/\{\\\*[^{}]*\}/g,"");
  t=t.replace(/\{\\(?:fonttbl|colortbl|stylesheet|info|generator)[^{}]*(?:\{[^{}]*\}[^{}]*)*\}/gi,"");
  const marken=[];
  t=t.replace(/\\(par|line|b0|b|i0|i|ul0|ulnone|ul|strike0|strike)\b ?/g,(m,w)=>{
    marken.push(w);return "\u0000"+(marken.length-1)+"\u0000"});
  t=t.replace(/\\[a-z]+-?\d* ?/gi,"");     /* übrige Steuerworte */
  t=t.replace(/[{}]/g,"");
  let out="",offen=[],absatz="";
  const zu=()=>{while(offen.length)absatz+="</"+offen.pop()+">"};
  const auf=tag=>{if(!offen.includes(tag)){absatz+="<"+tag+">";offen.push(tag)}};
  const ab=tag=>{const k=offen.indexOf(tag);if(k<0)return;
    for(let j=offen.length-1;j>=k;j--)absatz+="</"+offen[j]+">";
    const wieder=offen.slice(k+1);offen=offen.slice(0,k);
    wieder.forEach(x=>{absatz+="<"+x+">";offen.push(x)})};
  t.split(/\u0000(\d+)\u0000/).forEach((teil,idx)=>{
    if(idx%2===1){
      const w=marken[+teil];
      if(w==="par"){zu();out+="<p>"+(absatz.trim()||"<br>")+"</p>";absatz=""}
      else if(w==="line")absatz+="<br>";
      else if(w==="b")auf("b"); else if(w==="b0")ab("b");
      else if(w==="i")auf("i"); else if(w==="i0")ab("i");
      else if(w==="ul")auf("u"); else if(w==="ul0"||w==="ulnone")ab("u");
      else if(w==="strike")auf("s"); else if(w==="strike0")ab("s");
      return;
    }
    absatz+=esc(teil.replace(/\r?\n/g,""));
  });
  zu();
  if(absatz.trim())out+="<p>"+absatz+"</p>";
  return out||null;
}

/* ---- .docx und .odt ----
   Beide sind ZIP-Archive. Browser können seit 2023 selbst entpacken
   (DecompressionStream), deshalb braucht es dafür keine Fremdbibliothek. */
const ZIPFORMATE=["docx","odt"];
async function zipEintrag(buf,name){
  const dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder();
  /* Zentrales Verzeichnis steht am Dateiende, Signatur rückwärts suchen */
  let eocd=-1;
  for(let i=u8.length-22;i>=0&&i>u8.length-65558;i--)
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)return null;
  const anzahl=dv.getUint16(eocd+10,true);
  let q=dv.getUint32(eocd+16,true);
  for(let k=0;k<anzahl;k++){
    if(q+46>u8.length||dv.getUint32(q,true)!==0x02014b50)return null;
    const methode=dv.getUint16(q+10,true);
    const komp=dv.getUint32(q+20,true);
    const nlen=dv.getUint16(q+28,true);
    const elen=dv.getUint16(q+30,true);
    const clen=dv.getUint16(q+32,true);
    const lokal=dv.getUint32(q+42,true);
    if(dec.decode(u8.subarray(q+46,q+46+nlen))===name){
      const ln=dv.getUint16(lokal+26,true),le=dv.getUint16(lokal+28,true);
      const start=lokal+30+ln+le;
      const daten=u8.subarray(start,start+komp);
      if(methode===0)return dec.decode(daten);
      if(methode!==8||typeof DecompressionStream!=="function")return null;
      const strom=new Blob([daten]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return dec.decode(await new Response(strom).arrayBuffer());
    }
    q+=46+nlen+elen+clen;
  }
  return null;
}
const xesc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const xattr=(el,n)=>el.getAttribute("w:"+n)||el.getAttribute(n)||
  el.getAttributeNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main",n);

/* --- Word --- */
function docxLauf(p){
  let out="";
  [...p.children].forEach(el=>{
    if(el.localName==="hyperlink"){out+=docxLauf(el);return}
    if(el.localName!=="r")return;
    let t="";
    [...el.children].forEach(c=>{
      if(c.localName==="t")t+=xesc(c.textContent);
      else if(c.localName==="br")t+="<br>";
      else if(c.localName==="tab")t+=" ";
    });
    if(!t)return;
    const pr=[...el.children].find(c=>c.localName==="rPr");
    if(pr){
      const an=n=>{const e=[...pr.children].find(c=>c.localName===n);
        if(!e)return false;const v=xattr(e,"val");return v!=="0"&&v!=="false"};
      if(an("b"))t="<b>"+t+"</b>";
      if(an("i"))t="<i>"+t+"</i>";
      if(an("u"))t="<u>"+t+"</u>";
      if(an("strike"))t="<s>"+t+"</s>";
    }
    out+=t;
  });
  return out;
}
function docxToHtml(xml){
  const dom=new DOMParser().parseFromString(xml,"application/xml");
  if(dom.querySelector("parsererror"))return null;
  const body=[...dom.documentElement.children].find(e=>e.localName==="body");
  if(!body)return null;
  let out="",liste=false;
  const zu=()=>{if(liste){out+="</ul>";liste=false}};
  const absatz=p=>{
    const pr=[...p.children].find(c=>c.localName==="pPr");
    const stil=pr&&[...pr.children].find(c=>c.localName==="pStyle");
    const nummer=pr&&[...pr.children].some(c=>c.localName==="numPr");
    const name=stil?String(xattr(stil,"val")||""):"";
    /* Word beschriftet Überschriften je nach Sprache anders */
    const h=name.match(/^(?:Heading|berschrift|Titre|Ttulo)\s*([1-6])/i);
    const inhalt=docxLauf(p);
    if(nummer){if(!liste){out+="<ul>";liste=true}out+="<li>"+(inhalt||"<br>")+"</li>";return}
    zu();
    if(h)out+="<h"+Math.min(3,+h[1])+">"+(inhalt||"<br>")+"</h"+Math.min(3,+h[1])+">";
    else out+="<p>"+(inhalt||"<br>")+"</p>";
  };
  const tabelle=t=>{
    zu();
    let r="<table>";
    [...t.children].filter(x=>x.localName==="tr").forEach(tr=>{
      r+="<tr>";
      [...tr.children].filter(x=>x.localName==="tc").forEach(tc=>{
        const inner=[...tc.children].filter(x=>x.localName==="p").map(docxLauf).join("<br>");
        r+="<td>"+(inner||"&nbsp;")+"</td>";
      });
      r+="</tr>";
    });
    out+=r+"</table>";
  };
  [...body.children].forEach(el=>{
    if(el.localName==="p")absatz(el);
    else if(el.localName==="tbl")tabelle(el);
  });
  zu();
  return out||null;
}

/* --- OpenDocument (LibreOffice) --- */
function odtToHtml(xml){
  const dom=new DOMParser().parseFromString(xml,"application/xml");
  if(dom.querySelector("parsererror"))return null;
  /* Auszeichnungen stecken in den automatischen Formatvorlagen */
  const stile={};
  [...dom.getElementsByTagName("*")].forEach(el=>{
    if(el.localName!=="style")return;
    const n=el.getAttribute("style:name");if(!n)return;
    const tp=[...el.children].find(c=>c.localName==="text-properties");if(!tp)return;
    stile[n]={
      b:/bold/i.test(tp.getAttribute("fo:font-weight")||""),
      i:/italic|oblique/i.test(tp.getAttribute("fo:font-style")||""),
      u:!!(tp.getAttribute("style:text-underline-style")||"").replace(/none/i,""),
      s:!!(tp.getAttribute("style:text-line-through-style")||"").replace(/none/i,"")
    };
  });
  const inhalt=[...dom.getElementsByTagName("*")].find(e=>e.localName==="text"&&
    e.parentElement&&e.parentElement.localName==="body");
  if(!inhalt)return null;
  const lauf=el=>{
    let t="";
    [...el.childNodes].forEach(k=>{
      if(k.nodeType===3){t+=xesc(k.nodeValue);return}
      if(k.nodeType!==1)return;
      if(k.localName==="line-break"){t+="<br>";return}
      if(k.localName==="s"){t+=" ";return}
      if(k.localName==="tab"){t+=" ";return}
      let s=lauf(k);
      if(k.localName==="span"){
        const st=stile[k.getAttribute("text:style-name")];
        if(st){if(st.b)s="<b>"+s+"</b>";if(st.i)s="<i>"+s+"</i>";
               if(st.u)s="<u>"+s+"</u>";if(st.s)s="<s>"+s+"</s>"}
      }
      t+=s;
    });
    return t;
  };
  let out="";
  const block=el=>{
    if(el.localName==="h"){
      const n=Math.min(3,+(el.getAttribute("text:outline-level")||1));
      out+="<h"+n+">"+(lauf(el)||"<br>")+"</h"+n+">";
    } else if(el.localName==="p"){
      out+="<p>"+(lauf(el)||"<br>")+"</p>";
    } else if(el.localName==="list"){
      out+="<ul>";
      [...el.children].filter(x=>x.localName==="list-item").forEach(li=>{
        out+="<li>"+[...li.children].map(lauf).join(" ")+"</li>"});
      out+="</ul>";
    } else if(el.localName==="table"){
      out+="<table>";
      [...el.children].filter(x=>x.localName==="table-row").forEach(tr=>{
        out+="<tr>";
        [...tr.children].filter(x=>x.localName==="table-cell").forEach(tc=>{
          out+="<td>"+([...tc.children].map(lauf).join("<br>")||"&nbsp;")+"</td>"});
        out+="</tr>"});
      out+="</table>";
    }
  };
  [...inhalt.children].forEach(block);
  return out||null;
}
async function zipDokument(name,buf){
  const ext=(String(name).match(/\.([a-z0-9]+)$/i)||[,""])[1].toLowerCase();
  try{
    if(ext==="docx"){
      const xml=await zipEintrag(buf,"word/document.xml");
      return xml?docxToHtml(xml):null;
    }
    const xml=await zipEintrag(buf,"content.xml");
    return xml?odtToHtml(xml):null;
  }catch(e){return null}
}

   ersetzt den Bestand, Teilsicherungen werden hinzugefügt. */
const PQW=1;
const safeName=s=>String(s||"").replace(/[\\/:*?"<>|\n]/g,"-").trim().slice(0,60)||"PureQuill";
function notesOfDoc(d){
  const t=document.createElement("div");t.innerHTML=d.html||"";
  const ids=new Set();t.querySelectorAll(".anch").forEach(s=>ids.add(s.dataset.n));

function saveBundle(kind){
  flush();
  const stamp=new Date().toISOString().slice(0,10);
  let b,name;
  if(kind==="doc"){
    const d=doc();
    b={pqw:PQW,kind,saved:new Date().toISOString(),docs:[d],notes:notesOfDoc(d)};
    name=safeName(tr(d.title))+" + "+tr("Notizen")+" "+stamp+".json";
  }else if(kind==="notes"){
    b={pqw:PQW,kind,saved:new Date().toISOString(),notes:S.notes,glossary:S.glossary,glossaries:S.glossaries};
    name=tr("Notizen und Glossar")+" "+stamp+".json";
  }else{
    b=Object.assign({pqw:PQW,kind:"all",saved:new Date().toISOString()},JSON.parse(JSON.stringify(S)));
    name="PureQuill "+tr("Vollsicherung")+" "+stamp+".json";
  }
  download(name,JSON.stringify(b,null,1),"application/json");
  toast(tr("Gesichert"));
}
function importJson(){
  const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{let b;
      try{b=JSON.parse(r.result)}catch(e){toast(tr("Datei nicht lesbar"));return}
      applyBundle(b)};
    r.readAsText(f)};i.click();
}
function applyBundle(b){
  if(!b||typeof b!=="object"||Array.isArray(b)){toast(tr("Diese Datei passt nicht zu PureQuill Writer"));return}
  /* Ältere Sicherungen tragen keine Kennung, enthalten aber den kompletten Bestand */
  const kind=b.kind||((b.docs&&b.settings)?"all":null);
  if(!kind){toast(tr("Diese Datei passt nicht zu PureQuill Writer"));return}
  if(kind==="all"){
    confirmReplace(()=>{
      const neu={...b};delete neu.pqw;delete neu.kind;delete neu.saved;
      S=neu;
      ensureGlossaries();
      lockedOvl=false;closeOvl();
      save();applyTheme();applyStaticLabels();render();toast(tr("Geladen"));
    });
    return;
  }
  let nD=0,nN=0,nG=0;
  const nIds=new Set(S.notes.map(n=>n.id));
  (b.notes||[]).forEach(n=>{if(n&&n.id&&!nIds.has(n.id)){S.notes.push(n);nIds.add(n.id);nN++}});
  const cIds=new Set(S.glossaries.map(c=>c.id));
  (b.glossaries||[]).forEach(c=>{if(c&&c.id&&!cIds.has(c.id)){S.glossaries.push(c);cIds.add(c.id)}});
  const gIds=new Set(S.glossary.map(g=>g.id));
  (b.glossary||[]).forEach(g=>{if(g&&g.id&&!gIds.has(g.id)){S.glossary.push(g);gIds.add(g.id);nG++}});
  const dIds=new Set(S.docs.map(d=>d.id));
  (b.docs||[]).forEach(d=>{
    if(!d)return;
    if(dIds.has(d.id))d.id=uid();      /* schon vorhanden: als Kopie einfügen */
    dIds.add(d.id);S.docs.push(d);S.active=d.id;nD++;
  });
  ensureGlossaries();
  lockedOvl=false;closeOvl();
  save();applyTheme();applyStaticLabels();render();
  const teile=[];
  if(nD)teile.push(nD===1?tr("ein Dokument"):nD+" "+tr("Dokumente"));
  if(nN)teile.push(nN+" "+tr(nN===1?"Notiz":"Notizen"));
  if(nG)teile.push(nG+" "+tr(nG===1?"Glossareintrag":"Glossareinträge"));
  toast(teile.length?tr("Hinzugefügt")+": "+teile.join(", "):tr("Nichts Neues in dieser Datei"));
}

/* Untermenüs eines bereits offenen Menüs klappen bei Hover auf, nicht erst
   beim Klick — wie bei nativen Menüs (Word, macOS-Menüleiste). Das
   Erstöffnen von Datei/Ansicht/Format/Werkzeuge selbst bleibt Klick, nur

let hotNote=null,curOcc={},anchTimer=null;
const hex2rgba=(h,a)=>{const n=parseInt(h.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
function spansOf(id){const ed=$("#editor");return ed?[...ed.querySelectorAll('.anch[data-n="'+id+'"]')]:[]}
function anchoredIds(){const ed=$("#editor");if(!ed)return[];
  const out=[];ed.querySelectorAll(".anch").forEach(s=>{if(!out.includes(s.dataset.n))out.push(s.dataset.n)});
  return out.filter(id=>findNote(id))}
function anchorCount(id){let c=0;S.docs.forEach(d=>{
  const t=document.createElement("div");t.innerHTML=d.html||"";
  c+=t.querySelectorAll('.anch[data-n="'+id+'"]').length});return c}
function queueAnchors(){clearTimeout(anchTimer);anchTimer=setTimeout(drawAnchors,260)}

function linkSelection(){
  const ed=$("#editor");
  if(S.mode!=="write"||!ed){toast(tr("Nur im Schreibmodus"));return}
  const sel=getSelection();
  if(!sel.rangeCount||sel.isCollapsed){toast(tr("Erst eine Textstelle markieren"));return}
  const range=sel.getRangeAt(0).cloneRange();
  const notes=S.notes;
  overlay(`<div class="modal"><h3>${tr("Notiz mit dieser Stelle verknüpfen")}</h3>
    <div class="pad" style="padding-bottom:9px"><input id="lq" placeholder="${tr("Notiz suchen oder neue anlegen")}" autocomplete="off"></div>
    <div class="cmdlist" id="ll"></div></div>`);
  const q=$("#lq"),l=$("#ll");let hits=[],idx=0;
  const paint=()=>{
    const v=q.value.trim().toLowerCase();
    const found=notes.filter(n=>!v||noteText(n).toLowerCase().includes(v));
    hits=[{neu:true,label:v
        ?PL(`Neue Notiz „${v.slice(0,30)}" an dieser Stelle`,`New note "${v.slice(0,30)}" at this spot`,
            `Nouvelle note « ${v.slice(0,30)} » à cet endroit`,`Nueva nota "${v.slice(0,30)}" en este punto`,
            `Nova nota "${v.slice(0,30)}" neste trecho`)
        :PL("Neue Notiz an dieser Stelle","New note at this spot",
            "Nouvelle note à cet endroit","Nueva nota en este punto","Nova nota neste trecho")},
      ...found.map(n=>({n,label:((n.title||noteText(n).trim())||tr("Leere Notiz")).slice(0,52)}))];
    idx=Math.min(idx,hits.length-1);
    l.innerHTML=hits.map((h,i)=>`<div class="pickitem ${i===idx?"on":""}" data-i="${i}">
      <span class="dotc" style="background:${h.neu?"transparent":(h.n.color||NOTECOLORS[0].c)};${h.neu?"border-style:dashed":""}"></span>
      <span style="flex:1">${esc(h.label)}</span>
      ${h.neu?`<span class="kbd">${tr("neu")}</span>`:(anchorCount(h.n.id)?`<span class="kbd">${anchorCount(h.n.id)} ${
        PL("Stellen","spots","passages","lugares","trechos")}</span>`:"")}</div>`).join("");
    const on=l.querySelector(".pickitem.on");if(on)on.scrollIntoView({block:"nearest"})};
  const go=()=>{const h=hits[idx];if(!h)return;
    const title=q.value.trim();closeOvl();
    let id;
    if(h.neu){const n=addNote("");if(title)n.title=title.slice(0,60);id=n.id}
    else id=h.n.id;
    wrapRange(range,id);hotNote=id;curOcc[id]=spansOf(id).length-1;
    flush();commit();drawAnchors();toast(tr("Verknüpft"))};
  q.oninput=()=>{idx=0;paint()};
  q.onkeydown=e=>{
    if(e.key==="ArrowDown"){e.preventDefault();idx=Math.min(idx+1,hits.length-1);paint()}
    else if(e.key==="ArrowUp"){e.preventDefault();idx=Math.max(idx-1,0);paint()}
    else if(e.key==="Enter"){e.preventDefault();go()}};
  l.onclick=e=>{const r=e.target.closest(".pickitem");if(!r)return;idx=+r.dataset.i;go()};
  paint();q.focus();
}
function wrapRange(r,id){
  const n=findNote(id),col=(n&&n.color)||NOTECOLORS[0].c;
  const sp=document.createElement("span");
  sp.className="anch";sp.dataset.n=id;
  sp.style.setProperty("--ac",col);sp.style.setProperty("--ab",hex2rgba(col,.5));
  try{r.surroundContents(sp)}catch(e){sp.appendChild(r.extractContents());r.insertNode(sp)}
}
function unwrap(el){const p=el.parentNode;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function dropAnchorsFor(id){
  S.docs.forEach(d=>{if(!d.html||d.html.indexOf(id)<0)return;
    const t=document.createElement("div");t.innerHTML=d.html;
    t.querySelectorAll('.anch[data-n="'+id+'"]').forEach(s=>{
      const p=s.parentNode;while(s.firstChild)p.insertBefore(s.firstChild,s);p.removeChild(s)});
    d.html=t.innerHTML});
}
function jumpTo(id,i){
  const l=spansOf(id);if(!l.length)return;
  const k=((i%l.length)+l.length)%l.length;curOcc[id]=k;hotNote=id;
  l[k].scrollIntoView({block:"center",behavior:"smooth"});drawAnchors();
}
function drawAnchors(){
  const col=$("#anchcol"),ed=$("#editor"),wrap=$(".pagewrap");
  if(!col||!ed)return;
  ed.classList.toggle("nomark",S.showAnchMarks===false);
  ed.querySelectorAll(".anch").forEach(s=>{
    const n=findNote(s.dataset.n);
    if(!n){unwrap(s);return}
    const c=n.color||NOTECOLORS[0].c;
    s.style.setProperty("--ac",c);s.style.setProperty("--ab",hex2rgba(c,.5));
    s.classList.toggle("hot",s.dataset.n===hotNote&&spansOf(s.dataset.n)[curOcc[s.dataset.n]||0]===s)});
  const ids=anchoredIds();
  if(!ids.length||!S.showCol){col.innerHTML="";col.style.width=S.showCol?"0":"0";col.style.flexBasis="0";return}
  col.style.width="252px";col.style.flexBasis="252px";
  col.innerHTML=ids.map(id=>{
    const n=findNote(id),k=curOcc[id]||0,tot=spansOf(id).length,c=n.color||NOTECOLORS[0].c;
    return `<div class="acard ${id===hotNote?"hot":""}" data-n="${id}"
      style="background:${c};--ac:${hex2rgba(c,.85)}">
      ${n.title?`<div class="at">${esc(n.title)}</div>`:""}
      <div class="ab" contenteditable="true" data-body="${id}">${noteBody(n)||"<p><br></p>"}</div>
      <div class="af">
        ${tot>1?`<span class="nav"><button data-prev="${id}" title="${tr("Vorige Stelle")}">&lsaquo;</button>
          ${k+1} ${OFWORD()} ${tot}<button data-next="${id}" title="${tr("Nächste Stelle")}">&rsaquo;</button></span>`
        :`<span>${tr("1 Stelle")}</span>`}
        <div style="flex:1"></div>
        <button data-unlink="${id}" title="${tr("Diese Verknüpfung lösen")}">${tr("lösen")}</button>
        <button data-ndel="${id}" title="${tr("Notiz und alle Verknüpfungen löschen")}">${tr("löschen")}</button>
      </div></div>`}).join("");
  const base=wrap.getBoundingClientRect().top;
  let prev=-1e6;
  ids.forEach(id=>{
    const el=col.querySelector('.acard[data-n="'+id+'"]');
    const s=spansOf(id)[curOcc[id]||0]||spansOf(id)[0];
    let y=s?s.getBoundingClientRect().top-base:0;
    if(y<prev)y=prev;
    el.style.top=Math.max(0,y)+"px";
    prev=y+el.offsetHeight+9});

/* ================= Seitenumbruch ================= */
const GAP=20;
let pgTimer=null,pageCount=1;
function queuePaginate(){clearTimeout(pgTimer);pgTimer=setTimeout(()=>{paginate();drawAnchors()},220)}
function paginate(){
  const ed=$("#editor"),paper=$("#paper"),layer=$("#pagelayer");
  if(!ed||!paper)return;
  renumberFootnotes(ed);
  const f=fmtOf(doc()),z=S.zoom;
  const pw=MM(f.w)*z, ph=MM(f.h)*z;
  const mr=MM(f.m[1])*z, ml=MM(f.m[3])*z;
  /* Der Textkörper beginnt am Rand — oder unterhalb der Kopfzeile, falls die
     tiefer reicht. Vorher konnten sich beide überlagern. */
  const mt=Math.max(MM(f.m[0])*z, hfBand(doc(),"hdr",z));
  const mb=Math.max(MM(f.m[2])*z, hfBand(doc(),"ftr",z));
  const stride=ph+GAP;
  lastStride=stride;
  paper.style.width=pw+"px";
  ed.style.padding=`${mt}px ${mr}px ${mb}px ${ml}px`;
  ed.style.setProperty("--pl",ml+"px");
  ed.style.setProperty("--pt",mt+"px");

  /* Frei platzierte Bilder liegen außerhalb des Flusses — sie dürfen weder
     umbrochen noch in die Seitenzahl eingerechnet werden. */
  const blocks=[...ed.children].filter(b=>!b.classList.contains("free"));
  const hasFn=doc().footnotes&&doc().footnotes.length&&ed.querySelector(".fn[data-fn]");
  /* Ein Durchlauf des Umbruchs: contentHOf(seite) legt fest, wie viel Platz
     auf jeder Seite für Text bleibt (unten reduziert um die dort benötigte
     Fußnotenfläche) - gibt zurück, welche Fußnoten-IDs auf welcher Seite
     landen, damit sie danach an genau dieser Stelle gerendert werden. */
  function reflow(contentHOf){
    blocks.forEach(b=>{b.style.marginTop="";if(b.classList.contains("pgbreak"))b.style.height=""});
    const edTop=ed.getBoundingClientRect().top;
    const fnByPage=[];
    blocks.forEach(b=>{
      const r=b.getBoundingClientRect();
      const top=r.top-edTop, h=r.height;
      let p=Math.max(0,Math.floor(top/stride));
      const contentH=contentHOf(p);
      if(b.classList.contains("pgbreak")){
        const nextStart=(p+1)*stride+mt;
        b.style.height=Math.max(14,nextStart-top-1)+"px";
        return;
      }
      const limit=p*stride+mt+contentH;
      if(top+h>limit+1&&h<=contentH){
        const base=parseFloat(getComputedStyle(b).marginTop)||0;
        b.style.marginTop=(base+((p+1)*stride+mt-top))+"px";
        p++;
      }
      if(hasFn)b.querySelectorAll&&b.querySelectorAll(".fn[data-fn]").forEach(m=>{
        (fnByPage[p]=fnByPage[p]||[]).push(m.dataset.fn);
      });
    });
    return fnByPage;
  }
  const contentH=Math.max(60,ph-mt-mb);
  let fnByPage=reflow(()=>contentH),fnHeights=[];
  if(hasFn){
    /* Wie viel Höhe die Fußnoten je Seite tatsächlich brauchen, an einem
       unsichtbaren Messelement mit derselben Breite und Schrift ablesen -
       eine Formel wie bei hfBand() würde beim Zeilenumbruch beliebig
       langer Fußnotentexte danebenliegen. */
    const meas=ensureFnMeasurer();
    meas.style.width=(pw-ml-mr)+"px";
    meas.style.fontSize=((8.5*96/72)*z)+"px";
    fnHeights=fnByPage.map(ids=>{
      const uniq=ids?[...new Set(ids)]:[];
      if(!uniq.length)return 0;
      meas.innerHTML=fnBandHtml(uniq);
      return meas.offsetHeight+MM(2)*z;
    });
    fnByPage=reflow(p=>Math.max(60,contentH-(fnHeights[p]||0)));
  }
  ed.querySelectorAll(".toc").forEach(t=>tocUpdatePageNumbers(ed,t));
  if(S.outlineOpen)drawOutline();
  const edTop=ed.getBoundingClientRect().top;
  const last=blocks.length?blocks[blocks.length-1].getBoundingClientRect():null;
  const bottom=last?last.bottom-edTop:0;
  pageCount=Math.max(1,Math.ceil((bottom+mb)/stride));
  if(bottom+mb+(fnHeights[pageCount-1]||0)>pageCount*stride-GAP)pageCount++;
  ed.style.minHeight=(pageCount*stride-GAP)+"px";
  paper.style.height=(pageCount*stride-GAP)+"px";
  placeFreeFigs();

  let html="";
  const ftrOn=hfOf(doc(),"ftr").on;
  for(let i=0;i<pageCount;i++){
    const fnIds=fnByPage[i]?[...new Set(fnByPage[i])]:[];
    html+=`<div class="sheetpage" style="top:${i*stride}px;height:${ph}px">
      ${S.guides?`<div class="mg" style="left:${ml}px"></div><div class="mg" style="right:${mr}px;left:auto"></div>`:""}
      ${hfHtml(i,pageCount,ml,mr,z)}
      ${fnIds.length?`<div class="fnband" style="bottom:${mb}px;left:${ml}px;right:${mr}px;font-size:${(8.5*96/72)*z}px">${fnBandHtml(fnIds)}</div>`:""}
      ${(S.pagenum!==false&&!ftrOn)?pnHtml(i,ml,mr,z,f):""}
    </div>`;
  }
  layer.innerHTML=html;
  drawRuler();
  drawStatus();
}

  let lh=isNew?(S.settings.lh||1.62):lhOf(doc());

let typTimer=null,flagTimer=null;
function setTyping(){

function typewriter(){
  if(S.settings.typewriter===false)return;
  const sh=$("#sheet"),sel=getSelection();
  if(!sh||!sel.rangeCount)return;
  const r=sel.getRangeAt(0).cloneRange();
  let box=r.getBoundingClientRect();
  if(!box.height){
    const el=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;
    if(!el)return;box=el.getBoundingClientRect();
  }
  if(!box.height)return;
  const target=sh.getBoundingClientRect().top+sh.clientHeight*0.42;
  const delta=box.top-target;
  if(Math.abs(delta)>3)sh.scrollTop+=delta;
}

function drawRuler(){
  const r=$("#ruler");if(!r)return;
  if(!S.guides){r.style.display="none";return}
  r.style.display="block";
  const f=fmtOf(doc()),z=S.zoom;
  const pw=MM(f.w)*z, ml=MM(f.m[3])*z, mr=MM(f.m[1])*z;
  r.style.width=pw+"px";
  let t="";
  for(let mm=0;mm<=f.w;mm+=5){
    const x=MM(mm)*z;
    t+=`<div class="tick ${mm%10===0?"big":""}" style="left:${x}px"></div>`;
  }
  t+=`<div class="zone" style="left:0;width:${ml}px"></div>
      <div class="zone" style="right:0;width:${mr}px"></div>
      <div class="hand" data-h="l" style="left:${ml}px" title="${tr("Linker Rand")}"></div>
      <div class="hand" data-h="r" style="left:${pw-mr}px" title="${tr("Rechter Rand")}"></div>
      <div class="rulertip" id="rtip"></div>`;
  r.innerHTML=t;
  r.querySelectorAll(".hand").forEach(h=>h.onmousedown=e=>{
    e.preventDefault();h.classList.add("drag");
    const side=h.dataset.h,rect=r.getBoundingClientRect(),tip=$("#rtip");
    tip.style.display="block";
    const move=ev=>{
      let x=Math.min(rect.width,Math.max(0,ev.clientX-rect.left));
      let mm=Math.round(x/(MM(1)*z));
      const fmt=fmtOf(doc());
      if(side==="l")mm=Math.min(mm,fmt.w-fmt.m[1]-20);
      else mm=Math.min(fmt.w-mm,fmt.w-fmt.m[3]-20);
      mm=Math.max(0,mm);
      const val=typeof doc().fmt==="object"?doc().fmt:{...fmt};
      val.m=[...fmt.m];val.m[side==="l"?3:1]=mm;
      doc().fmt=val;
      tip.textContent=toUnit(mm)+" "+unitAbbr();
      tip.style.left=(side==="l"?MM(mm)*z:MM(fmt.w-mm)*z)+"px";
      drawRuler();paginate();
      const nh=$("#ruler").querySelector(`[data-h="${side}"]`);if(nh)nh.classList.add("drag");
      $("#rtip").style.display="block";$("#rtip").textContent=toUnit(mm)+" "+unitAbbr();
      $("#rtip").style.left=tip.style.left;
    };
    const up=()=>{document.removeEventListener("mousemove",move);
      document.removeEventListener("mouseup",up);
      const tp=$("#rtip");if(tp)tp.style.display="none";
      commit();drawAnchors()};
    document.addEventListener("mousemove",move);
    document.addEventListener("mouseup",up);
  });
}

  return {words,chars,charsNoSp,paras};

/* ================= Kopf- und Fußzeile =================
   Platzhalter heißen {page}/{pages}/{title}/{date} - bewusst englisch, nicht
   an die Oberflächensprache gekoppelt, wie Feldnamen in einer Formel. Die
   alten deutschen Namen ({seite} etc.) werden in hfText() weiterhin erkannt,
   damit schon gespeicherter Kopf-/Fußzeilentext nicht plötzlich wörtlich
   "{seite}" anzeigt. */
const HF_DEF={hdr:{on:false,text:"{title}",align:"center"},
              ftr:{on:false,text:"Seite {page} von {pages}",align:"center"}};
function hfOf(d,which){return {...HF_DEF[which],...(d[which]||{})}}
function hfText(tpl,page,total,forPrint){
  const t=esc(tpl||"")
    .replace(/\{(titel|title)\}/gi,esc(doc().title||""))
    .replace(/\{(datum|date)\}/gi,new Date().toLocaleDateString(LOC()))
    .replace(/\{(seiten|pages)\}/gi,String(total));
  return forPrint
    ? t.replace(/\{(seite|page)\}/gi,'<span class="pageno"></span>')
    : t.replace(/\{(seite|page)\}/gi,String(page));
}
/* ---- Direktbearbeitung auf der Seite ---- */
let hfEditing=null;
function hfZoneAt(clientY){
  const paper=$("#paper");if(!paper||S.mode!=="write")return null;
  const f=fmtOf(doc()),z=S.zoom;
  const ph=MM(f.h)*z,mt=MM(f.m[0])*z,mb=MM(f.m[2])*z,stride=ph+GAP;
  const y=clientY-paper.getBoundingClientRect().top;
  if(y<0)return null;
  const page=Math.floor(y/stride);
  if(page<0||page>=pageCount)return null;
  const yp=y-page*stride;
  if(yp<0||yp>ph)return null;
  if(yp<mt)return{which:"hdr",page};
  if(yp>ph-mb)return{which:"ftr",page};
  return null;
}
function hfRect(which,page){
  const f=fmtOf(doc()),z=S.zoom;
  const ph=MM(f.h)*z,stride=ph+GAP;
  const fs=(9*96/72)*z;
  const zeilen=String(hfOf(doc(),which).text||"").split("\n").length;
  const h=Math.max(fs*1.35*zeilen,16);
  const d=MM(which==="hdr"?f.hd:f.fd)*z;
  return {top:which==="hdr"?page*stride+d:page*stride+ph-d-h,
    left:MM(f.m[3])*z,right:MM(f.m[1])*z,h,fs};
}
function hfHintAt(clientY){
  const hint=$("#hfhint");if(!hint)return;
  if(hfEditing){hint.classList.remove("on");return}
  const zone=hfZoneAt(clientY);
  if(!zone){hint.classList.remove("on");return}
  const r=hfRect(zone.which,zone.page),on=hfOf(doc(),zone.which).on;
  hint.style.cssText=`top:${r.top}px;left:${r.left}px;right:${r.right}px;height:${r.h}px`;
  hint.textContent=on?"":tr(zone.which==="hdr"?"Doppelklick: Kopfzeile":"Doppelklick: Fußzeile");
  hint.classList.add("on");
}
function hfEditOpen(which,page){
  const d=doc();
  if(!hfOf(d,which).on){d[which]={...hfOf(d,which),on:true};commit();paginate();setPrintHF()}
  const box=$("#hfedit");if(!box)return;
  hfEditing={which,page};
  const v=hfOf(d,which),r=hfRect(which,page);
  box.style.cssText=`top:${r.top}px;left:${r.left}px;right:${r.right}px;`+
    `min-height:${r.h}px;font-size:${r.fs}px;text-align:${v.align}`;
  box.textContent=v.text||"";
  box.classList.add("on");
  $("#hfhint").classList.remove("on");
  box.focus();
  const rg=document.createRange();rg.selectNodeContents(box);
  const s=getSelection();s.removeAllRanges();s.addRange(rg);
  placeHfGrip();
  drawHfBar();
}
/* Der Griff liegt auf der Grenze zwischen Kopf-/Fußzeilenband und Textkörper —
   also dort, wo der Text beginnt. Ihn zu ziehen ändert die Höhe des Bandes. */
function placeHfGrip(){
  const grip=$("#hfgrip");
  if(!hfEditing||!grip){if(grip)grip.classList.remove("on");return}
  const d=doc(),f=fmtOf(d),z=S.zoom;
  const ph=MM(f.h)*z,stride=ph+GAP,pg=hfEditing.page;
  const mt=Math.max(MM(f.m[0])*z,hfBand(d,"hdr",z));
  const mb=Math.max(MM(f.m[2])*z,hfBand(d,"ftr",z));
  const y=hfEditing.which==="hdr"?pg*stride+mt:pg*stride+ph-mb;
  grip.style.left=MM(f.m[3])*z+"px";
  grip.style.width=(MM(f.w)-MM(f.m[3])-MM(f.m[1]))*z+"px";
  grip.style.top=(y-6)+"px";
  grip.classList.add("on");
}
function hfEditCommit(){
  if(!hfEditing)return;
  const d=doc(),box=$("#hfedit");
  /* innerText statt textContent: erhält die Zeilenumbrüche der Eingabe */
  d[hfEditing.which]={...hfOf(d,hfEditing.which),text:(box.innerText||"").replace(/\n+$/,"")};
  commit();paginate();setPrintHF();
}
function hfEditClose(){
  const box=$("#hfedit");if(box){box.classList.remove("on");box.textContent=""}
  const bar=$("#hfbar");if(bar)bar.classList.remove("on");
  const grip=$("#hfgrip");if(grip)grip.classList.remove("on");
  hfEditing=null;
}
function drawHfBar(){

      title="${a==="left"?tr("Links"):a==="center"?tr("Mitte"):tr("Rechts")}">${ICO(ic[a])}</button>`).join("")}
    <div class="sep"></div>

       ["{title}","Titel einfügen"],["{date}","Datum einfügen"]].map(([p,n])=>
      `<button class="pill" data-hfp="${p}" title="${tr(n)}">${p}</button>`).join("")}
    <div class="sep"></div>
    <span style="color:var(--ink-soft);font-size:12px" title="${tr("Bis hierher bleibt die Seite frei von Text")}">${tr("Höhe")}</span>
    <input type="number" id="hfHeight" value="${fmtOf(doc()).m[hfEditing.which==="hdr"?0:2]}"
      title="${tr("Bis hierher bleibt die Seite frei von Text")}" style="width:50px;background:var(--paper);
      border:1px solid var(--rule);border-radius:var(--radius);padding:2px 4px">
    <span style="color:var(--ink-faint);font-size:11px">mm</span>
    <div class="sep"></div>
    <button class="pill" data-hfx="del">${tr("Entfernen")}</button>
    <button class="pill" data-hfx="done">${tr("Fertig")}</button>`;
  bar.classList.add("on");
  /* Erst an den linken Rand setzen, damit Umbruch und Höhe korrekt gemessen werden */
  bar.style.left="8px";bar.style.top="0px";
  const bw=bar.offsetWidth,bh=bar.offsetHeight;
  const r=box.getBoundingClientRect();
  bar.style.left=Math.max(8,Math.min(r.left,innerWidth-bw-10))+"px";
  bar.style.top=(r.bottom+8+bh<innerHeight-8?r.bottom+8:Math.max(8,r.top-bh-8))+"px";
}
/* Höhe des Kopf-/Fußzeilenbandes ziehen. Das verschiebt die Grenze, ab der
   Text steht — also den Seitenrand dieses Dokuments. Vorher verschob der Griff
   nur die Zeile selbst, was aussah, als ließe sich nichts vergrößern.
   Wird in drawWrite() gebunden, da #hfgrip bei jedem Render neu entsteht. */
function hfGripDrag(e){
  if(!hfEditing)return;
  e.preventDefault();
  const grip=$("#hfgrip");grip.classList.add("drag");
  const k=hfEditing.which,pg=hfEditing.page,d=doc();
  const fm=ownFmt(d),idx=k==="hdr"?0:2;
  const z=S.zoom,ph=MM(fm.h)*z,stride=ph+GAP;
  const paper=$("#paper");
  const move=ev=>{
    const y=ev.clientY-paper.getBoundingClientRect().top-pg*stride;
    let mm=Math.round((k==="hdr"?y:ph-y)/(MM(1)*z));
    /* Nicht in die Zeile hinein und nicht so weit, dass kein Text mehr passt */
    const minMm=Math.ceil(hfBand(d,k,z)/(MM(1)*z));
    const maxMm=Math.max(minMm,fm.h-fm.m[k==="hdr"?2:0]-30);
    mm=Math.min(maxMm,Math.max(minMm,mm));
    if(mm===fm.m[idx])return;
    fm.m[idx]=mm;
    paginate();placeHfGrip();
    const box=$("#hfedit");if(box)box.style.top=hfRect(k,pg).top+"px";
    const di=$("#hfHeight");if(di)di.value=mm;
  };
  const up=()=>{
    document.removeEventListener("mousemove",move);
    document.removeEventListener("mouseup",up);
    grip.classList.remove("drag");
    commit();setPrintHF();drawHfBar();
  };
  document.addEventListener("mousemove",move);
  document.addEventListener("mouseup",up);
}
$("#hfbar").addEventListener("mousedown",e=>{if(e.target.closest("button"))e.preventDefault()});
$("#hfbar").addEventListener("click",e=>{
  if(!hfEditing)return;
  const d=doc(),k=hfEditing.which;
  const al=e.target.closest("[data-hfa]");
  if(al){hfEditCommit();d[k]={...hfOf(d,k),align:al.dataset.hfa};
    $("#hfedit").style.textAlign=al.dataset.hfa;commit();paginate();drawHfBar();return}
  const ph=e.target.closest("[data-hfp]");
  if(ph){$("#hfedit").focus();document.execCommand("insertText",false,ph.dataset.hfp);return}
  const x=e.target.closest("[data-hfx]");
  if(!x)return;
  if(x.dataset.hfx==="del"){d[k]={...hfOf(d,k),on:false};hfEditClose();
    commit();paginate();setPrintHF();toast(tr(k==="hdr"?"Kopfzeile entfernt":"Fußzeile entfernt"));return}
  hfEditCommit();hfEditClose();
  const ed=$("#editor");ed&&ed.focus();
});
$("#hfbar").addEventListener("change",e=>{
  if(e.target.id!=="hfHeight"||!hfEditing)return;
  const d=doc(),k=hfEditing.which;
  const fm=ownFmt(d),idx=k==="hdr"?0:2;
  const minMm=Math.ceil(hfBand(d,k,S.zoom)/(MM(1)*S.zoom));
  fm.m[idx]=Math.max(minMm,Math.min(fm.h-fm.m[idx===0?2:0]-30,+e.target.value||0));
  e.target.value=fm.m[idx];
  commit();paginate();
  const r=hfRect(k,hfEditing.page);
  $("#hfedit").style.top=r.top+"px";
  drawHfBar();
});
function hfHtml(i,total,ml,mr,z){
  const d=doc(),h=hfOf(d,"hdr"),f=hfOf(d,"ftr"),fm=fmtOf(d);
  let out="";
  const fs=(9*96/72)*z;
  if(h.on)out+=`<div class="hf" style="top:${MM(fm.hd)*z}px;left:${ml}px;right:${mr}px;
    text-align:${h.align};font-size:${fs}px">${hfText(h.text,i+1,total)}</div>`;
  if(f.on)out+=`<div class="hf" style="bottom:${MM(fm.fd)*z}px;left:${ml}px;right:${mr}px;
    text-align:${f.align};font-size:${fs}px">${hfText(f.text,i+1,total)}</div>`;
  return out;
}
/* Automatische Seitenzahl (nur ohne eigene Fußzeile - die kann die Zahl über
   {page} längst selbst enthalten). Stand am selben Abstand zur Papierkante
   wie eine echte Fußzeile (MM(fm.fd)), nicht an einem festen Pixelwert - der
   lag der Kante zu nah und verschob sich mit dem Zoom nicht mit. Bewusst nur
   die reine Zahl, kein eigener Text - dafür gibt es die echte Fußzeile. */
function pnHtml(i,ml,mr,z,fm){
  const physPage=i+1, from=Math.max(1,S.pageNumFrom||1);
  if(physPage<from)return"";
  const num=(S.pageNumStart||1)+(physPage-from);
  const fs=((S.pageNumSize||9)*96/72)*z;
  return `<div class="pn" style="bottom:${MM(fm.fd)*z}px;left:${ml}px;right:${mr}px;
    text-align:${S.pageNumPos||"right"};font-size:${fs}px">${num}</div>`;
}

function setPrintHF(){

/* ---- Spalten und Zeilen durch Ziehen anpassen ---- */
/* Spaltenbreiten stecken als Prozentwerte in einer <colgroup> (überlebt Zoom
   von selbst, weil sie sich auf die Tabellenbreite bezieht, nicht auf Pixel).
   Zeilenhöhen stehen in em statt px am <tr> — em wächst mit der Schriftgröße
   mit, und die wächst wiederum mit --zoom. Damit braucht keiner der beiden
   Werte einen eigenen Nachführ-Hook bei jedem Zoomwechsel, anders als die
   frei platzierten Bilder mit ihren Millimeterwerten. */
const TBORDER=5, TCOL_MIN_PX=28, TROW_MIN_EM=1.3;
let tableDragActive=false;
function findTableEdge(x,y){
  const el=document.elementFromPoint(x,y);
  const cell=el&&el.closest&&el.closest("td,th");
  const ed=$("#editor");
  if(!cell||!ed||!ed.contains(cell))return null;
  const table=cell.closest("table"),row=cell.parentElement;
  const r=cell.getBoundingClientRect();
  if(cell.nextElementSibling&&Math.abs(x-r.right)<=TBORDER)
    return {type:"col",table,i:[...row.children].indexOf(cell)};
  if(cell.previousElementSibling&&Math.abs(x-r.left)<=TBORDER)
    return {type:"col",table,i:[...row.children].indexOf(cell)-1};
  /* Am Rand kann elementFromPoint die Zelle der Nachbarzeile treffen statt
     der eigenen — genau wie bei Spalten muss darum auch die Gegenrichtung
     geprüft werden (oberer statt unterer Rand), sonst bleibt die Kante
     unentdeckt, je nachdem auf welcher Seite der Treffer landet. */
  if(row.nextElementSibling&&Math.abs(y-r.bottom)<=TBORDER)
    return {type:"row",row};
  if(row.previousElementSibling&&Math.abs(y-r.top)<=TBORDER)
    return {type:"row",row:row.previousElementSibling};
  return null;
}
function ensureColgroup(table){
  let cg=table.querySelector(":scope > colgroup");
  if(cg)return cg;
  const n=table.rows[0]?table.rows[0].children.length:0;
  cg=document.createElement("colgroup");
  for(let i=0;i<n;i++){const c=document.createElement("col");c.style.width=(100/n)+"%";cg.appendChild(c)}
  table.insertBefore(cg,table.firstChild);
  return cg;
}
function startTableDrag(e,edge){
  e.preventDefault();
  tableDragActive=true;
  const ed=$("#editor");
  ed.style.cursor=edge.type==="col"?"col-resize":"row-resize";
  if(edge.type==="col"){
    const cg=ensureColgroup(edge.table);
    const cols=[...cg.children];
    const a=cols[edge.i],b=cols[edge.i+1];
    if(!a||!b){tableDragActive=false;ed.style.cursor="";return}
    const tw=edge.table.getBoundingClientRect().width;
    const startX=e.clientX,wa=parseFloat(a.style.width),wb=parseFloat(b.style.width);
    const minPct=Math.min(wa+wb-1,Math.max(3,TCOL_MIN_PX/tw*100));
    const move=ev=>{
      const dPct=(ev.clientX-startX)/tw*100;
      const na=Math.min(wa+wb-minPct,Math.max(minPct,wa+dPct));
      a.style.width=na+"%";b.style.width=(wa+wb-na)+"%";
    };
    const up=()=>{document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);
      tableDragActive=false;ed.style.cursor="";
      flush();dirty=true;commit();queuePaginate()};
    document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
  }else{
    const row=edge.row;
    const fs=parseFloat(getComputedStyle(row).fontSize)||16;
    const startY=e.clientY,startH=row.getBoundingClientRect().height;
    const move=ev=>{
      const h=Math.max(fs*TROW_MIN_EM,startH+(ev.clientY-startY));
      row.style.height=(h/fs)+"em";
    };
    const up=()=>{document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);
      tableDragActive=false;ed.style.cursor="";
      flush();dirty=true;commit();queuePaginate()};
    document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
  }
}

/* Läuft bei jedem paginate() über JEDES Verzeichnis (TOC wie Abbildungen) -

   gelöscht wurde, lässt ihre Zeile verwaist zurück - die wird hier entfernt,

function tocUpdatePageNumbers(ed,block){
  const edTop=ed.getBoundingClientRect().top;
  block.querySelectorAll(":scope > .toc-list > a[href]").forEach(a=>{
    let target=null;try{target=ed.querySelector(a.getAttribute("href"))}catch(e){}
    if(!target){a.remove();return}
    const pg=a.querySelector(".toc-pg");
    if(pg)pg.textContent=Math.max(1,Math.floor(target.getBoundingClientRect().top-edTop)/lastStride+1|0);
  });
}

}

/* ================= Abbildungsverzeichnis =================
   Deutlich schmaler als das Inhaltsverzeichnis gehalten: keine Stile, keine
   Ebenen - jede Abbildung mit Bildunterschrift ist ein Eintrag, fortlaufend
   nummeriert ("Abb. 1", "Abb. 2" …), mit Punktlinie und Seitenzahl. Teilt
   sich Aktualisierungs- und Seitenzahl-Logik mit dem Inhaltsverzeichnis
   (tocUpdatePageNumbers, refreshToc) über die gemeinsame .toc-list-Struktur. */
function tofItems(ed){
  return [...ed.querySelectorAll("figure.fig")].filter(f=>{
    const cap=f.querySelector("figcaption");
    return cap&&cap.textContent.trim();
  });
}
function ensureFigureIds(ed){
  tofItems(ed).forEach(f=>{if(!f.id)f.id="fig_"+uid()});
}
function tofEntriesHtml(ed){
  ensureFigureIds(ed);
  const edTop=ed.getBoundingClientRect().top;
  const items=tofItems(ed);
  if(!items.length)return `<div class="toc-empty">${tr("Noch keine Abbildungen mit Bildunterschrift.")}</div>`;
  return items.map((f,i)=>{
    const top=f.getBoundingClientRect().top-edTop;
    const page=Math.max(1,Math.floor(top/lastStride)+1);
    const cap=f.querySelector("figcaption").textContent.trim();
    return `<a href="#${f.id}">
      <span class="toc-num">${tr("Abb.")} ${i+1}</span>
      <span class="toc-t" contenteditable="true">${esc(cap)}</span>
      <span class="toc-leader"></span>
      <span class="toc-pg">${page}</span></a>`;
  }).join("");
}
function tofBlockHtml(ed){
  return `<div class="toc tof" data-tof="1" contenteditable="false" data-leader="dots">
    <div class="toc-head"><b>${tr("Abbildungsverzeichnis")}</b>
      <span class="toc-headbtns">
        <button class="toc-refresh" type="button" title="${tr("Gesamtes Verzeichnis aktualisieren")}">${ICO(ICO_REFRESH)}</button>
      </span></div>
    <div class="toc-list">${tofEntriesHtml(ed)}</div></div>`;
}
function insertTof(){
  if(!S.settings.tofEnabled)return;
  const ed=$("#editor");if(S.mode!=="write"||!ed)return;
  if(ed.querySelector(".tof")){toast(tr("Im Dokument gibt es bereits ein Abbildungsverzeichnis."));return}
  ed.focus();paginate();
  document.execCommand("insertHTML",false,tofBlockHtml(ed)+"<p><br></p>");
  flush();dirty=true;commit();queuePaginate();
}
/* ================= Gliederung =================
   Eigenständige linke Seitenleiste, unabhängig vom Inhaltsverzeichnis: zeigt
   ausnahmslos alle Überschriften (ignoriert d.tocHidden bewusst - die
   Gliederung ist ein Werkzeug für den Autor, kein Abbild dessen, was später
   gedruckt wird), lässt per Ziehen ganze Abschnitte im Dokument verschieben.
   "Abschnitt" gibt es im Datenmodell nicht als eigenes Objekt - eine
   Überschrift plus alles bis zur nächsten Überschrift gleicher oder höherer
   Ebene sind schlicht Nachbar-Elemente von #editor (outlineSections()
   berechnet diesen Lauf jedes Mal neu, es wird nichts davon gespeichert). */
function outlineSections(ed){
  ensureHeadingIds(ed);
  return tocHeadings(ed).map(h=>{
    const lvl=+h.tagName[1];
    const run=[h];
    let n=h.nextElementSibling;
    while(n&&!(/^H[1-3]$/.test(n.tagName)&&+n.tagName[1]<=lvl)){run.push(n);n=n.nextElementSibling}
    return {h,lvl,id:h.id,run};
  });
}
/* Ziehbare Breite für Gliederung und Seitenleiste (Memo/Notiz) - beide
   Panels sind Flex-Geschwister von #pane, ihre Breite geht also direkt in
   den für die Seite verfügbaren Platz ein (siehe fitZoom()). Die Breite
   selbst liegt als CSS-Variable am Wurzelelement, nicht am Panel-Element,
   weil #side bei jedem Öffnen komplett neu aufgebaut wird (innerHTML) und
   ein inline style dabei verloren ginge, eine CSS-Variable am <html> aber
   nicht. */
function bindPanelResize(handle,panel,cssVar,minW,maxW,edge,onDone){
  if(!handle||!panel)return;
  handle.onmousedown=e=>{
    if(e.button!==0)return;
    e.preventDefault();
    const startX=e.clientX,startW=panel.getBoundingClientRect().width;
    handle.classList.add("active");
    const move=ev=>{
      const dx=ev.clientX-startX;
      const w=Math.min(maxW,Math.max(minW,startW+(edge==="right"?dx:-dx)));
      document.documentElement.style.setProperty(cssVar,w+"px");
    };
    const up=()=>{
      document.removeEventListener("mousemove",move);
      document.removeEventListener("mouseup",up);
      handle.classList.remove("active");
      onDone(parseFloat(document.documentElement.style.getPropertyValue(cssVar))||minW);
    };
    document.addEventListener("mousemove",move);
    document.addEventListener("mouseup",up);
  };
}
function persistOutlineWidth(w){
  S.outlineWidth=Math.round(w);save();
  if(S.mode==="write"&&S.fitPage!==false){fitZoom();paginate()}
}
function persistSideWidth(w){
  S.sideWidth=Math.round(w);save();
  if(S.mode==="write"&&S.fitPage!==false){fitZoom();paginate()}
}
function toggleOutline(){
  S.outlineOpen=!S.outlineOpen;save();
  drawOutline();
  if(S.mode==="write"&&S.fitPage!==false){fitZoom();paginate()}
}
function drawOutline(){
  const box=$("#outline");if(!box)return;
  const ed=$("#editor");
  if(S.mode!=="write"||!S.outlineOpen||!ed){box.className="outline";box.innerHTML="";return}
  box.className="outline on";
  const secs=outlineSections(ed);
  box.innerHTML=`<div class="outline-resize" id="outlineResize" title="${tr("Breite ziehen")}"></div>
    <div class="ohead"><b>${tr("Gliederung")}</b>
      <button class="obtn" id="outlineClose" title="${tr("Schließen")}">${ICO('<path d="M6 6l12 12M18 6 6 18"/>')}</button></div>
    <div class="outline-list" id="outlineList">${secs.length?secs.map(s=>`
      <div class="outline-item ol${s.lvl}" data-oid="${s.id}">
        <span class="outline-drag" title="${tr("Ziehen zum Verschieben")}">${ICO('<circle cx="8" cy="6" r="1.3"/><circle cx="8" cy="12" r="1.3"/><circle cx="8" cy="18" r="1.3"/><circle cx="14" cy="6" r="1.3"/><circle cx="14" cy="12" r="1.3"/><circle cx="14" cy="18" r="1.3"/>')}</span>
        <span class="outline-t">${esc(s.h.textContent.trim())||tr("(ohne Text)")}</span>
      </div>`).join(""):`<div class="outline-empty">${tr("Hier erscheinen alle Überschriften des Dokuments. Noch keine Überschriften im Dokument.")}</div>`}
    </div>`;
  $("#outlineClose").onclick=()=>toggleOutline();
  bindOutlineDrag();
  bindPanelResize($("#outlineResize"),box,"--outline-w",160,480,"right",persistOutlineWidth);
  updateOutlineActive();
}
/* Welcher Abschnitt gerade "aktiv" ist, richtet sich danach, welche
   Überschrift zuletzt über eine feste Höhe von der Oberkante des sichtbaren
   Bereichs gescrollt ist - dieselbe Idee wie eine aktive Zeile beim
   Schreibmaschinen-Scrollen, nur pro Abschnitt statt pro Zeile. */
function updateOutlineActive(){
  const list=$("#outlineList");if(!list)return;
  const ed=$("#editor"),pane=$("#pane");if(!ed||!pane)return;
  const items=[...list.querySelectorAll(".outline-item")];
  if(!items.length)return;
  /* Gegen #pane messen, nicht #sheet: #sheet wächst mit dem Inhalt und
     scrollt bei langen Dokumenten meist gar nicht selbst - der tatsächliche
     Bildlaufbereich ist #pane (siehe .pane{overflow:auto}). #sheet bliebe
     als Bezugspunkt an derselben scrollenden Bewegung hängen wie der Inhalt
     selbst und würde nie eine "aktuelle" Überschrift zeigen. */
  const refY=pane.getBoundingClientRect().top+80;
  let activeId=items[0].dataset.oid;
  items.forEach(it=>{
    const h=ed.querySelector("#"+it.dataset.oid);
    if(h&&h.getBoundingClientRect().top<=refY)activeId=it.dataset.oid;
  });
  items.forEach(it=>it.classList.toggle("current",it.dataset.oid===activeId));
}
/* Zieht man einen Abschnitt an eine neue Stelle, wandert der gesamte Lauf
   (Überschrift + Inhalt bis zur nächsten Überschrift) - nicht nur die
   Überschriftzeile selbst, sonst würde der Text darunter zurückbleiben. */
function moveOutlineSection(ed,draggedId,targetId,after){
  const secs=outlineSections(ed);
  const dragged=secs.find(s=>s.id===draggedId),target=secs.find(s=>s.id===targetId);
  if(!dragged||!target||dragged.run.includes(target.h))return;
  let anchor=after?target.run[target.run.length-1].nextSibling:target.h;
  while(anchor&&dragged.run.includes(anchor))anchor=anchor.nextSibling;
  dragged.run.forEach(n=>ed.removeChild(n));
  dragged.run.forEach(n=>ed.insertBefore(n,anchor));
  flush();dirty=true;commit();queuePaginate();
  drawOutline();
}
function bindOutlineDrag(){
  const list=$("#outlineList");if(!list)return;
  let dragging=false;
  list.onclick=e=>{
    if(dragging||e.target.closest(".outline-drag"))return;
    const it=e.target.closest(".outline-item");if(!it)return;
    jumpToHeading("#"+it.dataset.oid);
  };
  list.querySelectorAll(".outline-drag").forEach(handle=>{
    handle.onmousedown=e=>{
      if(e.button!==0)return;
      e.preventDefault();
      const item=handle.closest(".outline-item");
      const startY=e.clientY;
      let moved=false,dropItem=null,dropAfter=false;
      const move=ev=>{
        if(!moved&&Math.abs(ev.clientY-startY)<4)return;
        if(!moved){moved=true;dragging=true;item.classList.add("dragging")}
        let best=null,bestDist=Infinity,after=false;
        list.querySelectorAll(".outline-item").forEach(x=>{
          if(x===item)return;
          const r=x.getBoundingClientRect(),mid=r.top+r.height/2;
          const dist=Math.abs(ev.clientY-mid);
          if(dist<bestDist){bestDist=dist;best=x;after=ev.clientY>mid}
        });
        list.querySelectorAll(".outline-item").forEach(x=>x.classList.remove("drop-above","drop-below"));
        if(best){best.classList.add(after?"drop-below":"drop-above");dropItem=best;dropAfter=after}
      };
      const up=()=>{
        document.removeEventListener("mousemove",move);
        document.removeEventListener("mouseup",up);
        item.classList.remove("dragging");
        list.querySelectorAll(".outline-item").forEach(x=>x.classList.remove("drop-above","drop-below"));
        if(moved&&dropItem)moveOutlineSection($("#editor"),item.dataset.oid,dropItem.dataset.oid,dropAfter);
        setTimeout(()=>{dragging=false},0);   /* der click danach soll nicht als Sprung zählen */
      };
      document.addEventListener("mousemove",move);
      document.addEventListener("mouseup",up);
    };
  });
}
/* ================= Rechtschreibprüfung ================= */
/* Ein eigener Hunspell-Kern statt der Browserprüfung: die des Browsers zeichnet
   zwar Wellenlinien, gibt aber keine Liste ihrer Funde heraus — man kann also
   weder „12 Fehler“ anzeigen noch von einem zum nächsten springen. Gelesen
   werden dieselben .aff/.dic-Dateien wie in LibreOffice (Ordner dict/).
   Geladen wird erst beim ersten Prüfen: die Wörterbücher wiegen je nach
   Sprache 0,5 bis 4,5 MB und haben im Startweg der App nichts verloren. */
const SPELL_LANGS=[["de","Deutsch"],["en","Englisch"],["fr","Französisch"],
                   ["es","Spanisch"],["pt","Portugiesisch"],["pl","Polnisch"]];
/* Nicht jede Oberflächensprache hat ein Rechtschreib-Wörterbuch. Die Kopplung
   unten darf die Prüfsprache dann nicht auf einen Code stellen, für den es
   gar kein dict/*.aff gibt. */
const hasSpellDict=lang=>SPELL_LANGS.some(l=>l[0]===lang);

function spFlagSplit(s,mode){
  if(!s)return[];
  if(mode==="long"){const o=[];for(let i=0;i<s.length;i+=2)o.push(s.slice(i,i+2));return o}
  if(mode==="num")return s.split(",").filter(Boolean);
  return Array.from(s);
}
function spHasFlag(str,flag,mode){
  if(!flag||!str)return false;
  if(mode==="long"){for(let i=0;i<str.length;i+=2)if(str.slice(i,i+2)===flag)return true;return false}
  if(mode==="num")return str.split(",").indexOf(flag)>=0;
  return str.indexOf(flag)>=0;
}
function spCond(cond,isSuffix){
  if(!cond||cond===".")return null;
  try{return new RegExp(isSuffix?"(?:"+cond+")$":"^(?:"+cond+")")}catch(e){return null}
}
function spParseAff(text){
  const A={flagMode:"single",tryChars:"",rep:[],iconv:[],breaks:[],
    pfx:new Map(),sfx:new Map(),needAffix:null,forbidden:null,onlyInCompound:null,
    keepCase:null,circumfix:null,noSuggest:null,compoundBegin:null,compoundMiddle:null,
    compoundEnd:null,compoundFlag:null,compoundPermit:null,compoundMin:3,hasBreak:false};
  const lines=text.split(/\r?\n/);
  for(const ln of lines){const m=/^FLAG\s+(\S+)/.exec(ln);
    if(m){A.flagMode=m[1]==="long"?"long":m[1]==="num"?"num":"single";break}}
  const one=s=>spFlagSplit(s,A.flagMode)[0]||null;
  let pend=null;            /* offener PFX/SFX-Block: so viele Folgezeilen sind Regeln */
  for(let i=0;i<lines.length;i++){
    const raw=lines[i];if(!raw)continue;
    const ln=raw.replace(/\s+$/,"");if(!ln||ln[0]==="#")continue;
    const p=ln.split(/\s+/),k=p[0];
    if(pend&&k===pend.kind){
      const strip=p[2]==="0"?"":(p[2]||"");
      let add=p[3]==="0"?"":(p[3]||""),addFlags=null;
      const sl=add.indexOf("/");
      if(sl>=0){addFlags=add.slice(sl+1);add=add.slice(0,sl)}
      if(add==="0")add="";
      pend.ent.rules.push({strip,add,flags:addFlags,rx:spCond(p[4]||".",pend.kind==="SFX")});
      if(--pend.left<=0)pend=null;
      continue;
    }
    switch(k){
      case "TRY":A.tryChars=p[1]||"";break;
      case "NEEDAFFIX":case "PSEUDOROOT":A.needAffix=one(p[1]);break;
      case "FORBIDDENWORD":A.forbidden=one(p[1]);break;
      case "ONLYINCOMPOUND":A.onlyInCompound=one(p[1]);break;
      case "KEEPCASE":A.keepCase=one(p[1]);break;
      case "CIRCUMFIX":A.circumfix=one(p[1]);break;
      case "NOSUGGEST":A.noSuggest=one(p[1]);break;
      case "COMPOUNDBEGIN":A.compoundBegin=one(p[1]);break;
      case "COMPOUNDMIDDLE":A.compoundMiddle=one(p[1]);break;
      case "COMPOUNDEND":A.compoundEnd=one(p[1]);break;
      case "COMPOUNDFLAG":A.compoundFlag=one(p[1]);break;
      case "COMPOUNDPERMITFLAG":A.compoundPermit=one(p[1]);break;
      case "COMPOUNDMIN":A.compoundMin=Math.max(1,parseInt(p[1],10)||3);break;
      case "REP":if(p.length>=3&&!/^\d+$/.test(p[1]))A.rep.push([p[1],p[2]]);break;
      case "ICONV":if(p.length>=3&&!/^\d+$/.test(p[1]))A.iconv.push([p[1],p[2]]);break;

function spParseDic(words,lines,from,count){
  const end=Math.min(lines.length,from+count);
  for(let i=from;i<end;i++){
    let ln=lines[i];if(!ln)continue;
    const tab=ln.indexOf("\t");if(tab>=0)ln=ln.slice(0,tab);
    ln=ln.trim();if(!ln)continue;
    let slash=-1;
    for(let j=0;j<ln.length;j++){
      if(ln.charCodeAt(j)===92){j++;continue}
      if(ln.charCodeAt(j)===47){slash=j;break}
    }
    let w,f="";
    if(slash>=0){w=ln.slice(0,slash);f=ln.slice(slash+1)}else w=ln;
    if(w.indexOf("\\")>=0)w=w.replace(/\\\//g,"/");
    if(!w)continue;
    const sp=f.indexOf(" ");if(sp>=0)f=f.slice(0,sp);
    const prev=words.get(w);

       zusammengeklebt wären sie im Modus „long“ nicht mehr auseinanderzuhalten. */
    words.set(w,prev===undefined?f:prev+" "+f);

function spIndex(A){

  for(const ent of A.sfx.values())for(const rule of ent.rules){
    const v={ent,rule};
    if(rule.add)add(sByChar,rule.add[rule.add.length-1],v);else sEmpty.push(v)}

    const v={ent,rule};
    if(rule.add)add(pByChar,rule.add[0],v);else pEmpty.push(v)}

/* Akzente abtragen. NFD zerlegt die meisten, aber nicht alle: ł, ø, ß und die

const SP_FOLD={"ł":"l","ø":"o","đ":"d","ß":"ss","æ":"ae","œ":"oe","þ":"th","ð":"d"};
function spFold(s){

}
function spMake(A,words,idx){
  const mode=A.flagMode,memo=new Map(),user=new Set();
  const isBad=f=>spHasFlag(f,A.forbidden,mode);
  const onlyComp=f=>spHasFlag(f,A.onlyInCompound,mode);

  function sfxOf(word,needCross){
    const res=[];
    const scan=arr=>{
      if(!arr)return;
      for(let i=0;i<arr.length;i++){
        const ent=arr[i].ent,rule=arr[i].rule;
        if(needCross&&!ent.cross)continue;

          if(word.length<rule.add.length)continue;
          if(!word.endsWith(rule.add))continue;

        if(!stem)continue;

        if(rule.add){
          if(word.length<rule.add.length)continue;

  function analyze(word,inCompound){
    const out=[];
    const e=words.get(word);
    if(e!==undefined)for(const f of e.split(" ")){
      if(spHasFlag(f,A.needAffix,mode))continue;

  function partOk(part,pos){
    const want=pos==="begin"?A.compoundBegin:pos==="middle"?A.compoundMiddle:A.compoundEnd;
    const cands=[part];

  function directOk(word){

  function check(raw){

    if(!word)return true;

    if(user.has(word)||user.has(word.toLowerCase()))ok=true;
    else if(/\d/.test(word))ok=true;                    /* Zahlen prüft niemand */
    else{
      ok=checkOne(word);

        if(!b||word.indexOf(b)<0)continue;
        const parts=word.split(b).filter(Boolean);
        if(parts.length>1&&parts.every(p=>checkOne(p)||user.has(p))){ok=true;break}

  let foldIdx=null;

    foldIdx=new Map();

       Vorschlag deutlich unwahrscheinlicher als ein Wörterbucheintrag. Im
       Deutschen darf man alles zusammensetzen — ohne diesen Abschlag stünden
       gebastelte Wortpaare vor dem, was der Schreibende gemeint hat. */
    const rank=(cand,score)=>score+(directOk(cand)?0:2);
    const fromFold=(w,score)=>{
      if(!foldIdx.size)return;
      const alt=foldIdx.get(spFold(w));
      if(!alt)return;
      for(const a of alt){
        if(seen.has(a))continue;
        seen.add(a);
        if(check(a))scored.push([a,rank(a,score)]);
      }
    };
    const take=(cand,score)=>{
      if(!cand||seen.has(cand))return;
      seen.add(cand);
      if(check(cand)){scored.push([cand,rank(cand,score)]);return}
      fromFold(cand,score+1);       /* kein Treffer — vielleicht fehlen nur Akzente */
    };
    /* Die Gewichte liegen bewusst dicht beieinander. Weit gespreizt gewinnt
       immer die Ersetzungstabelle, und die rät phonetisch (f/ph, i/y) — sie
       darf eine schlichte Ein-Zeichen-Korrektur nicht überholen. */
    fromFold(word,0);                                        /* nur falsch akzentuiert */
    take(word[0].toUpperCase()+word.slice(1),0);             /* nur groß/klein daneben */
    take(word.toLowerCase(),0);
    for(let i=0;i<word.length-1;i++)                         /* zwei Zeichen vertauscht */
      take(word.slice(0,i)+word[i+1]+word[i]+word.slice(i+2),1);
    for(const [a,b] of A.rep){                               /* typische Vertipper der Sprache */
      let i=word.indexOf(a);

    for(let i=0;i<word.length;i++)take(word.slice(0,i)+word.slice(i+1),2);          /* Zeichen zuviel */
    for(let i=0;i<=word.length;i++)for(const ch of alpha)                            /* Zeichen fehlt */
      take(word.slice(0,i)+ch+word.slice(i),2);
    for(let i=0;i<word.length;i++)for(const ch of alpha){                            /* falsches Zeichen */
      if(ch===word[i])continue;
      take(word.slice(0,i)+ch+word.slice(i+1),3);
    }
    for(let i=2;i<word.length-1;i++){                        /* zwei Wörter statt einem */
      const a=word.slice(0,i),b=word.slice(i);

    const pref=s=>{const t=s.toLowerCase();let i=0;while(i<t.length&&i<lw.length&&t[i]===lw[i])i++;return i};
    const rk=s=>s[1]-Math.min(pref(s[0]),4)*0.5;

      ||Math.abs(x[0].length-word.length)-Math.abs(y[0].length-word.length)

/* Aufbau in Häppchen: die polnische .dic hat 300.000 Zeilen, am Stück
   geparst stünde die Oberfläche eine Sekunde lang still und der
   Fortschrittsbalken bliebe eingefroren. */
function spBuild(affText,dicText,onProg){
  return new Promise(resolve=>{
    const A=spParseAff(affText);
    const lines=dicText.split(/\r?\n/),words=new Map();
    let i=1;
    (function step(){
      const t=Date.now();
      while(i<lines.length&&Date.now()-t<24)i=spParseDic(words,lines,i,20000);
      if(onProg)onProg(i/lines.length);
      if(i<lines.length)setTimeout(step,0);
      else resolve(spMake(A,words,spIndex(A)));
    })();
  });
}

let SPELL=null;                 /* {lang, eng} — das geladene Wörterbuch */
let spellHits=[],spellIdx=0,spellSug=0,spellIgnore=new Set(),spellState="idle",spellProg=0;

function spellLangName(k){
  const e=SPELL_LANGS.find(l=>l[0]===k);
  return e?tr(e[1]):k;
}
async function spellLoad(lang,onProg){
  const base="dict/"+lang;
  const [aff,dic]=await Promise.all([
    fetch(base+".aff").then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}),
    fetch(base+".dic").then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})
  ]);
  const eng=await spBuild(aff,dic,onProg);
  (S.userDict||[]).forEach(w=>eng.addWord(w));

}
function spellClear(){
  const ed=$("#editor");if(!ed)return;
  ed.querySelectorAll(".spellerr").forEach(unwrap);
  spellHits=[];
}
/* Prüfung beenden: Markierungen weg und den bereinigten Stand sichern. */
function spellDone(){
  const hatte=spellHits.length>0;
  spellClear();spellState="idle";
  if(hatte){flush();dirty=true;commit();queuePaginate()}
}
/* Der eigentliche Durchlauf. Übersprungen wird, was der Benutzer nicht selbst
   getippt hat: Inhalts- und Abbildungsverzeichnis bauen sich aus Überschriften
   auf, dort wäre eine Korrektur beim nächsten Aktualisieren wieder weg. */
function spellScan(){
  const ed=$("#editor");if(!ed||!SPELL)return 0;
  spellClear();
  const eng=SPELL.eng;
  const rx=/\p{L}[\p{L}\p{M}]*(?:['’’-][\p{L}][\p{L}\p{M}]*)*/gu;
  const walk=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);
  const jobs=[];let n;
  while(n=walk.nextNode()){
    const v=n.nodeValue;
    if(!v||!v.trim())continue;
    const par=n.parentElement;
    if(!par||par.closest(".toc,.fhwrap,sup.fn"))continue;
    const hits=[];let m;rx.lastIndex=0;
    while(m=rx.exec(v)){
      const w=m[0];
      if(w.length<2||spellIgnore.has(w))continue;
      if(eng.check(w))continue;
      hits.push([m.index,w]);
    }
    if(hits.length)jobs.push([n,hits]);
  }
  jobs.forEach(([node,hits])=>{
    const frag=document.createDocumentFragment();const v=node.nodeValue;let last=0;
    hits.forEach(([at,w])=>{
      if(at>last)frag.appendChild(document.createTextNode(v.slice(last,at)));
      const sp=document.createElement("span");sp.className="spellerr";sp.textContent=w;
      frag.appendChild(sp);last=at+w.length;
    });
    frag.appendChild(document.createTextNode(v.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
  spellHits=[...ed.querySelectorAll(".spellerr")];
  if(spellIdx>=spellHits.length)spellIdx=Math.max(0,spellHits.length-1);
  return spellHits.length;
}
/* Genug Text links und rechts, um die Stelle wiederzuerkennen, aber nie so
   viel, dass der Dialog wächst. Angeschnitten wird an der Wortgrenze. */
function spellContext(el){
  const block=el.closest("p,h1,h2,h3,h4,h5,h6,li,td,th,blockquote")||el.parentElement;
  const word=el.textContent||"";
  if(!block)return{pre:"",word,post:""};
  const txt=block.textContent||"";
  let off=0,n,found=false;
  const w=document.createTreeWalker(block,NodeFilter.SHOW_TEXT);
  while(n=w.nextNode()){if(el.contains(n)){found=true;break}off+=n.nodeValue.length}
  if(!found)return{pre:"",word,post:""};
  const a=Math.max(0,off-58),b=Math.min(txt.length,off+word.length+58);
  let pre=txt.slice(a,off),post=txt.slice(off+word.length,b);
  if(a>0){const s=pre.indexOf(" ");pre="…"+(s>=0?pre.slice(s):pre)}
  if(b<txt.length){const s=post.lastIndexOf(" ");post=(s>=0?post.slice(0,s):post)+"…"}
  return{pre,word,post};
}
function spellFocus(){
  spellHits.forEach((h,i)=>h.classList.toggle("cur",i===spellIdx));

  if(cur)cur.scrollIntoView({block:"center",behavior:"auto"});

function spellCurrentWord(){

}
