/* ---- Glossar importieren ----
   Fremde Tabellen kommen mit Semikolon, Komma oder Tabulator; das Trennzeichen
   wird aus der Kopfzeile geraten. Anführungszeichen nach RFC 4180. */
function parseCsv(text){
  text=text.replace(/^\uFEFF/,"");
  const erste=text.split(/\r?\n/)[0]||"";
  const ausserhalb=(zeile,z)=>{let n=0,q=false;
    for(let i=0;i<zeile.length;i++){const ch=zeile[i];
      if(ch==='"')q=!q;else if(ch===z&&!q)n++}
    return n};
  const sep=[";","\t",","].map(z=>[z,ausserhalb(erste,z)]).sort((a,b)=>b[1]-a[1])[0][0];
  const zeilen=[];let feld="",zeile=[],inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){if(text[i+1]==='"'){feld+='"';i++}else inQ=false}
      else feld+=ch;
    }else if(ch==='"')inQ=true;
    else if(ch===sep){zeile.push(feld);feld=""}
    else if(ch==="\n"){zeile.push(feld);zeilen.push(zeile);zeile=[];feld=""}
    else if(ch!=="\r")feld+=ch;
  }
  if(feld||zeile.length){zeile.push(feld);zeilen.push(zeile)}
  return zeilen.filter(r=>r.some(c=>c.trim()));
}
function begriffeAusDatei(name,raw){
  const ext=(String(name).match(/\.([a-z0-9]+)$/i)||[,""])[1].toLowerCase();
  if(ext==="json"){
    let b;try{b=JSON.parse(raw)}catch(e){return null}
    const arr=Array.isArray(b)?b:(b&&b.glossary)||[];
    return arr.filter(g=>g&&g.term).map(g=>({term:String(g.term),def:String(g.def||""),cat:String(g.cat||"")}));
  }
  const rows=parseCsv(raw);
  if(!rows.length)return [];
  /* Kopfzeile weglassen, wenn die erste Zelle wie eine Überschrift aussieht */
  const kopf=["begriff","term","wort","stichwort","name","eintrag","entry"];
  if(rows[0][0]&&kopf.includes(rows[0][0].trim().toLowerCase()))rows.shift();
  return rows.filter(r=>r[0]&&r[0].trim())
    .map(r=>({term:r[0].trim().slice(0,120),def:(r[1]||"").trim(),cat:(r[2]||"").trim()}));
}

function importGloss(dateiname,liste,ziel){
  let zielId=curGView();
  if(ziel==="neu"){
    zielId=uid();
    S.glossaries.push({id:zielId,
      name:String(dateiname).replace(/\.[^.]+$/,"").slice(0,40)||tr("Neues Glossar")});
  }
  /* Begriffe, die im Ziel schon stehen, nicht doppeln */
  const da=new Set(S.glossary.filter(g=>g.gid===zielId).map(g=>g.term.toLowerCase()));
  let neu=0,doppelt=0;
  liste.forEach(e=>{
    const k=e.term.toLowerCase();
    if(da.has(k)){doppelt++;return}
    da.add(k);
    S.glossary.push({id:uid(),term:e.term,def:e.def,cat:e.cat,gid:zielId,
      created:Date.now(),updated:Date.now()});
    neu++;
  });
  setGView(zielId);
  closeOvl();commit();render();
  const teile=[neu+" "+tr(neu===1?"Eintrag":"Einträge")+" "+tr("hinzugefügt")];
  if(doppelt)teile.push(doppelt+" "+tr("schon vorhanden"));
  toast(teile.join(", "));
}

function fuzzy(q,s){
  s=s.toLowerCase();q=q.toLowerCase();
  if(!q)return 0;
  const i=s.indexOf(q);if(i>=0)return 100-i;
  let p=0;for(const ch of q){p=s.indexOf(ch,p);if(p<0)return -1;p++}
  return 10;
}
function palette(){
  overlay(`<div class="modal"><h3>${tr("Befehl oder Suche")}</h3>
    <div class="pad" style="padding-bottom:9px"><input id="pq" placeholder="${tr("Tippen, um zu filtern")}" autocomplete="off"></div>
    <div class="cmdlist" id="pl"></div></div>`);
  const all=commandList();let hits=[],idx=0;
  const q=$("#pq"),l=$("#pl");
  const paint=()=>{
    const v=q.value.trim();
    hits=(v?all.map(c=>({c,s:fuzzy(v,c.label+" "+c.grp)})).filter(x=>x.s>=0)
            .sort((a,b)=>b.s-a.s).map(x=>x.c):all).slice(0,40);
    idx=Math.min(idx,Math.max(0,hits.length-1));
    l.innerHTML=hits.length?hits.map((c,i)=>
      `<div class="cmd ${i===idx?"on":""}" data-i="${i}">
        <span class="grp">${c.grp}</span><span class="lab">${esc(c.label)}</span>

    const on=l.querySelector(".cmd.on");if(on)on.scrollIntoView({block:"nearest"})};
  const go=()=>{const c=hits[idx];if(!c)return;closeOvl();c.run()};
  q.oninput=()=>{idx=0;paint()};
  q.onkeydown=e=>{
    if(e.key==="ArrowDown"){e.preventDefault();idx=Math.min(idx+1,hits.length-1);paint()}
    else if(e.key==="ArrowUp"){e.preventDefault();idx=Math.max(idx-1,0);paint()}
    else if(e.key==="Enter"){e.preventDefault();go()}};
  l.onclick=e=>{const r=e.target.closest(".cmd");if(!r)return;idx=+r.dataset.i;go()};
  paint();q.focus();
}

function exportMd(){
  flush();const d=doc();const t=document.createElement("div");t.innerHTML=d.html||"";
  let out="";
  t.childNodes.forEach(n=>{
    if(n.nodeType===3){out+=n.textContent+"\n\n";return}
    const tag=(n.tagName||"").toLowerCase(),tx=(n.innerText||"").trim();
    if(!tx&&tag!=="br")return;
    if(tag==="h1")out+="# "+tx+"\n\n";
    else if(tag==="h2")out+="## "+tx+"\n\n";
    else if(tag==="h3")out+="### "+tx+"\n\n";
    else if(tag==="ul")n.querySelectorAll("li").forEach(li=>out+="- "+li.innerText.trim()+"\n"),out+="\n";
    else if(tag==="ol"){let i=1;n.querySelectorAll("li").forEach(li=>out+=(i++)+". "+li.innerText.trim()+"\n");out+="\n"}
    else out+=tx+"\n\n"});
  download(d.title+".md",out.trim()+"\n","text/markdown");
}

/* ---- Fremde Dokumente laden ----
   Liest Text, Markdown und HTML. Unsere eigenen .doc-Exporte sind HTML und
   kommen damit ebenfalls zurück; echte Word-Dateien sind Binärformate. */
function textToHtml(t){
  return String(t).replace(/\r\n?/g,"\n").split(/\n{2,}/)
    .map(p=>p.trim()).filter(Boolean)
    .map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("")||"<p><br></p>";
}
function mdToHtml(src){
  const inline=s=>esc(s)
    .replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g,'<img src="$2" alt="$1" style="width:70%">')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<i>$2</i>")
    .replace(/(^|[\s(])_([^_\n]+)_/g,"$1<i>$2</i>");
  let out="",liste=null,absatz=[];
  const listeZu=()=>{if(liste){out+="</"+liste+">";liste=null}};
  const absatzZu=()=>{if(absatz.length){out+="<p>"+inline(absatz.join(" "))+"</p>";absatz=[]}};
  String(src).replace(/\r\n?/g,"\n").split("\n").forEach(zeile=>{
    const l=zeile.trimEnd();let m;
    if(!l.trim()){absatzZu();listeZu();return}
    if(m=/^(#{1,3})\s+(.*)$/.exec(l)){absatzZu();listeZu();
      out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;return}
    if(/^\s*(---+|\*\*\*+|___+)\s*$/.test(l)){absatzZu();listeZu();
      out+='<div class="pgbreak" contenteditable="false" data-label="'+esc(tr("Seitenumbruch"))+'"></div>';return}
    if(m=/^\s*[-*+]\s+(.*)$/.exec(l)){absatzZu();
      if(liste!=="ul"){listeZu();out+="<ul>";liste="ul"}out+="<li>"+inline(m[1])+"</li>";return}
    if(m=/^\s*\d+[.)]\s+(.*)$/.exec(l)){absatzZu();
      if(liste!=="ol"){listeZu();out+="<ol>";liste="ol"}out+="<li>"+inline(m[1])+"</li>";return}
    listeZu();absatz.push(l.trim());
  });
  absatzZu();listeZu();
  return out||"<p><br></p>";
}
function cleanHtml(src){
  const body=new DOMParser().parseFromString(String(src),"text/html").body;
  body.querySelectorAll("script,style,link,meta,base,title,iframe,object,embed,noscript,form,input,button,select,textarea")
    .forEach(n=>n.remove());
  const erlaubt=new Set(["href","src","alt","style","class","colspan","rowspan","data-w","data-label","data-n","contenteditable"]);
  body.querySelectorAll("*").forEach(el=>{
    [...el.attributes].forEach(a=>{
      const n=a.name.toLowerCase(),v=String(a.value||"");
      if(!erlaubt.has(n)||n.startsWith("on")){el.removeAttribute(a.name);return}
      if(/javascript:/i.test(v))el.removeAttribute(a.name);
    });
    if(el.tagName==="A"&&el.getAttribute("href")){
      el.setAttribute("target","_blank");el.setAttribute("rel","noopener");
    }
  });
  /* Unsere HTML-Exporte legen den Text in einen Gestaltungs-Container.
     Bliebe der stehen, wäre das ganze Dokument ein einziger Block und der
     Seitenumbruch könnte nicht mehr zwischen Absätzen trennen. */
  let w=body.firstElementChild;
  while(body.children.length===1&&w&&w.tagName==="DIV"&&!w.className&&w.children.length){
    while(w.firstChild)body.insertBefore(w.firstChild,w);
    body.removeChild(w);w=body.firstElementChild;
  }
  return body.innerHTML.trim()||"<p><br></p>";
}
/* ZIP (.docx/.odt) und OLE (.doc) sind Binärformate und lassen sich hier nicht lesen */
function looksBinary(s){
  const kopf=String(s).slice(0,400);
  if(kopf.startsWith("PK"))return true;
  let seltsam=0;
  for(let i=0;i<kopf.length;i++){const c=kopf.charCodeAt(i);if(c===0||c===0xFFFD)seltsam++}
  return seltsam>kopf.length*0.05;
}
function loadDocumentFile(){
  const i=document.createElement("input");
  i.type="file";i.multiple=true;
  i.accept=".txt,.text,.md,.markdown,.html,.htm,.doc,.docx,.odt,.rtf";
  i.onchange=async()=>{
    const dateien=[...i.files];if(!dateien.length)return;
    let geladen=0,abgelehnt=0;
    for(const f of dateien){
      const ext=(f.name.match(/\.([a-z0-9]+)$/i)||[,""])[1].toLowerCase();
      try{
        if(ZIPFORMATE.includes(ext)){
          const html=await zipDokument(f.name,await f.arrayBuffer());
          if(neuesDokumentAus(f.name,html))geladen++;else abgelehnt++;
        }else{
          if(importDocumentText(f.name,await f.text()))geladen++;else abgelehnt++;
        }
      }catch(e){abgelehnt++}
    }
    if(geladen)toast(geladen===1?tr("Dokument geladen"):geladen+" "+tr("Dokumente")+" "+tr("geladen"));
    else if(abgelehnt)toast(tr("Diese Datei ließ sich nicht lesen"));
  };
  i.click();
}

function neuesDokumentAus(name,html){
  if(!html)return false;
  flush();
  const d=blankDoc(String(name).replace(/\.[^.]+$/,"").slice(0,60));
  d.customTitle=true;           /* Dateiname als Titel behalten */
  d.html=html;
  d.glossaryId=defaultGlossId();
  S.docs.push(d);S.active=d.id;
  save();render();
  return true;
}
function importDocumentText(name,raw){
  if(looksBinary(raw))return false;
  const ext=(String(name).match(/\.([a-z0-9]+)$/i)||[,""])[1].toLowerCase();
  let html;
  if(ext==="md"||ext==="markdown")html=mdToHtml(raw);
  else if(ext==="rtf"||/^\s*\{\\rtf/i.test(raw))html=rtfToHtml(raw);
  else if(["html","htm","doc"].includes(ext)||/^\s*<(!doctype|html|meta|body|div|p|h[1-6])\b/i.test(raw))html=cleanHtml(raw);
  else html=textToHtml(raw);
  return neuesDokumentAus(name,html);
}
/* RTF ist reiner Text mit Steuerworten. Absätze, Auszeichnungen und
   Sonderzeichen decken ab, was Textverarbeitungen üblicherweise ausgeben. */
function rtfToHtml(raw){
  let t=String(raw);
  t=t.replace(/\\'([0-9a-f]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)));
  t=t.replace(/\\u(-?\d+)\??/g,(m,n)=>String.fromCharCode(+n<0?+n+65536:+n));
  /* Gruppen, die nicht in den Text gehören */
  t=t.replace(/\{\\\*[^{}]*\}/g,"");
  t=t.replace(/\{\\(?:fonttbl|colortbl|stylesheet|info|generator)[^{}]*(?:\{[^{}]*\}[^{}]*)*\}/gi,"");
  const marken=[];
  t=t.replace(/\\(par|line|b0|b|i0|i|ul0|ulnone|ul|strike0|strike)\b ?/g,(m,w)=>{
    marken.push(w);return "\u0000"+(marken.length-1)+"\u0000"});
  t=t.replace(/\\[a-z]+-?\d* ?/gi,"");     /* übrige Steuerworte */
  t=t.replace(/[{}]/g,"");
  let out="",offen=[],absatz="";
  const zu=()=>{while(offen.length)absatz+="</"+offen.pop()+">"};
  const auf=tag=>{if(!offen.includes(tag)){absatz+="<"+tag+">";offen.push(tag)}};
  const ab=tag=>{const k=offen.indexOf(tag);if(k<0)return;
    for(let j=offen.length-1;j>=k;j--)absatz+="</"+offen[j]+">";
    const wieder=offen.slice(k+1);offen=offen.slice(0,k);
    wieder.forEach(x=>{absatz+="<"+x+">";offen.push(x)})};
  t.split(/\u0000(\d+)\u0000/).forEach((teil,idx)=>{
    if(idx%2===1){
      const w=marken[+teil];
      if(w==="par"){zu();out+="<p>"+(absatz.trim()||"<br>")+"</p>";absatz=""}
      else if(w==="line")absatz+="<br>";
      else if(w==="b")auf("b"); else if(w==="b0")ab("b");
      else if(w==="i")auf("i"); else if(w==="i0")ab("i");
      else if(w==="ul")auf("u"); else if(w==="ul0"||w==="ulnone")ab("u");
      else if(w==="strike")auf("s"); else if(w==="strike0")ab("s");
      return;
    }
    absatz+=esc(teil.replace(/\r?\n/g,""));
  });
  zu();
  if(absatz.trim())out+="<p>"+absatz+"</p>";
  return out||null;
}

/* ---- .docx und .odt ----
   Beide sind ZIP-Archive. Browser können seit 2023 selbst entpacken
   (DecompressionStream), deshalb braucht es dafür keine Fremdbibliothek. */
const ZIPFORMATE=["docx","odt"];
async function zipEintrag(buf,name){
  const dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder();
  /* Zentrales Verzeichnis steht am Dateiende, Signatur rückwärts suchen */
  let eocd=-1;
  for(let i=u8.length-22;i>=0&&i>u8.length-65558;i--)
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)return null;
  const anzahl=dv.getUint16(eocd+10,true);
  let q=dv.getUint32(eocd+16,true);
  for(let k=0;k<anzahl;k++){
    if(q+46>u8.length||dv.getUint32(q,true)!==0x02014b50)return null;
    const methode=dv.getUint16(q+10,true);
    const komp=dv.getUint32(q+20,true);
    const nlen=dv.getUint16(q+28,true);
    const elen=dv.getUint16(q+30,true);
    const clen=dv.getUint16(q+32,true);
    const lokal=dv.getUint32(q+42,true);
    if(dec.decode(u8.subarray(q+46,q+46+nlen))===name){
      const ln=dv.getUint16(lokal+26,true),le=dv.getUint16(lokal+28,true);
      const start=lokal+30+ln+le;
      const daten=u8.subarray(start,start+komp);
      if(methode===0)return dec.decode(daten);
      if(methode!==8||typeof DecompressionStream!=="function")return null;
      const strom=new Blob([daten]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return dec.decode(await new Response(strom).arrayBuffer());
    }
    q+=46+nlen+elen+clen;
  }
  return null;
}
const xesc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const xattr=(el,n)=>el.getAttribute("w:"+n)||el.getAttribute(n)||
  el.getAttributeNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main",n);

/* --- Word --- */
function docxLauf(p){
  let out="";
  [...p.children].forEach(el=>{
    if(el.localName==="hyperlink"){out+=docxLauf(el);return}
    if(el.localName!=="r")return;
    let t="";
    [...el.children].forEach(c=>{
      if(c.localName==="t")t+=xesc(c.textContent);
      else if(c.localName==="br")t+="<br>";
      else if(c.localName==="tab")t+=" ";
    });
    if(!t)return;
    const pr=[...el.children].find(c=>c.localName==="rPr");
    if(pr){
      const an=n=>{const e=[...pr.children].find(c=>c.localName===n);
        if(!e)return false;const v=xattr(e,"val");return v!=="0"&&v!=="false"};
      if(an("b"))t="<b>"+t+"</b>";
      if(an("i"))t="<i>"+t+"</i>";
      if(an("u"))t="<u>"+t+"</u>";
      if(an("strike"))t="<s>"+t+"</s>";
    }
    out+=t;
  });
  return out;
}
function docxToHtml(xml){
  const dom=new DOMParser().parseFromString(xml,"application/xml");
  if(dom.querySelector("parsererror"))return null;
  const body=[...dom.documentElement.children].find(e=>e.localName==="body");
  if(!body)return null;
  let out="",liste=false;
  const zu=()=>{if(liste){out+="</ul>";liste=false}};
  const absatz=p=>{
    const pr=[...p.children].find(c=>c.localName==="pPr");
    const stil=pr&&[...pr.children].find(c=>c.localName==="pStyle");
    const nummer=pr&&[...pr.children].some(c=>c.localName==="numPr");
    const name=stil?String(xattr(stil,"val")||""):"";
    /* Word beschriftet Überschriften je nach Sprache anders */
    const h=name.match(/^(?:Heading|berschrift|Titre|Ttulo)\s*([1-6])/i);
    const inhalt=docxLauf(p);
    if(nummer){if(!liste){out+="<ul>";liste=true}out+="<li>"+(inhalt||"<br>")+"</li>";return}
    zu();
    if(h)out+="<h"+Math.min(3,+h[1])+">"+(inhalt||"<br>")+"</h"+Math.min(3,+h[1])+">";
    else out+="<p>"+(inhalt||"<br>")+"</p>";
  };
  const tabelle=t=>{
    zu();
    let r="<table>";
    [...t.children].filter(x=>x.localName==="tr").forEach(tr=>{
      r+="<tr>";
      [...tr.children].filter(x=>x.localName==="tc").forEach(tc=>{
        const inner=[...tc.children].filter(x=>x.localName==="p").map(docxLauf).join("<br>");
        r+="<td>"+(inner||"&nbsp;")+"</td>";
      });
      r+="</tr>";
    });
    out+=r+"</table>";
  };
  [...body.children].forEach(el=>{
    if(el.localName==="p")absatz(el);
    else if(el.localName==="tbl")tabelle(el);
  });
  zu();
  return out||null;
}

/* --- OpenDocument (LibreOffice) --- */
function odtToHtml(xml){
  const dom=new DOMParser().parseFromString(xml,"application/xml");
  if(dom.querySelector("parsererror"))return null;
  /* Auszeichnungen stecken in den automatischen Formatvorlagen */
  const stile={};
  [...dom.getElementsByTagName("*")].forEach(el=>{
    if(el.localName!=="style")return;
    const n=el.getAttribute("style:name");if(!n)return;
    const tp=[...el.children].find(c=>c.localName==="text-properties");if(!tp)return;
    stile[n]={
      b:/bold/i.test(tp.getAttribute("fo:font-weight")||""),
      i:/italic|oblique/i.test(tp.getAttribute("fo:font-style")||""),
      u:!!(tp.getAttribute("style:text-underline-style")||"").replace(/none/i,""),
      s:!!(tp.getAttribute("style:text-line-through-style")||"").replace(/none/i,"")
    };
  });
  const inhalt=[...dom.getElementsByTagName("*")].find(e=>e.localName==="text"&&
    e.parentElement&&e.parentElement.localName==="body");
  if(!inhalt)return null;
  const lauf=el=>{
    let t="";
    [...el.childNodes].forEach(k=>{
      if(k.nodeType===3){t+=xesc(k.nodeValue);return}
      if(k.nodeType!==1)return;
      if(k.localName==="line-break"){t+="<br>";return}
      if(k.localName==="s"){t+=" ";return}
      if(k.localName==="tab"){t+=" ";return}
      let s=lauf(k);
      if(k.localName==="span"){
        const st=stile[k.getAttribute("text:style-name")];
        if(st){if(st.b)s="<b>"+s+"</b>";if(st.i)s="<i>"+s+"</i>";
               if(st.u)s="<u>"+s+"</u>";if(st.s)s="<s>"+s+"</s>"}
      }
      t+=s;
    });
    return t;
  };
  let out="";
  const block=el=>{
    if(el.localName==="h"){
      const n=Math.min(3,+(el.getAttribute("text:outline-level")||1));
      out+="<h"+n+">"+(lauf(el)||"<br>")+"</h"+n+">";
    } else if(el.localName==="p"){
      out+="<p>"+(lauf(el)||"<br>")+"</p>";
    } else if(el.localName==="list"){
      out+="<ul>";
      [...el.children].filter(x=>x.localName==="list-item").forEach(li=>{
        out+="<li>"+[...li.children].map(lauf).join(" ")+"</li>"});
      out+="</ul>";
    } else if(el.localName==="table"){
      out+="<table>";
      [...el.children].filter(x=>x.localName==="table-row").forEach(tr=>{
        out+="<tr>";
        [...tr.children].filter(x=>x.localName==="table-cell").forEach(tc=>{
          out+="<td>"+([...tc.children].map(lauf).join("<br>")||"&nbsp;")+"</td>"});
        out+="</tr>"});
      out+="</table>";
    }
  };
  [...inhalt.children].forEach(block);
  return out||null;
}
async function zipDokument(name,buf){
  const ext=(String(name).match(/\.([a-z0-9]+)$/i)||[,""])[1].toLowerCase();
  try{
    if(ext==="docx"){
      const xml=await zipEintrag(buf,"word/document.xml");
      return xml?docxToHtml(xml):null;
    }
    const xml=await zipEintrag(buf,"content.xml");
    return xml?odtToHtml(xml):null;
  }catch(e){return null}
}

const PQW=1;
const safeName=s=>String(s||"").replace(/[\\/:*?"<>|\n]/g,"-").trim().slice(0,60)||"PureQuill";
function notesOfDoc(d){

function saveBundle(kind){
  flush();

  let b,name;
  if(kind==="doc"){
    const d=doc();
    b={pqw:PQW,kind,saved:new Date().toISOString(),docs:[d],notes:notesOfDoc(d)};
    name=safeName(tr(d.title))+" + "+tr("Notizen")+" "+stamp+".json";
  }else if(kind==="notes"){
    b={pqw:PQW,kind,saved:new Date().toISOString(),notes:S.notes,glossary:S.glossary,glossaries:S.glossaries};
    name=tr("Notizen und Glossar")+" "+stamp+".json";
  }else{
    b=Object.assign({pqw:PQW,kind:"all",saved:new Date().toISOString()},JSON.parse(JSON.stringify(S)));
    name="PureQuill "+tr("Vollsicherung")+" "+stamp+".json";

function importJson(){
  const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{let b;
      try{b=JSON.parse(r.result)}catch(e){toast(tr("Datei nicht lesbar"));return}
      applyBundle(b)};
    r.readAsText(f)};i.click();
}
function applyBundle(b){
  if(!b||typeof b!=="object"||Array.isArray(b)){toast(tr("Diese Datei passt nicht zu PureQuill Writer"));return}
  /* Ältere Sicherungen tragen keine Kennung, enthalten aber den kompletten Bestand */
  const kind=b.kind||((b.docs&&b.settings)?"all":null);
  if(!kind){toast(tr("Diese Datei passt nicht zu PureQuill Writer"));return}
  if(kind==="all"){
    confirmReplace(()=>{
      const neu={...b};delete neu.pqw;delete neu.kind;delete neu.saved;
      S=neu;
      ensureGlossaries();
      lockedOvl=false;closeOvl();
      save();applyTheme();applyStaticLabels();render();toast(tr("Geladen"));
    });
    return;
  }
  let nD=0,nN=0,nG=0;
  const nIds=new Set(S.notes.map(n=>n.id));
  (b.notes||[]).forEach(n=>{if(n&&n.id&&!nIds.has(n.id)){S.notes.push(n);nIds.add(n.id);nN++}});
  const cIds=new Set(S.glossaries.map(c=>c.id));
  (b.glossaries||[]).forEach(c=>{if(c&&c.id&&!cIds.has(c.id)){S.glossaries.push(c);cIds.add(c.id)}});
  const gIds=new Set(S.glossary.map(g=>g.id));
  (b.glossary||[]).forEach(g=>{if(g&&g.id&&!gIds.has(g.id)){S.glossary.push(g);gIds.add(g.id);nG++}});
  const dIds=new Set(S.docs.map(d=>d.id));
  (b.docs||[]).forEach(d=>{
    if(!d)return;
    if(dIds.has(d.id))d.id=uid();      /* schon vorhanden: als Kopie einfügen */
    dIds.add(d.id);S.docs.push(d);S.active=d.id;nD++;
  });
  ensureGlossaries();
  lockedOvl=false;closeOvl();
  save();applyTheme();applyStaticLabels();render();
  const teile=[];
  if(nD)teile.push(nD===1?tr("ein Dokument"):nD+" "+tr("Dokumente"));
  if(nN)teile.push(nN+" "+tr(nN===1?"Notiz":"Notizen"));
  if(nG)teile.push(nG+" "+tr(nG===1?"Glossareintrag":"Glossareinträge"));
  toast(teile.length?tr("Hinzugefügt")+": "+teile.join(", "):tr("Nichts Neues in dieser Datei"));
}

    if(a==="fit"){S.fitPage=true;save();closeMenu();if(S.mode==="write"){fitZoom();render()}return}
    if(a==="focus"){closeMenu();document.body.classList.toggle("focus");return}
    if(stay){closeMenu();viewMenu()}
  };
}

/* ================= Seitenumbruch ================= */
const GAP=20;
let pgTimer=null,pageCount=1;
function queuePaginate(){clearTimeout(pgTimer);pgTimer=setTimeout(()=>{paginate();drawAnchors()},220)}
function paginate(){
  const ed=$("#editor"),paper=$("#paper"),layer=$("#pagelayer");
  if(!ed||!paper)return;
  const f=fmtOf(doc()),z=S.zoom;
  const pw=MM(f.w)*z, ph=MM(f.h)*z;
  const mr=MM(f.m[1])*z, ml=MM(f.m[3])*z;
  /* Der Textkörper beginnt am Rand — oder unterhalb der Kopfzeile, falls die
     tiefer reicht. Vorher konnten sich beide überlagern. */
  const mt=Math.max(MM(f.m[0])*z, hfBand(doc(),"hdr",z));
  const mb=Math.max(MM(f.m[2])*z, hfBand(doc(),"ftr",z));
  const contentH=Math.max(60,ph-mt-mb), stride=ph+GAP;
  paper.style.width=pw+"px";
  ed.style.padding=`${mt}px ${mr}px ${mb}px ${ml}px`;
  ed.style.setProperty("--pl",ml+"px");
  ed.style.setProperty("--pt",mt+"px");

  const blocks=[...ed.children];
  blocks.forEach(b=>{b.style.marginTop="";if(b.classList.contains("pgbreak"))b.style.height=""});
  const edTop=ed.getBoundingClientRect().top;
  blocks.forEach(b=>{
    const r=b.getBoundingClientRect();
    const top=r.top-edTop, h=r.height;
    const p=Math.max(0,Math.floor(top/stride));
    if(b.classList.contains("pgbreak")){
      const nextStart=(p+1)*stride+mt;
      b.style.height=Math.max(14,nextStart-top-1)+"px";
      return;
    }
    const limit=p*stride+mt+contentH;
    if(top+h>limit+1&&h<=contentH){
      const base=parseFloat(getComputedStyle(b).marginTop)||0;
      b.style.marginTop=(base+((p+1)*stride+mt-top))+"px";
    }
  });
  const last=blocks.length?blocks[blocks.length-1].getBoundingClientRect():null;
  const bottom=last?last.bottom-edTop:0;
  pageCount=Math.max(1,Math.ceil((bottom+mb)/stride));
  if(bottom+mb>pageCount*stride-GAP)pageCount++;
  ed.style.minHeight=(pageCount*stride-GAP)+"px";
  paper.style.height=(pageCount*stride-GAP)+"px";

  let html="";
  const ftrOn=hfOf(doc(),"ftr").on;
  for(let i=0;i<pageCount;i++){
    html+=`<div class="sheetpage" style="top:${i*stride}px;height:${ph}px">
      ${S.guides?`<div class="mg" style="left:${ml}px"></div><div class="mg" style="right:${mr}px;left:auto"></div>`:""}
      ${hfHtml(i,pageCount,ml,mr,z)}
      ${(S.pagenum!==false&&!ftrOn)?`<div class="pn">${i+1}</div>`:""}
    </div>`;
  }
  layer.innerHTML=html;
  drawRuler();
  drawStatus();
}

let typTimer=null,flagTimer=null;
function setTyping(){
  if(!S.settings.dimUi)return;
  document.body.classList.add("typing");
  clearTimeout(typTimer);typTimer=setTimeout(()=>document.body.classList.remove("typing"),4500);

function typewriter(){
  if(S.settings.typewriter===false)return;
  const sh=$("#sheet"),sel=getSelection();
  if(!sh||!sel.rangeCount)return;
  const r=sel.getRangeAt(0).cloneRange();
  let box=r.getBoundingClientRect();
  if(!box.height){
    const el=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;
    if(!el)return;box=el.getBoundingClientRect();
  }
  if(!box.height)return;
  const target=sh.getBoundingClientRect().top+sh.clientHeight*0.42;
  const delta=box.top-target;
  if(Math.abs(delta)>3)sh.scrollTop+=delta;
}

function pageFlag(){
  const sh=$("#sheet"),fl=$("#pageflag");if(!sh||!fl)return;
  const f=fmtOf(doc()),stride=MM(f.h)*S.zoom+GAP;
  const p=Math.min(pageCount,Math.max(1,Math.floor((sh.scrollTop+sh.clientHeight*.4)/stride)+1));

function drawRuler(){
  const r=$("#ruler");if(!r)return;
  if(!S.guides){r.style.display="none";return}
  r.style.display="block";
  const f=fmtOf(doc()),z=S.zoom;
  const pw=MM(f.w)*z, ml=MM(f.m[3])*z, mr=MM(f.m[1])*z;
  r.style.width=pw+"px";
  let t="";
  for(let mm=0;mm<=f.w;mm+=5){
    const x=MM(mm)*z;
    t+=`<div class="tick ${mm%10===0?"big":""}" style="left:${x}px"></div>`;
  }
  t+=`<div class="zone" style="left:0;width:${ml}px"></div>
      <div class="zone" style="right:0;width:${mr}px"></div>
      <div class="hand" data-h="l" style="left:${ml}px" title="${tr("Linker Rand")}"></div>
      <div class="hand" data-h="r" style="left:${pw-mr}px" title="${tr("Rechter Rand")}"></div>
      <div class="rulertip" id="rtip"></div>`;
  r.innerHTML=t;
  r.querySelectorAll(".hand").forEach(h=>h.onmousedown=e=>{
    e.preventDefault();h.classList.add("drag");
    const side=h.dataset.h,rect=r.getBoundingClientRect(),tip=$("#rtip");
    tip.style.display="block";
    const move=ev=>{
      let x=Math.min(rect.width,Math.max(0,ev.clientX-rect.left));
      let mm=Math.round(x/(MM(1)*z));
      const fmt=fmtOf(doc());
      if(side==="l")mm=Math.min(mm,fmt.w-fmt.m[1]-20);
      else mm=Math.min(fmt.w-mm,fmt.w-fmt.m[3]-20);
      mm=Math.max(0,mm);
      const val=typeof doc().fmt==="object"?doc().fmt:{...fmt};
      val.m=[...fmt.m];val.m[side==="l"?3:1]=mm;
      doc().fmt=val;
      tip.textContent=mm+" mm";
      tip.style.left=(side==="l"?MM(mm)*z:MM(fmt.w-mm)*z)+"px";
      drawRuler();paginate();
      const nh=$("#ruler").querySelector(`[data-h="${side}"]`);if(nh)nh.classList.add("drag");
      $("#rtip").style.display="block";$("#rtip").textContent=mm+" mm";
      $("#rtip").style.left=tip.style.left;
    };
    const up=()=>{document.removeEventListener("mousemove",move);
      document.removeEventListener("mouseup",up);
      const tp=$("#rtip");if(tp)tp.style.display="none";
      commit();drawAnchors()};
    document.addEventListener("mousemove",move);
    document.addEventListener("mouseup",up);
  });
}

const HF_DEF={hdr:{on:false,text:"{titel}",align:"center"},
              ftr:{on:false,text:"Seite {seite} von {seiten}",align:"center"}};
function hfOf(d,which){return {...HF_DEF[which],...(d[which]||{})}}
function hfText(tpl,page,total,forPrint){
  const t=esc(tpl||"")
    .replace(/\{titel\}/gi,esc(doc().title||""))
    .replace(/\{datum\}/gi,new Date().toLocaleDateString(LOC()))
    .replace(/\{seiten\}/gi,String(total));

    ? t.replace(/\{seite\}/gi,'<span class="pageno"></span>')
    : t.replace(/\{seite\}/gi,String(page));

/* ---- Direktbearbeitung auf der Seite ---- */
let hfEditing=null;
function hfZoneAt(clientY){
  const paper=$("#paper");if(!paper||S.mode!=="write")return null;
  const f=fmtOf(doc()),z=S.zoom;
  const ph=MM(f.h)*z,mt=MM(f.m[0])*z,mb=MM(f.m[2])*z,stride=ph+GAP;
  const y=clientY-paper.getBoundingClientRect().top;
  if(y<0)return null;
  const page=Math.floor(y/stride);
  if(page<0||page>=pageCount)return null;
  const yp=y-page*stride;
  if(yp<0||yp>ph)return null;
  if(yp<mt)return{which:"hdr",page};
  if(yp>ph-mb)return{which:"ftr",page};
  return null;
}
function hfRect(which,page){
  const f=fmtOf(doc()),z=S.zoom;
  const ph=MM(f.h)*z,stride=ph+GAP;
  const fs=(9*96/72)*z;
  const zeilen=String(hfOf(doc(),which).text||"").split("\n").length;
  const h=Math.max(fs*1.35*zeilen,16);
  const d=MM(which==="hdr"?f.hd:f.fd)*z;
  return {top:which==="hdr"?page*stride+d:page*stride+ph-d-h,
    left:MM(f.m[3])*z,right:MM(f.m[1])*z,h,fs};
}
function hfHintAt(clientY){
  const hint=$("#hfhint");if(!hint)return;
  if(hfEditing){hint.classList.remove("on");return}
  const zone=hfZoneAt(clientY);
  if(!zone){hint.classList.remove("on");return}
  const r=hfRect(zone.which,zone.page),on=hfOf(doc(),zone.which).on;
  hint.style.cssText=`top:${r.top}px;left:${r.left}px;right:${r.right}px;height:${r.h}px`;
  hint.textContent=on?"":tr(zone.which==="hdr"?"Doppelklick: Kopfzeile":"Doppelklick: Fußzeile");
  hint.classList.add("on");
}
function hfEditOpen(which,page){
  const d=doc();
  if(!hfOf(d,which).on){d[which]={...hfOf(d,which),on:true};commit();paginate();setPrintHF()}
  const box=$("#hfedit");if(!box)return;
  hfEditing={which,page};
  const v=hfOf(d,which),r=hfRect(which,page);
  box.style.cssText=`top:${r.top}px;left:${r.left}px;right:${r.right}px;`+
    `min-height:${r.h}px;font-size:${r.fs}px;text-align:${v.align}`;
  box.textContent=v.text||"";
  box.classList.add("on");
  $("#hfhint").classList.remove("on");
  box.focus();
  const rg=document.createRange();rg.selectNodeContents(box);
  const s=getSelection();s.removeAllRanges();s.addRange(rg);
  placeHfGrip();
  drawHfBar();
}
/* Der Griff liegt auf der Grenze zwischen Kopf-/Fußzeilenband und Textkörper —
   also dort, wo der Text beginnt. Ihn zu ziehen ändert die Höhe des Bandes. */
function placeHfGrip(){
  const grip=$("#hfgrip");
  if(!hfEditing||!grip){if(grip)grip.classList.remove("on");return}
  const d=doc(),f=fmtOf(d),z=S.zoom;
  const ph=MM(f.h)*z,stride=ph+GAP,pg=hfEditing.page;
  const mt=Math.max(MM(f.m[0])*z,hfBand(d,"hdr",z));
  const mb=Math.max(MM(f.m[2])*z,hfBand(d,"ftr",z));
  const y=hfEditing.which==="hdr"?pg*stride+mt:pg*stride+ph-mb;
  grip.style.left=MM(f.m[3])*z+"px";
  grip.style.width=(MM(f.w)-MM(f.m[3])-MM(f.m[1]))*z+"px";
  grip.style.top=(y-6)+"px";
  grip.classList.add("on");
}
function hfEditCommit(){
  if(!hfEditing)return;
  const d=doc(),box=$("#hfedit");
  /* innerText statt textContent: erhält die Zeilenumbrüche der Eingabe */
  d[hfEditing.which]={...hfOf(d,hfEditing.which),text:(box.innerText||"").replace(/\n+$/,"")};
  commit();paginate();setPrintHF();
}
function hfEditClose(){
  const box=$("#hfedit");if(box){box.classList.remove("on");box.textContent=""}
  const bar=$("#hfbar");if(bar)bar.classList.remove("on");

  hfEditing=null;
}
function drawHfBar(){

    <div class="sep"></div>

      title="${a==="left"?tr("Links"):a==="center"?tr("Mitte"):tr("Rechts")}">${ICO(ic[a])}</button>`).join("")}
    <div class="sep"></div>
    ${[["{seite}","Seitenzahl einfügen"],["{seiten}","Gesamtseiten einfügen"],
       ["{titel}","Titel einfügen"],["{datum}","Datum einfügen"]].map(([p,n])=>
      `<button class="pill" data-hfp="${p}" title="${tr(n)}">${p}</button>`).join("")}
    <div class="sep"></div>
    <span style="color:var(--ink-soft);font-size:12px" title="${tr("Bis hierher bleibt die Seite frei von Text")}">${tr("Höhe")}</span>
    <input type="number" id="hfHeight" value="${fmtOf(doc()).m[hfEditing.which==="hdr"?0:2]}"
      title="${tr("Bis hierher bleibt die Seite frei von Text")}" style="width:50px;background:var(--paper);
      border:1px solid var(--rule);border-radius:var(--radius);padding:2px 4px">

    <button class="pill" data-hfx="del">${tr("Entfernen")}</button>
    <button class="pill" data-hfx="done">${tr("Fertig")}</button>`;
  bar.classList.add("on");
  /* Erst an den linken Rand setzen, damit Umbruch und Höhe korrekt gemessen werden */
  bar.style.left="8px";bar.style.top="0px";
  const bw=bar.offsetWidth,bh=bar.offsetHeight;
  const r=box.getBoundingClientRect();
  bar.style.left=Math.max(8,Math.min(r.left,innerWidth-bw-10))+"px";
  bar.style.top=(r.bottom+8+bh<innerHeight-8?r.bottom+8:Math.max(8,r.top-bh-8))+"px";
}
/* Höhe des Kopf-/Fußzeilenbandes ziehen. Das verschiebt die Grenze, ab der
   Text steht — also den Seitenrand dieses Dokuments. Vorher verschob der Griff
   nur die Zeile selbst, was aussah, als ließe sich nichts vergrößern.
   Wird in drawWrite() gebunden, da #hfgrip bei jedem Render neu entsteht. */
function hfGripDrag(e){
  if(!hfEditing)return;
  e.preventDefault();
  const grip=$("#hfgrip");grip.classList.add("drag");
  const k=hfEditing.which,pg=hfEditing.page,d=doc();
  const fm=ownFmt(d),idx=k==="hdr"?0:2;
  const z=S.zoom,ph=MM(fm.h)*z,stride=ph+GAP;
  const paper=$("#paper");
  const move=ev=>{
    const y=ev.clientY-paper.getBoundingClientRect().top-pg*stride;
    let mm=Math.round((k==="hdr"?y:ph-y)/(MM(1)*z));
    /* Nicht in die Zeile hinein und nicht so weit, dass kein Text mehr passt */
    const minMm=Math.ceil(hfBand(d,k,z)/(MM(1)*z));
    const maxMm=Math.max(minMm,fm.h-fm.m[k==="hdr"?2:0]-30);
    mm=Math.min(maxMm,Math.max(minMm,mm));
    if(mm===fm.m[idx])return;
    fm.m[idx]=mm;
    paginate();placeHfGrip();
    const box=$("#hfedit");if(box)box.style.top=hfRect(k,pg).top+"px";
    const di=$("#hfHeight");if(di)di.value=mm;
  };
  const up=()=>{
    document.removeEventListener("mousemove",move);
    document.removeEventListener("mouseup",up);
    grip.classList.remove("drag");
    commit();setPrintHF();drawHfBar();
  };
  document.addEventListener("mousemove",move);
  document.addEventListener("mouseup",up);
}
$("#hfbar").addEventListener("mousedown",e=>{if(e.target.closest("button"))e.preventDefault()});
$("#hfbar").addEventListener("click",e=>{

  const al=e.target.closest("[data-hfa]");
  if(al){hfEditCommit();d[k]={...hfOf(d,k),align:al.dataset.hfa};
    $("#hfedit").style.textAlign=al.dataset.hfa;commit();paginate();drawHfBar();return}
  const ph=e.target.closest("[data-hfp]");
  if(ph){$("#hfedit").focus();document.execCommand("insertText",false,ph.dataset.hfp);return}
  const x=e.target.closest("[data-hfx]");
  if(!x)return;
  if(x.dataset.hfx==="del"){d[k]={...hfOf(d,k),on:false};hfEditClose();
    commit();paginate();setPrintHF();toast(tr(k==="hdr"?"Kopfzeile entfernt":"Fußzeile entfernt"));return}

});
$("#hfbar").addEventListener("change",e=>{

  fm.m[idx]=Math.max(minMm,Math.min(fm.h-fm.m[idx===0?2:0]-30,+e.target.value||0));

});
function hfHtml(i,total,ml,mr,z){
  const d=doc(),h=hfOf(d,"hdr"),f=hfOf(d,"ftr"),fm=fmtOf(d);
  let out="";
  const fs=(9*96/72)*z;
  if(h.on)out+=`<div class="hf" style="top:${MM(fm.hd)*z}px;left:${ml}px;right:${mr}px;
    text-align:${h.align};font-size:${fs}px">${hfText(h.text,i+1,total)}</div>`;
  if(f.on)out+=`<div class="hf" style="bottom:${MM(fm.fd)*z}px;left:${ml}px;right:${mr}px;
    text-align:${f.align};font-size:${fs}px">${hfText(f.text,i+1,total)}</div>`;
  return out;
}
function setPrintHF(){

function insertTable(rows,cols,head){

function tableCmd(a,cell){
  if(!cell)return;
  const row=cell.parentElement,table=cell.closest("table");
  const idx=[...row.children].indexOf(cell);
  const mk=tag=>{const e=document.createElement(tag);e.innerHTML="<br>";return e};
  if(a==="rowAbove"||a==="rowBelow"){
    const nr=document.createElement("tr");
    [...row.children].forEach(c=>nr.appendChild(mk(c.tagName==="TH"&&a==="rowAbove"?"th":"td")));
    row.parentNode.insertBefore(nr,a==="rowAbove"?row:row.nextSibling);
  }
  if(a==="colLeft"||a==="colRight"){
    [...table.rows].forEach(r=>{
      const ref=r.children[idx];
      const nc=mk(ref&&ref.tagName==="TH"?"th":"td");
      r.insertBefore(nc,a==="colLeft"?ref:(ref?ref.nextSibling:null));
    });
  }
  if(a==="rowDel"){if(table.rows.length>1)row.remove();else table.remove()}
  if(a==="colDel"){
    if(table.rows[0].children.length>1)[...table.rows].forEach(r=>{const c=r.children[idx];if(c)c.remove()});
    else table.remove();
  }
  if(a==="tblDel")table.remove();
  if(a==="headToggle"){
    const first=table.rows[0];
    const toTh=first.children[0].tagName==="TD";
    [...first.children].forEach(c=>{
      const n=document.createElement(toTh?"th":"td");n.innerHTML=c.innerHTML;c.replaceWith(n)});
  }
  flush();dirty=true;commit();queuePaginate();drawAnchors();
}

let fdIdx=0,fdHits=[];
function fdClear(){
  const ed=$("#editor");if(!ed)return;
  ed.querySelectorAll(".hit").forEach(unwrap);
  fdHits=[];
}
function fdRun(keepIdx){
  const ed=$("#editor");if(!ed)return;
  fdClear();
  const q=$("#fdQ").value;
  if(!q){$("#fdCnt").textContent="—";return}
  const flags="g"+($("#fdCs").checked?"":"i");
  const esc2=q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const rx=new RegExp($("#fdWw").checked?"\\b"+esc2+"\\b":esc2,flags);
  const walk=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);
  const nodes=[];let n;
  while(n=walk.nextNode())if(n.nodeValue&&rx.test(n.nodeValue)){rx.lastIndex=0;nodes.push(n)}
  nodes.forEach(node=>{
    const frag=document.createDocumentFragment();let last=0,m;rx.lastIndex=0;
    while(m=rx.exec(node.nodeValue)){
      if(m.index>last)frag.appendChild(document.createTextNode(node.nodeValue.slice(last,m.index)));
      const sp=document.createElement("span");sp.className="hit";sp.textContent=m[0];
      frag.appendChild(sp);last=m.index+m[0].length;
      if(m[0]==="")rx.lastIndex++;
    }
    frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
  fdHits=[...ed.querySelectorAll(".hit")];
  if(!keepIdx)fdIdx=0;
  fdIdx=Math.min(fdIdx,Math.max(0,fdHits.length-1));
  fdMark();
}
function fdMark(scroll){
  fdHits.forEach((h,i)=>h.classList.toggle("cur",i===fdIdx));
  $("#fdCnt").textContent=fdHits.length?`${fdIdx+1} ${S.settings.uiLang==="en"?"of":"von"} ${fdHits.length}`:tr("kein Treffer");
  if(scroll!==false&&fdHits[fdIdx])fdHits[fdIdx].scrollIntoView({block:"center",behavior:"smooth"});
}
function fdStep(d){
  if(!fdHits.length)return;
  fdIdx=(fdIdx+d+fdHits.length)%fdHits.length;fdMark();
}
function fdOpen(withReplace){
  if(S.mode!=="write")setMode("write");
  const bar=$("#findbar");bar.classList.add("on");
  $("#fdRepRow").style.display=withReplace?"flex":$("#fdRepRow").style.display;
  const sel=getSelection();
  if(sel.rangeCount&&!sel.isCollapsed){
    const t=sel.toString().trim();if(t&&t.length<60)$("#fdQ").value=t;

}
function fdClose(){
  fdClear();$("#findbar").classList.remove("on");

}
function fdReplaceOne(){
  if(!fdHits.length)return;
  const h=fdHits[fdIdx];if(!h)return;

}

const IMG_MAXPX=1500,IMG_Q=.82;
function pickImage(){
  const i=document.createElement("input");i.type="file";i.accept="image/*";
  i.onchange=()=>{const f=i.files[0];if(f)addImage(f)};i.click();

function addImage(file){
  if(!file.type.startsWith("image/")){toast(tr("Keine Bilddatei"));return}
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      let w=im.width,h=im.height;
      const sc=Math.min(1,IMG_MAXPX/Math.max(w,h));
      w=Math.round(w*sc);h=Math.round(h*sc);
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(im,0,0,w,h);
      const png=/png|gif|webp/i.test(file.type);
      const data=cv.toDataURL(png?"image/png":"image/jpeg",IMG_Q);
      insertFigure(data,file.name.replace(/\.[^.]+$/,""));
      if(data.length>1.2e6)toast(tr("Großes Bild — der Browser-Speicher ist begrenzt"));
    };
    im.onerror=()=>toast(tr("Bild konnte nicht gelesen werden"));
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

  const startX=e.clientX,startW=+(selFig.dataset.w||70);
  const align=selFig.style.textAlign||"center";
  /* Zentrierte Bilder wachsen an beiden Seiten, brauchen also den doppelten Faktor */
  const faktor=(align==="center"?2:1)*(figFreeSide(selFig)==="right"?1:-1);
  const move=ev=>{
    const w=Math.min(100,Math.max(10,Math.round(startW+faktor*(ev.clientX-startX)/cw*100)));
    if(w===+(selFig.dataset.w||70))return;
    selFig.dataset.w=w;im.style.width=w+"%";
    const s=$("#ibW");if(s)s.value=w;
    const p=$("#ibP");if(p)p.textContent=w+" %";
    placeFigHandle();
  };
  const up=()=>{
    document.removeEventListener("mousemove",move);
    document.removeEventListener("mouseup",up);
    flush();dirty=true;commit();queuePaginate();drawStatus();
    setTimeout(()=>{drawImgBar();placeFigHandle()},0);
  };
  document.addEventListener("mousemove",move);
  document.addEventListener("mouseup",up);
}

  const w=+(f.dataset.w||70), al=f.style.textAlign||"center";

  bar.innerHTML=`
    <input type="range" id="ibW" min="10" max="100" step="5" value="${w}" title="${tr("Breite")}">

    <button class="tb ${al==="center"?"on":""}" data-ia="center" title="${tr("Zentriert")}">${ICO('<path d="M4 6h16M7 11h10M5 16h14M8 21h8"/>')}</button>

let pvOn=false;
function printPreview(){
  if(S.mode!=="write"){setMode("write");setTimeout(printPreview,60);return}
  flush();setPrintPage();paginate();
  const paper=$("#paper");if(!paper)return;
  const f=fmtOf(doc());
  const pw=MM(f.w)*S.zoom,ph=parseFloat(paper.style.height)||paper.offsetHeight;
  /* Über transform skalieren: die Seitenpositionen stehen in festen Pixeln */
  const s=Math.min(1.1,Math.max(.25,(Math.min(innerWidth-90,880))/pw));
  const klon=paper.cloneNode(true);
  klon.removeAttribute("id");   /* sonst gäbe es #paper zweimal im Dokument */
  klon.querySelectorAll("[id]").forEach(el=>el.removeAttribute("id"));
  klon.querySelectorAll(".hfhint,.hfedit,.hfgrip,.figrsz,.pageflag,.ruler").forEach(el=>el.remove());
  klon.querySelectorAll("[contenteditable]").forEach(el=>el.setAttribute("contenteditable","false"));
  klon.querySelectorAll(".sel").forEach(el=>el.classList.remove("sel"));
  klon.style.cssText+=";position:absolute;left:0;top:0;transform-origin:top left;transform:scale("+s+")";
  const box=document.createElement("div");
  box.style.cssText=`position:relative;width:${pw*s}px;height:${ph*s}px`;
  box.appendChild(klon);
  const w=$("#pvwrap");
  w.innerHTML=`<div class="pvbar">
      <b style="color:var(--ink)">${tr("Druckvorschau")}</b>
      <span>${tr(fmtOf(doc()).n)} &middot; ${pageCount} ${tr(pageCount===1?"Seite":"Seiten")}</span>
      <div style="flex:1"></div>
      <button class="btn" id="pvPrint">${tr("Drucken")}&hellip;</button>
      <button class="btn pri" id="pvClose">${tr("Schließen (Esc)")}</button>
    </div><div class="pvinner"></div>`;
  w.querySelector(".pvinner").appendChild(box);
  w.classList.add("on");w.scrollTop=0;pvOn=true;
  $("#pvClose").onclick=pvClose;
  $("#pvPrint").onclick=()=>{setPrintPage();setTimeout(()=>window.print(),60)};
}

document.addEventListener("keydown",e=>{
  const c=e.ctrlKey||e.metaKey;
  const as=e.altKey&&e.shiftKey&&!c;
  if(as&&e.key.toLowerCase()==="p"){e.preventDefault();
    if($("#ovl").innerHTML)closeOvl();else palette();return}
  if(as&&e.key.toLowerCase()==="m"){e.preventDefault();linkSelection();return}
  if(as&&e.key.toLowerCase()==="k"){e.preventDefault();linkDialog();return}
  if(as&&e.key.toLowerCase()==="f"){e.preventDefault();fdOpen(false);return}
  if(as&&e.key.toLowerCase()==="h"){e.preventDefault();fdOpen(true);return}
  if(as&&e.key.toLowerCase()==="l"){e.preventDefault();cmd("justifyLeft");return}
  if(as&&e.key.toLowerCase()==="e"){e.preventDefault();cmd("justifyCenter");return}
  if(as&&e.key.toLowerCase()==="r"){e.preventDefault();cmd("justifyRight");return}
  if(as&&e.key.toLowerCase()==="n"){e.preventDefault();quickNote();return}
  if(as&&e.key.toLowerCase()==="d"){e.preventDefault();newDocument();return}
  if(e.altKey&&!e.shiftKey&&!c&&["1","2","3"].includes(e.key)){e.preventDefault();setMode({1:"write",2:"notes",3:"gloss"}[e.key]);return}
  if(as&&e.key==="Enter"){e.preventDefault();insertPageBreak();return}
  if(as&&e.key.toLowerCase()==="g"){e.preventDefault();glossSearch();return}
  if(c&&e.key.toLowerCase()==="p"){flush();setPrintPage();return}
  if(as&&e.key.toLowerCase()==="s"){e.preventDefault();commit();toast(tr("Gesichert"));return}
  if(as&&(e.key==="+"||e.key==="=")){e.preventDefault();setZoom(S.zoom+.1);return}
  if(as&&(e.key==="-"||e.key==="_")){e.preventDefault();setZoom(S.zoom-.1);return}
  if(as&&e.key==="0"){e.preventDefault();S.fitPage=true;save();
    if(S.mode==="write"){fitZoom();render()}return}
  if(as&&e.key.toLowerCase()==="z"){e.preventDefault();
    document.body.classList.toggle("focus");const ed=$("#editor");ed&&ed.focus();return}
  if(as&&e.key.toLowerCase()==="t"){e.preventDefault();toggleMemo();return}
  if(as&&e.key.toLowerCase()==="b"){e.preventDefault();readView();return}
  if(as&&e.key.toLowerCase()==="v"){e.preventDefault();printPreview();return}
  if(e.key==="Escape"){
    if(pvOn){pvClose();return}
    if(readOn){readClose();return}
    if(hfEditing){hfEditClose();const ed=$("#editor");ed&&ed.focus();return}
    if(slashOn)slashClose();
    else if($("#findbar").classList.contains("on")&&document.activeElement&&document.activeElement.closest(".findbar"))fdClose();
    else if($("#ovl").innerHTML)closeOvl();
    else if(openNoteId)closeNote();
    else document.body.classList.remove("focus")}
});
window.addEventListener("beforeunload",()=>{flush();save()});

/* ================= Ereignisse Werkzeugleiste ================= */
$("#tools").addEventListener("click",e=>{
  const b=e.target.closest("[data-cmd]");if(b){cmd(b.dataset.cmd);return}
  const fl=e.target.closest("#fSizeList");if(fl){sizeMenu({currentTarget:fl});return}
  const fb=e.target.closest("#foreBtn");if(fb){colorMenu({currentTarget:fb},"fore");return}
  const mb=e.target.closest("#markBtn");if(mb){colorMenu({currentTarget:mb},"hilite");return}
  if(e.target.closest("#imgBtn")){pickImage();return}
  if(e.target.closest("#lnkBtn")){linkDialog();return}
  if(e.target.closest("#tblBtn")){tablePicker();return}
  if(e.target.closest("#pgbBtn")){insertPageBreak();return}
  if(e.target.closest("#indentBtn")){indentBlocks(1);return}
  if(e.target.closest("#outdentBtn")){indentBlocks(-1);return}
  if(e.target.closest("#addNote")){const n=addNote("");render();openNote(n.id,"titel");return}
  const nf=e.target.closest("[data-nf]");
  if(nf){S.noteFilter=nf.dataset.nf;save();render();return}
  const nv=e.target.closest("[data-nv]");
  if(nv){S.noteView=nv.dataset.nv;save();render();return}
  const gc=e.target.closest("[data-gc]");
  if(gc){if(gc.dataset.gc!==curGView()){setGView(gc.dataset.gc);render()}return}
  if(e.target.closest("#gcollAdd")){newGlossColl();return}
  if(e.target.closest("#addG")){openGForm(null);return}
  if(e.target.id==="glossIO"){glossIO();return}
  const s=e.target.closest("[data-sort]");if(s){S.gsort=s.dataset.sort;save();render()}
});
$("#tools").addEventListener("contextmenu",e=>{
  const gc=e.target.closest("[data-gc]");
  if(!gc)return;
  e.preventDefault();collContextMenu(e,gc.dataset.gc);
});
/* Die Farbknöpfe dürfen den Fokus nicht aus dem Editor ziehen, sonst
   verliert execCommand die Textauswahl. */
$("#tools").addEventListener("mousedown",e=>{
  if(e.target.closest("#foreBtn,#markBtn"))e.preventDefault();
});
$("#tools").addEventListener("keydown",e=>{
  if(e.target.id!=="fSize")return;
  if(e.key==="Enter"){e.preventDefault();setFontSize(e.target.value);const ed=$("#editor");ed&&ed.focus()}
  if(e.key==="Escape"){e.preventDefault();drawTools()}
  /* Pfeiltasten wie im Zahlenfeld, das Word ebenfalls bietet */
  if(e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();
    setFontSize((parseFloat(e.target.value)||12)+(e.key==="ArrowUp"?1:-1));
    const f=$("#fSize");if(f){f.focus();f.select()}}
});
$("#tools").addEventListener("change",e=>{
  if(e.target.id==="fFont"){doc().font=e.target.value;$("#editor").style.fontFamily=e.target.value+",serif";commit()}
  if(e.target.id==="fSize")setFontSize(e.target.value);
  if(e.target.id==="fBlock"){document.execCommand("formatBlock",false,e.target.value);$("#editor").focus();dirty=true}
});
$("#tools").addEventListener("input",e=>{
  if(e.target.id==="nSearch"){window._nq=e.target.value;drawNotes()}
  if(e.target.id==="gSearch"){const v=e.target.value;window._gq=v;drawGloss();
    const f=$("#gSearch");f&&f.focus()}
});
$("#pane").addEventListener("click",e=>{
  const pv=e.target.closest("[data-prev]");
  if(pv){jumpTo(pv.dataset.prev,(curOcc[pv.dataset.prev]||0)-1);return}
  const nx=e.target.closest("[data-next]");
  if(nx){jumpTo(nx.dataset.next,(curOcc[nx.dataset.next]||0)+1);return}
  const ul=e.target.closest("[data-unlink]");
  if(ul){const id=ul.dataset.unlink,l=spansOf(id);
    const s=l[curOcc[id]||0]||l[0];if(s)unwrap(s);
    curOcc[id]=0;flush();commit();drawAnchors();toast(tr("Verknüpfung gelöst"));return}
  const nd=e.target.closest("[data-ndel]");
  if(nd){const id=nd.dataset.ndel;
    S.notes=S.notes.filter(x=>x.id!==id);
    spansOf(id).forEach(unwrap);flush();dropAnchorsFor(id);commit();drawAnchors();render();return}
  const ac=e.target.closest(".acard");
  if(ac&&!e.target.closest("[contenteditable]")){jumpTo(ac.dataset.n,curOcc[ac.dataset.n]||0);return}
  const col=e.target.closest("[data-color]");
  if(col){const n=findNote(col.dataset.nid);if(n){n.color=col.dataset.color;
    col.closest(".note").style.background=n.color;commit()}return}
  const d=e.target.closest("[data-del]");
  if(d){if(openNoteId===d.dataset.del)closeNote();
    S.notes=S.notes.filter(y=>y.id!==d.dataset.del);
    dropAnchorsFor(d.dataset.del);commit();render();return}
  const ga=e.target.closest("#gAssign");
  if(ga){const r=ga.getBoundingClientRect();
    assignMenu({clientX:r.left,clientY:r.bottom+4},curGView());return}
  const gm=e.target.closest("#gMore");
  if(gm){const r=gm.getBoundingClientRect();
    collContextMenu({clientX:r.left,clientY:r.bottom+4,preventDefault(){}},curGView());return}
  const ed=e.target.closest("[data-edit]");
  if(ed){openGForm(S.glossary.find(g=>g.id===ed.dataset.edit));return}
  const gd=e.target.closest("[data-gdel]");
  if(gd){if(editingG&&editingG.id===gd.dataset.gdel)editingG=null;   /* sonst zeigt das Formular auf einen entfernten Eintrag */
    S.glossary=S.glossary.filter(g=>g.id!==gd.dataset.gdel);commit();render();return}
  if(e.target.id==="gCancel"){$("#gform").style.display="none";return}
  if(e.target.id==="gSave"){
    const t=$("#gTerm").value.trim();if(!t){$("#gTerm").focus();return}
    if(editingG){editingG.term=t;editingG.def=$("#gDef").value.trim();editingG.cat=$("#gCat").value.trim();editingG.updated=Date.now()}
    else S.glossary.push({id:uid(),term:t,def:$("#gDef").value.trim(),cat:$("#gCat").value.trim(),gid:curGView(),created:Date.now(),updated:Date.now()});
    editingG=null;commit();render();toast(tr("Eintrag gesichert"))}
});
$("#setBtn").onclick=settings;
$("#fileBtn").onclick=fileMenu;
$("#viewBtn").onclick=viewMenu;
$("#focusOut").onclick=()=>{document.body.classList.remove("focus");
  const ed=$("#editor");ed&&ed.focus()};

/* ================= Render ================= */
function render(){
  hfEditClose();
  recalcGoalOthers();
  document.title=tr(doc().title||"Ohne Titel")+" — PureQuill Writer";
  drawTabs();
  document.querySelectorAll(".rb[data-mode]").forEach(b=>b.classList.toggle("on",b.dataset.mode===S.mode));
  drawTools();
  if(S.mode==="write")drawWrite();
  else if(S.mode==="notes")drawNotes();
  else drawGloss();
  drawMemo();   /* blendet sich außerhalb des Schreibmodus selbst aus */
  drawStatus();
}
applyTheme();applyStaticLabels();resetTimer();
if(isTrulyEmpty()){clearShell();startupDialog();}else render();
</script>
