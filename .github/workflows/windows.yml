name: Windows-Fassung bauen

# Baut die Desktop-Fassung. Die Webfassung ist davon unberührt — sie wird
# unverändert aus dem Wurzelverzeichnis über GitHub Pages ausgeliefert.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Abhängigkeiten
        working-directory: desktop
        run: npm ci

      # prepare.mjs holt index.html und dict/ aus dem Wurzelverzeichnis;
      # das deutsche Wörterbuch bleibt bewusst draußen (GPL).
      - name: Installer bauen
        working-directory: desktop
        run: npm run dist
        env:
          # Signaturzertifikat kommt aus den Repository-Secrets, nie aus dem Git.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: purequillwriter-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.appx
            desktop/release/*.msix

      - name: An das Release anhängen
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.appx
            desktop/release/*.msix
